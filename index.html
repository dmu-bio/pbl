    '<div class="scroll"><table><tr><th>팀</th>'+(SESS.scope==='all'?'<th>담당교수</th>':'')+'<th>제출</th><th>내용</th></tr>'+
    teams.map(function(t){ var a=DB.one('activity', function(x){return x.teamId===t.id&&x.week===n;});
      return '<tr><td class="nw">'+esc(t.classId+'-'+t.no+' '+t.name)+'</td>'+(SESS.scope==='all'?'<td class="nw">'+esc(classProf(t.classId))+'</td>':'')+
        '<td class="c">'+(a?'✅':'⬛')+'</td><td class="muted">'+esc(a? (a.did||a.plan||a.stage||'') : '')+'</td></tr>'; }).join('')+
    '</table></div></div>';
}

/* ==========================================================================
   📌 교수 튜터링 판 — 8팀이 한 화면에 늘어섭니다 (2026-08-20 · 10차)
   --------------------------------------------------------------------------
   🔴 교수님 지시(원문): "수업 중에 폰이나 노트북으로 바로 작성하면 되는거니까
      8개 팀마다 작성할 수 있게 해줘. 이때 8개 팀은 팀의 구성원과 가주제 3개를
      모두 가지고 있으니 팀마다 해당 정보는 보이도록 해주고, 팀마다 튜터링
      내용을 작성할 수 있게 해줘."   → 이어서: "지금 말한거는 3주차에 해당하는 거야"

   ▸ 팀을 하나씩 골라 들어갔다 나오는 방식이 아닙니다. 수업 중에 돌아다니며 쓰는
     화면이라 8팀이 죽 늘어서 있고, 팀마다 따로 저장됩니다.
   ▸ 🔴 3주차(1회차)가 확정 사양입니다. 5·6·9·10·12주차는 「틀만」 재사용하며,
     그 주차에 무엇을 보여줄지는 아직 교수님이 정하지 않으셨습니다.
     그래서 주차별 규칙을 손으로 박아 넣지 않고 원칙 하나로만 굴립니다 —
     「그 시점에 그 팀이 가진 것을 자동으로 보여준다」
     (최종 주제가 아직 없으면 가주제 3개 · 정해졌으면 최종 주제).
   ========================================================================== */
var tuOpen = {};    /* 팀 카드를 펼쳤는가 — 기본값은 「아직 안 쓴 팀만 펼침」 */
var tuPeek = {};    /* 그 팀이 낸 내용을 펼쳤는가 */
var tuHist = {};    /* 지난 회차 기록을 펼쳤는가 */
var tuTimer = null; /* 자동 임시 저장 타이머 */

function tuRow(teamId, round){ return DB.one('tutoring', function(x){return x.teamId===teamId && x.round===round;}); }
function tuDone(teamId, round){ var r=tuRow(teamId, round); return !!(r && r.done!==false); }
function tuIsOpen(teamId, round){
  if(tuOpen[teamId]!==undefined) return !!tuOpen[teamId];
  return !tuDone(teamId, round);            /* 안 쓴 팀은 펼쳐 두고, 쓴 팀은 접어 둡니다 */
}

/* ---- 화면 ---- */
function profTutorPanel(n, def, cids){
  var round=def.tutor;
  var teams=DB.get('teams', function(t){return cids.indexOf(t.classId)>=0;})
    .sort(function(a,b){ return a.classId===b.classId ? a.no-b.no : (a.classId<b.classId?-1:1); });
  var wrote=teams.filter(function(t){ return tuDone(t.id, round); }).length;
  var allDone = teams.length>0 && wrote===teams.length;
  var h='<div class="card"><h3>교수 튜터링 '+round+'회차 <span class="muted">— '+n+'주차 수업 중에 바로 씁니다</span></h3>'+
    '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'+
      '<b>'+(SESS.scope==='all'? '3개 강좌 '+teams.length+'팀' : esc(clsFull(myClass())))+'</b>'+
      '<span style="flex:1"></span>'+
      '<span class="bg '+(allDone?'green':'gray')+'">작성 '+wrote+'/'+teams.length+'팀</span>'+
    '</div>'+
    /* 🔵 아직 다 못 쓰셨을 때 [일지 출력]은 「보조」입니다 — 작은 테두리 버튼으로 구역 위쪽 오른편에 */
    (allDone? '' : '<div class="btnrow" style="justify-content:flex-end;margin-top:6px">'+
        '<button class="btn sm" onclick="tlOpen('+round+')">일지 출력 (A4)</button></div>')+
    /* 🔴 16차 — 8팀을 「다 쓰면」 그때 출력이 이 화면의 주된 동작이 됩니다.
       그전까지 이 화면에서 하실 일은 「입력」이고, 출력은 다 쓴 뒤 한 번 하는 일입니다. */
    (allDone
      ? '<div class="note" style="margin-top:8px">8팀을 모두 쓰셨습니다 — 이제 <b>일지를 뽑으시면</b> 됩니다.</div>'+
        '<div class="btnrow" style="margin-top:8px"><button class="btn pri full" onclick="tlOpen('+round+')">교수 튜터링 일지 출력 (A4 1장)</button></div>'
      : '<div class="note" style="margin-top:8px">팀마다 <b>[튜터링 입력]</b>을 눌러 그 자리에서 쓰시면 됩니다.<br>'+
        '자동으로 임시 저장되고, <b>[저장]</b>을 눌러야 일지에 들어갑니다.</div>');
  if(!teams.length) h += '<p class="muted">아직 만들어진 팀이 없습니다. 팀은 2주차(9/2)에 학생들이 만듭니다.</p>';
  h += teams.map(function(t){ return tuCard(t, n, def); }).join('');
  return h + '</div>';
}

function tuCard(t, n, def){
  var round=def.tutor, tu=tuRow(t.id, round), ms=teamMembers(t.id);
  var mine=canEdit(t.classId), open=tuIsOpen(t.id, round);
  var state = (tu && tu.done!==false) ? '<span class="bg green">✅ 작성함</span>'
            : (tu ? '<span class="bg amber">💾 임시</span>' : '<span class="bg gray">⬜ 아직</span>');
  var head = '<div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer" onclick="tuToggle(\''+t.id+'\','+round+')">'+
      '<b>'+t.no+'팀 「'+esc(t.name)+'」</b>'+state+
      (SESS.scope==='all'? '<span class="muted">'+esc(classProf(t.classId))+' 교수</span>':'')+
      '<span style="flex:1"></span><span class="muted">'+(open?'▲ 접기':'▼ 펼치기')+'</span></div>';

  /* 🔴 16차 — 교수님 지적: "팀을 눌러야 입력이 뜨니까 이거는 사용자가 불편해".
     접힌 카드에도 [튜터링 입력]을 내놓습니다. 작은 회색 「▼ 펼치기」만으로는
     여기를 눌러야 쓸 수 있다는 것을 알 길이 없습니다.
     ⚠️ 1-0-5 「화면당 채운 파랑 하나」의 예외 — 8팀이 각각 독립된 작업 단위이고
        이것이 이 화면의 주된 동작입니다. 다만 카드 안에만 두고 가로 전체로 늘리지
        않습니다(파란 막대가 8개 쌓이면 도로 시끄러워집니다). */
  if(!open){
    var tps0=teamTopics(t.id), c0=subCount(t.id);
    var line = (tu && tu.talk)
      ? esc(String(tu.talk).slice(0,40))+(String(tu.talk).length>40?'…':'')
      : '팀원 '+ms.length+'명'+(tps0.length? ' · 가주제 '+tps0.length+'개 ('+c0.done+'/'+c0.need+' 제출)':' · 가주제 없음');
    var wbtn = mine
      ? (tuDone(t.id, round)
          ? '<button class="btn" onclick="tuWrite(&#39;'+t.id+'&#39;,'+round+')">튜터링 수정</button>'
          : '<button class="btn pri" onclick="tuWrite(&#39;'+t.id+'&#39;,'+round+')">튜터링 입력</button>')
      : '<button class="btn" onclick="tuToggle(&#39;'+t.id+'&#39;,'+round+')">내용 보기</button>';
    return '<div class="tucard">'+head+
      '<div class="muted" style="margin-top:2px">'+line+'</div>'+
      '<div class="btnrow" style="margin-top:7px">'+wbtn+'</div></div>';
  }

  var h='<div class="tucard'+(mine&&!tuDone(t.id,round)?' now':'')+'">'+head+
    (t.meaning? '<div class="muted">뜻: '+esc(t.meaning)+'</div>':'')+
    /* ① 팀 구성원 — 이름 + 학번 병기 */
    '<div style="margin-top:6px;font-size:14px"><b>팀원 ('+ms.length+'명)</b> '+
      (ms.length? ms.map(function(m){ return esc(sn(m.st)); }).join(' · ') : '<span class="muted">없음</span>')+'</div>'+
    /* ② 그 시점에 그 팀이 가진 주제 */
    '<div style="margin-top:6px">'+tuTopicBlock(t, n, def)+'</div>'+
    /* ③ 낸 내용을 그 자리에서 펼쳐 봅니다 (창을 옮기지 않게) */
    '<div class="btnrow" style="margin-top:6px">'+
      '<button class="btn sm" onclick="tuPeekToggle(\''+t.id+'\','+round+')">'+
      (tuPeek[t.id]? '▲ 낸 내용 접기':'낸 내용 펼쳐 보기')+'</button></div>'+
    (tuPeek[t.id]? '<div class="note" style="margin-top:6px">'+tuPeekBody(t, n, def)+'</div>':'');

  /* ④ 튜터링 입력칸 — 팀마다 하나, 저장도 팀마다 */
  h += '<div class="hr"></div>';
  if(mine){
    h += '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'+
        '<b>튜터링 '+round+'회차</b><span style="flex:1"></span>'+
        '<span class="muted" id="tuAt_'+t.id+'">'+(tu&&tu.auto? '💾 저장됨 '+esc(String(tu.auto).slice(11)) : '')+'</span></div>'+
      '<label class="f">일자 <span class="req">*</span></label>'+
      '<input type="date" id="tu_d_'+t.id+'" value="'+esc(tu&&tu.date? tu.date : wrow(n).date)+'" oninput="tuTouch(\''+t.id+'\','+round+')">'+
      '<label class="f">튜터링 내용 <span class="req">*</span> <span class="lim">1,000자</span></label>'+
      '<textarea id="tu_t_'+t.id+'" maxlength="1000" oninput="tuTouch(\''+t.id+'\','+round+')">'+esc(tu?tu.talk||'':'')+'</textarea>'+
      '<label class="f">지적·보완 사항 <span class="lim">500자 · 선택</span></label>'+
      '<textarea id="tu_f_'+t.id+'" maxlength="500" oninput="tuTouch(\''+t.id+'\','+round+')">'+esc(tu?tu.fix||'':'')+'</textarea>'+
      '<label class="f">다음까지 할 일 <span class="req">*</span> <span class="lim">300자 — 학생이 가장 잘 보는 곳</span></label>'+
      '<textarea id="tu_n_'+t.id+'" maxlength="300" oninput="tuTouch(\''+t.id+'\','+round+')">'+esc(tu?tu.next||'':'')+'</textarea>'+
      '<div class="btnrow" style="margin-top:8px">'+
        ((tu && tu.done!==false)
          ? fixBtn("saveTutor('"+t.id+"',"+round+")", '수정 저장하기')
          : '<button class="btn pri" onclick="saveTutor(\''+t.id+'\','+round+')">저장</button>')+
      '</div>'+
      '<div class="muted">교수 기록은 <b>마감과 관계없이 언제든</b> 고칠 수 있습니다'+
        ((tu && tu.done!==false)? ' · 고치면 변경 기록에 남습니다':'')+'</div>';
  }else{
    h += (tu && tu.done!==false
      ? '<div class="kv"><span class="k">일자</span><span>'+esc(tu.date)+'</span>'+
        '<span class="k">튜터링</span><span>'+esc(tu.talk)+'</span>'+
        '<span class="k">다음 할 일</span><span>'+esc(tu.next)+'</span></div>'
      : '<p class="muted">아직 기록이 없습니다.</p>')+
      '<div class="note">'+roLabel(t.classId)+'</div>';
  }

  /* ⑤ 🔴 17차 — 「학생 확인」 현황은 없앴습니다. 학생은 튜터링을 보지 않습니다. */

  /* ⑥ 지난 회차 — 접어 둔 채로 쌓입니다. 지난번에 뭘 지도했는지 보며 이번 것을 씁니다 */
  var past=DB.get('tutoring', function(x){return x.teamId===t.id && x.round<round && x.done!==false;})
             .sort(function(a,b){return a.round-b.round;});
  if(past.length){
    h += '<div class="hr"></div><button class="btn sm" onclick="tuHistToggle(\''+t.id+'\','+round+')">'+
      (tuHist[t.id]? '▲ 지난 회차 접기':'🕘 지난 회차 '+past.length+'건 보기')+'</button>'+
      (tuHist[t.id]? past.map(function(p){
        return '<div class="note" style="margin-top:6px"><b>'+p.round+'회차</b> <span class="muted">'+esc(p.date)+'</span><br>'+
          esc(p.talk)+(p.next? '<br><b>다음까지</b> '+esc(p.next):'')+'</div>'; }).join('') : '');
  }
  return h+'</div>';
}

/* 「그 시점에 그 팀이 가진 것」 — 주차별 규칙을 박아 넣지 않습니다 (10차 정정)
   🔴 3주차만 확정: 가주제 3개 + 조사자료 제출 상태.
      나머지 회차는 최종 주제가 있으면 그것을, 없으면 가주제 3개를 그대로 보여 줍니다. */
function tuTopicBlock(t, n, def){
  var fin=DB.one('topics', function(x){return x.teamId===t.id && x.kind==='최종';});
  var tps=teamTopics(t.id);
  if(fin){
    var a=DB.one('activity', function(x){return x.teamId===t.id && x.week===n;});
    return '<b>최종 주제</b> '+esc(fin.title)+' '+
      (fin.ok? '<span class="bg green">✅ 승인</span>':'<span class="bg amber">승인 대기</span>')+
      (fin.summary? '<div class="muted">'+esc(String(fin.summary).slice(0,80))+'</div>':'')+
      '<div class="muted">이 주차 제출 '+(a? '<span class="bg green">✅ 냈음</span>':'<span class="bg gray">⬛ 아직</span>')+'</div>';
  }
  if(!tps.length) return '<span class="muted">아직 2주차 가주제를 정하지 않았습니다.</span>';
  return '<b>가주제 '+tps.length+'개</b>'+tps.map(function(tp,i){
    var s=subRow(t.id, tp.id);
    var mark = (s && s.done)? '<span class="bg green">✅제출</span>'
             : (subHasText(s)? '<span class="bg amber">💾임시</span>':'<span class="bg gray">⬜미제출</span>');
    return '<div style="font-size:14px">'+CIRC[i]+' '+esc(tp.title)+' '+mark+'</div>';
  }).join('');
}

/* 낸 내용 — 3주차는 제출함 3개(교수는 여기서 바로 고칠 수도 있습니다), 그 밖은 그 주차 제출물 */
function tuPeekBody(t, n, def){
  var tps=teamTopics(t.id);
  if(n===3){
    if(!tps.length) return '이 팀은 아직 <b>2주차 가주제</b>를 정하지 않았습니다.';
    var c=subCount(t.id);
    return '<b>조사 자료 '+c.done+'/'+c.need+'</b>'+tps.map(function(tp,i){
      var s=subRow(t.id, tp.id);
      var open=(subOpen===tp.id && subTeam===t.id);
      return '<div class="hr"></div><b>'+CIRC[i]+' '+esc(tp.title)+'</b> '+
        (s&&s.done? '<span class="bg green">✅ 제출</span>' : (subHasText(s)? '<span class="bg amber">💾 임시</span>':'<span class="bg gray">⬛ 미제출</span>'))+
        (s? '<div class="muted">마지막 '+esc((s.done? s.doneAt : s.at)||'-')+' · '+esc(s.done? subDoneActor(s) : subActor(s))+'</div>':'')+
        (subHasText(s)? '<div style="font-size:13px"><b>배경</b> '+esc(s.back||'-')+
            '<br><b>필요성</b> '+esc(s.need||'-')+'<br><b>조사 방법</b> '+esc(s.how||'-')+
            (s.refs? '<br><b>참고</b> '+esc(s.refs):'')+'</div>' : '')+
        (open? subFormHtml(t, tp, canEdit(t.classId))
             : '<div class="btnrow" style="margin-top:5px"><button class="btn sm" onclick="subOpenBox(\''+t.id+'\',\''+tp.id+'\')">'+
               (canEdit(t.classId)? '✏️ 이 칸 수정':'펼쳐 보기')+'</button></div>');
    }).join('');
  }
  return teamWorkPeek(t.id, n).replace(/^<div class="note[^>]*>📄 /,'').replace(/<\/div>$/,'');
}

/* ---- 펼치기·접기 (펼치기 전에 쓰던 글을 먼저 저장합니다 — 다시 그리면 날아가므로) ---- */
function tuFlush(round){
  DB.get('teams').forEach(function(t){ if($('tu_t_'+t.id)) tuAuto(t.id, round); });
}
function tuToggle(tid, round){ tuFlush(round); tuOpen[tid] = !tuIsOpen(tid, round); render(); }
/* 🔴 [튜터링 입력]을 누르면 — 펼치고, 그 자리에서 바로 쓰기 시작할 수 있게 커서를 넣습니다.
   수업 중에 8팀을 도는 화면이라 「한 번 눌러 바로 쓰기」가 되어야 합니다 (16차). */
function tuWrite(tid, round){
  tuFlush(round); tuOpen[tid]=true; render();
  setTimeout(function(){
    var el=$('tu_t_'+tid); if(!el) return;
    try{ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
    try{ el.scrollIntoView({block:'center'}); }catch(e){}
  }, 0);
}
function tuPeekToggle(tid, round){ tuFlush(round); tuPeek[tid] = !tuPeek[tid]; render(); }
function tuHistToggle(tid, round){ tuFlush(round); tuHist[tid] = !tuHist[tid]; render(); }

/* ---- 🔴 자동 임시 저장 ----
   수업 중엔 전화가 오고 화면이 꺼집니다. 손을 2초 멈추면 저장합니다.
   ⚠️ 여기서 render()를 부르면 안 됩니다 — 글자를 치는 중에 화면을 다시 그리면
      커서가 튀고 입력이 끊깁니다. 그래서 「저장됨 시각」 글자만 직접 바꿉니다. */
function tuRead(tid){
  return {date:val('tu_d_'+tid), talk:val('tu_t_'+tid), fix:val('tu_f_'+tid), next:val('tu_n_'+tid)};
}
function tuTouch(tid, round){
  var el=$('tuAt_'+tid); if(el) el.textContent='✏️ 입력 중…';
  if(tuTimer) clearTimeout(tuTimer);
  tuTimer=setTimeout(function(){ tuAuto(tid, round); }, 2000);
}
function tuAuto(tid, round){
  if(!$('tu_t_'+tid)) return false;
  var d=tuRead(tid);
  if(!d.talk && !d.fix && !d.next) return false;   /* 빈 칸은 줄을 만들지 않습니다 */
  var ex=tuRow(tid, round);
  var patch={date:d.date, talk:d.talk, fix:d.fix, next:d.next, auto:nowStr()};
  if(ex) DB.set('tutoring', ex.id, patch);
  else { patch.teamId=tid; patch.round=round; patch.done=false; patch.nextdate=''; DB.add('tutoring', patch); }
  var el=$('tuAt_'+tid); if(el) el.textContent='💾 저장됨 '+nowStr().slice(11);
  return true;
}

/* ==========================================================================
   🖨 교수 튜터링 일지 — A4 세로 1장 출력물 (2026-08-21 · 12차)
   --------------------------------------------------------------------------
   🔴 교수님 지시(원문):
      "교수의 경우, 3주차, 5주차, 6주차, 9주차, 10주차, 12주차 총 6번의 팀별
       교수튜터링을 진행해야하는데, 주차마다 교수는 팀별 논의하고, 튜터링 했던
       내용들을 일지 형식으로 정리를 해야돼. 그래서 8개 팀에 대한 튜터링 내용을
       기록할 수 있도록 하고, 결과들은 A4용지 1장에 정리되서 출력될 수 있는
       출력물 형태로 만들어주면 좋겠어. 출력물에는 8개 팀의 팀명, 팀구성원,
       팀주제 내용이 기본적으로 들어가고, 교수가 튜터링한 내용들이 같이
       들어가도록. 그리고 제목은 '교수 튜터링 일지(00차)' 1차부터 6차까지
       순서대로 나오도록, 일지이므로, 요일과 주차가 모두 표기될 수 있도록 해줘"
      (원문 「투터링」은 오타가 분명하여 「튜터링」으로 씁니다.)

   ▸ 회차 ↔ 주차 대응은 손으로 박지 않습니다. WEEKDEF 의 tutor 표시에서 뽑고,
     날짜는 주차설정(weeks 표)에서 읽습니다 — 휴강·보강으로 날짜가 바뀌어도
     일지가 저절로 따라갑니다. 요일도 그 날짜에서 계산합니다.
   ▸ 화면 미리보기와 인쇄 결과가 같도록 종이 크기를 mm 로 못박고
     @page margin:0 으로 두었습니다. 화면에서는 폭에 맞게 축소만 합니다.
   ▸ A4 한 장을 넘기면 9pt → 8.5pt → 8pt 로 줄여 맞추고, 8pt 로도 안 되면
     ⛔ 잘라내지 않고 화면에 「몇 장이 되는지 · 어느 팀 글이 긴지」를 알립니다.
   ========================================================================== */

/* ---- 회차 ↔ 주차 (WEEKDEF 에서 자동으로) ---- */
function tlRounds(){
  return WEEKDEF.filter(function(w){ return !!w.tutor; })
    .sort(function(a,b){ return a.tutor-b.tutor; })
    .map(function(w){ return { round:w.tutor, week:w.n }; });
}
function tlWeekOf(round){
  var r=tlRounds().filter(function(x){return x.round===round;})[0];
  return r? r.week : null;
}
function tlTotal(){ return tlRounds().length; }

/* 「2026년 9월 9일 (수)」 — 날짜는 주차설정에서, 요일은 계산해서 */
function tlLongDate(iso){
  if(!iso) return '(주차설정에 날짜가 없습니다)';
  var p=String(iso).split('-');
  return (+p[0])+'년 '+(+p[1])+'월 '+(+p[2])+'일 ('+dow(iso)+')';
}
function tlClassTime(cid){
  var c=DB.one('classes', cid);
  var t=(c && c.time) ? String(c.time) : '10:00~13:00';
  return t.split(' ')[0];                       /* 「(2·3·4교시)」는 일지에서 뺍니다 */
}
function tlRoom(cid){ var c=DB.one('classes', cid); return (c&&c.room)? c.room : ''; }

/* 동명이인만 학번을 병기합니다 — 이름만으로 충분한 출력물이라 나머지는 이름만.
   (F2·F3 에 「학생26」이 각각 있어 학기말 6장을 나란히 놓으면 헷갈립니다.) */
function tlDupName(name){
  return DB.get('students', function(x){
    return x.active!==false && normName(x.name)===normName(name); }).length > 1;
}
function tlMemberName(st){
  var s = st.name + (tlDupName(st.name)? '('+st.no+')' : '');
  return esc(s);
}

/* ---- 그 시점에 그 팀이 가진 주제 (10차 원칙 그대로) ---- */
function tlTopicText(t){
  var fin=DB.one('topics', function(x){return x.teamId===t.id && x.kind==='최종';});
  if(fin) return '<b>최종</b> '+esc(fin.title);
  var tps=teamTopics(t.id);
  if(!tps.length) return '<span class="dim">가주제 미정</span>';
  return '<b>가주제</b> '+tps.map(function(tp,i){
    return CIRC[i]+esc(tp.title); }).join(' ');
}

/* ---- 한 팀의 줄 ---- */
function tlTeamRow(t, round, no){
  if(!t){
    return '<tr><td class="tno"><b>'+no+'팀</b></td>'+
      '<td class="dim">(팀 미구성)</td><td class="dim c">— 미작성 —</td></tr>';
  }
  var tu=DB.one('tutoring', function(x){return x.teamId===t.id && x.round===round;});
  var wrote = !!(tu && tu.done!==false);        /* 임시 저장만 된 글은 일지에 넣지 않습니다 */
  var ms=teamMembers(t.id);

  var names = ms.length
    ? ms.map(function(m){ return tlMemberName(m.st); }).join('·')
    : '<span class="dim">팀원 없음</span>';

  var talk;
  if(!wrote){
    talk = '<span class="dim c blk">— 미작성 —</span>';
  }else{
    talk = '<div>'+esc(tu.talk||'')+'</div>'+
      (tu.fix ? '<div class="sub"><b>지적</b> '+esc(tu.fix)+'</div>' : '')+
      (tu.next? '<div class="sub"><b>다음까지</b> '+esc(tu.next)+'</div>' : '');
  }

  return '<tr data-team="'+esc(t.no+'팀 「'+t.name+'」')+'"><td class="tno"><b>'+t.no+'팀</b><br>「'+esc(t.name)+'」</td>'+
    '<td><div class="mem">'+names+'</div><div class="tpc">'+tlTopicText(t)+'</div></td>'+
    '<td class="talk">'+talk+'</td></tr>';
}

/* ---- 종이 한 장 ---- */
function tlSheet(round, cid){
  var week=tlWeekOf(round), w=week? wrow(week) : null;
  var iso = w? w.date : '';
  var cap = teamCap();
  var teams=DB.get('teams', function(t){return t.classId===cid;})
    .sort(function(a,b){return a.no-b.no;});
  var byNo={}; teams.forEach(function(t){ byNo[t.no]=t; });

  var rows='';
  for(var i=1;i<=cap;i++) rows += tlTeamRow(byNo[i]||null, round, i);

  var wrote=teams.filter(function(t){
    var tu=DB.one('tutoring', function(x){return x.teamId===t.id && x.round===round;});
    return !!(tu && tu.done!==false); }).length;

  return '<div class="a4sheet" data-round="'+round+'" data-cid="'+cid+'">'+
    '<div class="a4in">'+
      '<div class="tlhead">'+
        '<div class="tltitle">교수 튜터링 일지 ('+round+'차)</div>'+
        '<div class="tlrule"></div>'+
        '<table class="tlmeta"><tr>'+
          '<td class="k">교과목</td><td class="v">바이오기초설계 (2026학년도 2학기)</td>'+
          '<td class="k">강좌</td><td class="v">'+esc(cid)+(tlRoom(cid)?' ('+esc(tlRoom(cid))+')':'')+'</td></tr>'+
        '<tr>'+
          '<td class="k">담당교수</td><td class="v">'+esc(classProf(cid))+'</td>'+
          '<td class="k">회차</td><td class="v">'+round+'차 / 총 '+tlTotal()+'회</td></tr>'+
        '<tr>'+
          '<td class="k">주차</td><td class="v">'+(week? week+'주차':'-')+'</td>'+
          '<td class="k">일시</td><td class="v">'+esc(tlLongDate(iso))+' '+esc(tlClassTime(cid))+'</td></tr>'+
        '</table>'+
      '</div>'+
      '<table class="tlt">'+
        '<colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>'+
        '<thead><tr><th>팀</th><th>팀 구성원 · 팀 주제</th><th>튜터링 내용</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>'+
      '<div class="tlfoot">'+
        '<span>작성 '+wrote+'/'+teams.length+'팀'+(teams.length<cap? ' · 미구성 '+(cap-teams.length)+'팀':'')+'</span>'+
        '<span class="sp"></span>'+
        (DB.d && DB.d.__demo ? '<span class="warn">※ 예시(가짜) 데이터입니다</span>&nbsp;&nbsp;' : '')+
        '<span>출력일 '+esc(nowStr().slice(0,10))+'</span>'+
      '</div>'+
    '</div></div>';
}

function tlGo(r, cid){ go('tulog', {r:r, cid:cid}); }
/* 다른 화면(홈·튜터링 판)에서 부르는 문 — 내 강좌를 기본으로 엽니다 */

function tlPrint(){ tlFit(); window.print(); }

/* ---- 1mm 이 화면에서 몇 픽셀인가 (배율이 달라도 이 자로 잽니다) ---- */
function tlPxPerMm(){
  var d=document.createElement('div');
  d.style.cssText='position:absolute;left:-9999px;top:0;width:100mm;height:1px';
  document.body.appendChild(d);
  var v=d.getBoundingClientRect().width/100;
  document.body.removeChild(d);
  return v || 3.7795;
}

/* ==========================================================================
   🔴 A4 한 장에 맞추기
   --------------------------------------------------------------------------
   ① 9pt 로 재 보고, 넘치면 8.5pt → 8pt 로 한 단계씩 줄입니다.
   ② 8pt 로도 넘치면 ⛔ 잘라내지 않고 화면에 알립니다 (몇 장 · 어느 팀).
   ③ 8pt 아래로는 내리지 않습니다 — 못 읽는 종이는 소용이 없습니다.
   ========================================================================== */
var TL_STEPS = [9, 8.5, 8];
function tlFit(){
  var sheets=document.querySelectorAll('.a4sheet');
  if(!sheets.length) return;
  var per=tlPxPerMm();
  var avail=(297 - 26) * per;                   /* 위아래 여백 13mm 씩 뺀 속 높이 */
  var over=[];

  for(var i=0;i<sheets.length;i++){
    var sh=sheets[i], inner=sh.querySelector('.a4in');
    /* 흐르는 인쇄본(설문 결과)은 여러 장이 정상입니다 — 글자를 줄이지 않습니다 */
    if(sh.className.indexOf('flow')>=0) continue;
    var used=TL_STEPS[TL_STEPS.length-1], fit=false, hh=0;
    for(var s=0;s<TL_STEPS.length;s++){
      sh.style.setProperty('--tlfs', TL_STEPS[s]+'pt');
      hh=inner.getBoundingClientRect().height;
      if(hh <= avail+1){ used=TL_STEPS[s]; fit=true; break; }
    }
    sh.style.setProperty('--tlfs', used+'pt');
    if(!fit){
      hh=inner.getBoundingClientRect().height;
      over.push({ what: sh.getAttribute('data-what') ||
                        (sh.getAttribute('data-round')+'차 튜터링 일지'),
                  pages:Math.round(hh/avail*10)/10,
                  who:tlLongTeams(sh) });
    }
  }

  /* 화면 폭에 맞게 축소 — 종이 크기는 그대로 두고 보기만 줄입니다 */
  var wrap=document.querySelector('.a4wrap'), scale=document.querySelector('.a4scale');
  if(wrap && scale){
    scale.style.transform='none';
    var want=210*per, have=wrap.clientWidth||want;
    var k=Math.min(1, have/want);
    scale.style.transform='scale('+k+')';
    scale.style.transformOrigin='top left';
    wrap.style.height=(scale.getBoundingClientRect().height)+'px';
  }

  var box=document.getElementById('tlWarn');
  if(!box) return;
  if(!over.length){ box.innerHTML=''; return; }
  box.innerHTML = over.map(function(o){
    return '<div class="note a" style="margin-top:10px">⚠️ <b>'+esc(o.what)+' — 내용이 길어 A4 한 장을 넘습니다'+
      '(약 '+o.pages+'장).</b> 줄이시거나 2장으로 인쇄하십시오.'+
      (o.who.length? '<br>글이 긴 줄: <b>'+o.who.join(' · ')+'</b>':'')+
      '<br><span class="muted">글자는 8pt까지 줄였습니다. 더 줄이면 읽기 어려워져 여기서 멈춥니다. '+
      '내용은 <b>하나도 잘라내지 않았습니다.</b></span></div>';
  }).join('');
}

/* 어느 팀 글이 긴가 — 실제로 그려진 줄 높이로 고릅니다 */
function tlLongTeams(sheet){
  var trs=sheet.querySelectorAll('.tlt tbody tr, .sct tbody tr'), arr=[];
  for(var i=0;i<trs.length;i++){
    var td=trs[i].querySelector('.talk, .how');
    arr.push({ h:trs[i].getBoundingClientRect().height,
               nm:(trs[i].getAttribute('data-team') || (i+1)+'번째 줄'),
               ln:td? td.innerText.replace(/\s/g,'').length : 0 });
  }
  arr.sort(function(a,b){return b.h-a.h;});
  return arr.slice(0,2).filter(function(x){return x.ln>0;})
            .map(function(x){ return x.nm+' (약 '+x.ln+'자)'; });
}

/* ==========================================================================
   👥 학생 명단 관리
   ★ 2026-08-20 (5차) 교수님 지시로 전면 개편
     "따로 회원가입 자체가 필요 없을 듯 해. 추가가 필요하면 교수가 명단에
      추가할 수 있게 하면 될 것 같아 이름하고 학번으로"
   ⛔ 회원가입이 없습니다. 학생은 출석부로 미리 등록되고 로그인만 합니다.
      그래서 이 화면이 교수님의 유일한 명단 통제 수단입니다
      — 확인 · 한 명 추가 · 수정 · 내보내기 · 삭제.
   ========================================================================== */
var stuQ='', stuSort='no', stuFilter='all', stuClass='', stuEdit=null, stuDel=null, stuAddOpen=false;

/* 그 학생이 낼 것을 얼마나 냈나 (열려 있는 주차 기준) */
function submitSummary(st){
  var open = WEEKDEF.filter(function(d){ return d.kind!=='notice' && d.kind!=='result' && wState(d.n)!=='닫힘'; });
  var done = open.filter(function(d){ return hasSubmitted(st, d.n); }).length;
  return {done:done, all:open.length};
}

function admStudents(){
  var cids = visibleClasses();
  var all  = liveStudents(cids, true);
  var live = all.filter(function(s){return s.active!==false;});
  var warnList = live.filter(function(s){ return stuWarn(s).length; });
  var cnt = {noteam:0, dupno:0, dupname:0, nologin:0};
  warnList.forEach(function(s){ var w=stuWarn(s);
    if(w.indexOf('팀 없음')>=0) cnt.noteam++;
    if(w.indexOf('중복 학번')>=0) cnt.dupno++;
    if(w.indexOf('동명이인')>=0) cnt.dupname++;
    if(w.indexOf('아직 로그인 안 함')>=0) cnt.nologin++; });
  var out = all.filter(function(s){return s.active===false;});

  /* 걸러내기 */
  var list = all.filter(function(s){
    if(stuFilter==='noteam')  return s.active!==false && stuWarn(s).indexOf('팀 없음')>=0;
    if(stuFilter==='dupno')   return s.active!==false && stuWarn(s).indexOf('중복 학번')>=0;
    if(stuFilter==='dupname') return s.active!==false && stuWarn(s).indexOf('동명이인')>=0;
    if(stuFilter==='nologin') return s.active!==false && stuWarn(s).indexOf('아직 로그인 안 함')>=0;
    if(stuFilter==='out')     return s.active===false;
    return s.active!==false;
  });
  if(stuClass) list = list.filter(function(s){return s.classId===stuClass;});
  if(stuQ){ var q=stuQ.toLowerCase();
    list = list.filter(function(s){ return s.name.toLowerCase().indexOf(q)>=0 || s.no.indexOf(q)>=0; }); }
  list.sort(function(a,b){
    if(stuSort==='name') return a.name.localeCompare(b.name) || a.no.localeCompare(b.no);
    if(stuSort==='team'){ var ta=teamOf(a), tb=teamOf(b);
      return (ta? ta.classId+ta.no : 'zz').localeCompare(tb? tb.classId+tb.no : 'zz') || a.no.localeCompare(b.no); }
    return a.no.localeCompare(b.no);
  });

  /* 🔴 팀 편성 전에는 「팀 없음」이, 첫 수업 전에는 「로그인 안 함」이 이상이 아닙니다
        — 예정된 상태를 경고로 띄우면 진짜 문제가 묻힙니다 (2026-08-20 교수님·소장 지적) */
  var pending = cids.filter(teamPending);
  var notYet  = cids.filter(loginPending);

  var h='<div class="card"><h2>학생 명단</h2>'+
    '<p class="muted">지금 범위: <b>'+(SESS.scope==='all'? '3개 강좌 전체':esc(clsFull(myClass())))+'</b> · '+
    cids.map(function(c){ return c+' '+live.filter(function(s){return s.classId===c;}).length+'명'; }).join(' · ')+
    (cids.length>1? ' <b>(총 '+live.length+'명)</b>':'')+
    ' <span class="muted">(내보낸 학생 '+out.length+'명 제외)</span></p>'+
    (pending.length
      ? '<div class="note g">✅ <b>명단이 준비됐습니다</b> — 출석부로 '+live.length+'명이 등록돼 있습니다. '+
        '<b>팀은 2주차(9/2)에 정해집니다</b>'+(pending.length<cids.length? ' ('+pending.join('·')+')':'')+'.'+
        (notYet.length===cids.length? '<br><span class="muted">아직 아무도 로그인하지 않았습니다 — <b>1주차(8/26) 수업에서 함께 들어옵니다.</b></span>':'')+'</div>'
      : '<div class="note g">✅ <b>회원가입이 없습니다.</b> 학생은 <b>출석부로 미리 등록</b>되고 이름+학번으로 로그인만 합니다. '+
        '명단에 없는 사람은 아예 들어오지 못합니다.</div>');

  var onlyMild = warnList.length && !cnt.noteam && !cnt.dupno;
  if(!warnList.length && notYet.length===cids.length) onlyMild=true;
  h += (warnList.length
    ? '<div class="note '+(onlyMild?'a':'r')+'"><b>'+(onlyMild?'○':'⚠️')+' 확인 필요 '+warnList.length+'명</b><br>'+
      '<span class="muted">'+
      (cnt.noteam? '🔴 팀 없음 '+cnt.noteam+'명 · ':'')+
      (cnt.dupno? '🔴 중복 학번 '+cnt.dupno+'명 · ':'')+
      '○ 동명이인 '+cnt.dupname+'명'+(cnt.nologin? ' · ○ 아직 로그인 안 함 '+cnt.nologin+'명':'')+'</span>'+
      (cnt.nologin? '<br><span class="muted">▸ <b>아직 로그인 안 함</b>은 <b>다른 학생들은 들어왔는데</b> 못 들어온 학생입니다. '+
        '이름 표기가 출석부와 다르거나, 앱 주소를 못 찾은 경우가 대부분입니다 — <b>그 자리에서 [✏️ 수정]</b>으로 해결됩니다.</span>':'')+
      '</div>'
    : '<div class="note g">✅ 확인이 필요한 학생이 없습니다.</div>');

  var chips = [['all','전체 '+live.length]];
  if(cnt.noteam) chips.push(['noteam','🔴 팀 없음 '+cnt.noteam]);   /* 팀 편성 전에는 아예 안 그립니다 */
  if(cnt.dupno)  chips.push(['dupno','🔴 중복 학번 '+cnt.dupno]);
  chips.push(['dupname','○ 동명이인 '+cnt.dupname]);
  if(cnt.nologin) chips.push(['nologin','○ 로그인 안 함 '+cnt.nologin]);
  chips.push(['out','내보냄 '+out.length]);
  h += '<div class="btnrow">'+
    chips
    .map(function(x){ return '<button class="btn sm '+(stuFilter===x[0]?'pri':'')+'" onclick="stuFilter=&#39;'+x[0]+'&#39;;render()">'+x[1]+'</button>'; }).join('')+
    '</div>';
  if(SESS.scope==='all'){
    h += '<div class="btnrow" style="margin-top:6px"><span class="muted" style="align-self:center">강좌별 보기</span>'+
      [['','전체']].concat(CIDS.map(function(c){ return [c, c+' '+classProf(c)]; })).map(function(x){
        return '<button class="btn sm '+(stuClass===x[0]?'pri':'')+'" onclick="stuClass=&#39;'+x[0]+'&#39;;render()">'+esc(x[1])+'</button>'; }).join('')+'</div>';
  }
  h += '<label class="f">🔍 찾기 <span class="lim">이름 또는 학번</span></label>'+
    '<input type="text" id="stuQ" value="'+esc(stuQ)+'" oninput="stuQ=this.value;clearTimeout(window._sq);window._sq=setTimeout(render,250)">'+
    '<div class="btnrow" style="margin-top:6px"><span class="muted" style="align-self:center">정렬</span>'+
    [['no','학번순'],['name','이름순'],['team','팀순']].map(function(x){
      return '<button class="btn sm '+(stuSort===x[0]?'pri':'')+'" onclick="stuSort=&#39;'+x[0]+'&#39;;render()">'+x[1]+'</button>'; }).join('')+'</div></div>';

  /* ⭐ 학생 한 명 직접 추가 — 교수님 지시 ②의 핵심 */
  h += stuAddCard();

  if(stuEdit) h += stuEditPanel(stuEdit);
  if(stuDel)  h += stuDelPanel(stuDel);

  h += '<div class="card"><h3>명단 <span class="muted">'+list.length+'명</span></h3><div class="scroll"><table>'+
    '<tr><th>학생</th>'+(SESS.scope==='all'?'<th class="nw">담당교수</th>':'')+'<th class="c nw">처리</th></tr>'+
    list.map(function(s){
      var t=teamOf(s), w=stuWarn(s), ss=submitSummary(s), ed=canEdit(s.classId);
      return '<tr'+(s.active===false?' style="opacity:.55"':'')+'>'+
        /* 폰 폭(375px)에 다 들어가게 한 칸으로 모았습니다.
           ⚠️ 경고는 이름 바로 옆 — 교수님이 가장 먼저 보셔야 할 것이므로 */
        '<td>'+esc(sn(s))+' '+
          (w.length? w.map(function(x){return '<span class="bg '+warnColor(x)+'">'+x+'</span>';}).join(' ') : '')+
          '<br><span class="muted" style="font-size:13px">'+
          (t? esc(t.no+'팀 '+t.name) : (teamPending(s.classId)? '팀 미정':'팀 없음'))+
          ' · 등록 '+esc((s.regAt||'-').slice(5,16))+' · 제출 '+ss.done+'/'+ss.all+
          '</span></td>'+
        (SESS.scope==='all'?'<td class="nw">'+esc(classProf(s.classId))+'</td>':'')+
        /* ⭐ 2026-08-20 소장 지적 — 빨간 [내보내기]가 줄마다 반복돼 화면이 불안해 보였습니다.
              평소엔 흐린 회색 작은 글씨로 두고, [✏️ 수정]만 또렷하게. 경고는 눌렀을 때 뜹니다. */
        '<td class="c nw" style="padding:4px">'+(ed
          ? (s.active===false
             ? '<button class="btn sm ok" onclick="reviveStudent(&#39;'+s.id+'&#39;)">되돌리기</button>'
             : '<button class="btn fix sm" style="display:block;margin:0 auto 2px" onclick="stuEdit=&#39;'+s.id+'&#39;;stuDel=null;render()">✏️ 수정</button>'+
               '<button class="quiet" onclick="stuDel=&#39;'+s.id+'&#39;;stuEdit=null;render()">내보내기</button>')
          : '<span class="muted">🔒 조회만</span>')+'</td></tr>';
    }).join('')+'</table></div>'+
    (list.length? '' : '<p class="muted">해당하는 학생이 없습니다.</p>')+
    '<div class="btnrow" style="margin-top:8px"><button class="btn" onclick="doCSV(&#39;students&#39;)">이 명단 CSV로 내려받기</button></div>'+
    '<div class="note">🔒 교번은 이 화면에도, 내려받는 CSV에도 <b>나오지 않습니다</b>. 이름 칸과 학번 칸은 <b>따로</b> 나갑니다.</div></div>';
  return h;
}

      : '<div class="note b" style="margin-top:10px">강좌는 <b>'+esc(clsFull(myClass()))+'</b>로 자동 지정됩니다. '+

    '<div class="note a" style="margin-top:10px">⚠️ 넣으신 뒤 학생에게 <b>"이름과 학번으로 로그인하세요"</b>라고 알려 주십시오. '+
    '학생이 스스로 가입하는 길은 이 앱에 없습니다.</div></div>';

function addStudent(){
  var nm=val('ad_name'), no=val('ad_no');
  var cid = isSuper()? ($('ad_cls')? $('ad_cls').value : myClass()) : myClass();
  if(!canEdit(cid)){ toast('자기 강좌에만 넣을 수 있습니다.'); return; }
  if(normName(nm).length<2 || normName(nm).length>10){ toast('이름은 2~10자입니다.'); return; }
  if(!/^\d{6,10}$/.test(no)){ toast('학번은 숫자로만 넣어 주세요 (6~10자리).'); return; }
  var dup = DB.one('students', function(x){return x.no===no;});
  if(dup){ toast('⛔ 이미 있는 학번입니다 — '+sn(dup)+' ('+dup.classId+')'); return; }
  if(typeof DBR!=='undefined' && DBR.on){
    /* 🆕 (26차) 직접 INSERT 하지 않고 서버 함수로 — 일반 교수도 저장됩니다 */
    DBR.bar('넣는 중입니다… 잠시만 기다려 주십시오.', 'amber');
    DBR.addStudentGroups([{classId:cid, rows:[{no:no, name:nm}]}], {}, function(tot){
      DBR.bar('','');
      if(tot.added){
        DB.log('학생 한 명 추가', nm+' ('+no+') → '+cid);
        stuAddOpen=false; toast(nm+' ('+no+') — '+cid+' 강좌 명단에 넣었습니다.'); render();
      }else{
        toast('⛔ 넣지 못했습니다 (이미 있는 학번이거나 값이 올바르지 않습니다).'); render();
      }
    }, function(errs){ DBR.bar('',''); var e=errs&&errs[0];
      toast('🔴 저장하지 못했습니다: '+((e&&(e.msg||e.status))||'서버 오류')+'. 다시 시도해 주세요.'); });
    return;
  }
  var acc = DB.add('accounts',{name:nm,num:no,role:'student',classId:cid,active:true});
  DB.add('students',{accountId:acc.id,name:nm,no:no,classId:cid,teamId:null,active:true,
    regAt:nowStr(), lastLoginAt:''});
  DB.add('consents',{no:no,ok:false,at:'',ver:'v1(초안)'});
  DB.log('학생 한 명 추가', nm+' ('+no+') → '+cid);
  stuAddOpen=false; toast(nm+' ('+no+') — '+cid+' 강좌 명단에 넣었습니다.'); render();
}

  /* ⚠️ DB.one 은 살아 있는 객체를 그대로 돌려줍니다. 고치기 전 값을 먼저 베껴 둡니다

      if(tm!==(oldTeam||'')){
        var m2=DB.one('members', function(x){return x.studentId===id;});
        if(m2) DB.del('members', m2.id);
        if(tm) DB.add('members',{teamId:tm,studentId:id,role:'팀원'});
      }

    DB.set('students', id, {name:nm, no:no, classId:cls, teamId: tm||null});
    DB.log('학생 정보 수정', was.name+' ('+was.no+') → '+nm+' ('+no+')'+(moved? ' · '+was.cls+' → '+cls+' (팀에서 빠짐)':''));
    if(SESS.me && SESS.me.id===id) SESS.me=DB.one('students', id);
    stuEdit=null; toast('저장했습니다.'); render();
  };

    APP.confirm(sn(s)+'을(를) '+clsFull(cls)+' 강좌로 옮깁니다.\n\n'+
      (t? '· 지금 '+t.no+'팀 「'+t.name+'」에서 빠집니다\n· 지금까지의 팀 제출물은 '+t.no+'팀에 그대로 남습니다\n'
        : '· 지금 팀이 없습니다\n')+

/* 한 학생의 자취를 전부 지웁니다 — 출석부 「전부 새로 넣기」도 이 함수를 씁니다 */
function purgeStudent(id, s){
  s = s || DB.one('students', id); if(!s) return;
  ['peerTeam','peerMember'].forEach(function(tb){
    DB.get(tb, function(x){return x.evaluator===id || x.studentId===id;}).forEach(function(x){ DB.del(tb, x.id); });
  });
  DB.get('answers',  function(x){return x.studentId===id;}).forEach(function(x){ DB.del('answers', x.id); });
  DB.get('attend',   function(x){return x.studentId===id;}).forEach(function(x){ DB.del('attend', x.id); });
  DB.get('members',  function(x){return x.studentId===id;}).forEach(function(x){ DB.del('members', x.id); });
  DB.get('consents', function(x){return x.no===s.no;}).forEach(function(x){ DB.del('consents', x.id); });
  DB.del('accounts', s.accountId);
  DB.del('students', id);
}

/* --------------------------------------------------------------------------
   읽어내기 — 어떤 모양으로 와도 학번과 이름만 찾습니다
   -------------------------------------------------------------------------- */
function splitCells(line){
  if(line.indexOf('\t')>=0) return line.split('\t');
  if(line.indexOf(',')>=0)  return line.split(',');
  if(line.indexOf(';')>=0)  return line.split(';');
  if(/\s{2,}/.test(line))   return line.split(/\s{2,}/);
  return line.split(/\s+/);
}
function cellClean(c){ return String(c==null?'':c).replace(/^["'\s]+|["'\s]+$/g,''); }
/* 학번처럼 보이는가 — 숫자만 6~10자리. 전화번호(010…)는 뺍니다 */
function looksNo(c){ return /^\d{6,10}$/.test(c) && !/^010/.test(c); }
/* 이름처럼 보이는가 — 한글 2~10자(가운데 공백 허용). 학과·전공 같은 말은 뺍니다 */
function looksName(c){
  var t=c.replace(/\s+/g,' ').trim();
  if(!/^[가-힣]+( [가-힣]+)*$/.test(t)) return false;
  var n=t.replace(/ /g,'').length;
  if(n<2 || n>10) return false;
  if(/(학과|전공|대학|학부|과정|캠퍼스|출석부|명단|비고|성명|이름|학번|순번|번호|연락처|전화|담당|교수|강좌|분반)$/.test(t.replace(/ /g,''))) return false;
  return true;
}
function looksCid(c){
  var t=c.toUpperCase().replace(/\s+/g,'');
  if(/^F[123]$/.test(t)) return t;
  for(var i=0;i<PROFS.length;i++) if(normName(PROFS[i].name)===normName(c)) return PROFS[i].classId;
  return '';
}

function parseRoster(text, defCid){
  var lines = String(text||'').split(/\r?\n/);
  var map=null, rows=[], seen={};
  lines.forEach(function(raw, li){
    if(!raw || !raw.replace(/[\s,;\t]/g,'')) return;              /* 빈 줄은 그냥 넘깁니다 */
    var cells = splitCells(raw).map(cellClean);
    var joined = cells.join(' ');

    /* 머리글 줄인가 — 「학번」과 「이름/성명」이 같이 있으면 머리글로 봅니다 */
    if(!map && /학\s*번/.test(joined) && /(이름|성\s*명)/.test(joined) && !cells.some(looksNo)){
      map={};
      cells.forEach(function(c, i){
        if(/학\s*번/.test(c) && map.no===undefined) map.no=i;
        else if(/(이름|성\s*명)/.test(c) && map.name===undefined) map.name=i;
        else if(/(강좌|분반|반)/.test(c) && map.cid===undefined) map.cid=i;
      });
      rows.push({raw:raw, kind:'head', why:'머리글 — 건너뜁니다'});
      return;
    }

    var no='', nm='', cid='';
    if(map){
      no = cells[map.no]!==undefined? cells[map.no] : '';
      nm = cells[map.name]!==undefined? cells[map.name] : '';
      if(map.cid!==undefined && cells[map.cid]) cid = looksCid(cells[map.cid]);
    }
    /* 머리글이 없거나 머리글 자리에서 못 찾으면 — 줄 안에서 직접 찾습니다 */
    if(!looksNo(no)){
      var cand = cells.filter(looksNo);
      /* 8자리(학번)를 가장 먼저 씁니다. 순번 1·2·3 같은 짧은 숫자는 애초에 걸리지 않습니다 */
      var eight = cand.filter(function(c){return c.length===8;});
      no = (eight.length? eight[0] : (cand.length? cand[0] : (no||'')));
    }
    if(!looksName(nm)){
      var cn = cells.filter(function(c){ return c!==no && looksName(c); });
      nm = cn.length? cn[0] : (nm||'');
    }
    if(!cid){ for(var i=0;i<cells.length;i++){ var g=looksCid(cells[i]); if(g){ cid=g; break; } } }
    cid = cid || defCid;

    var why='';
    if(!looksNo(no))        why='학번을 찾지 못했습니다';
    else if(!looksName(nm)) why='이름이 비었거나 이름처럼 보이지 않습니다';
    if(!why && seen[no])    why='이 파일 안에 같은 학번이 두 번 있습니다';
    if(!why) seen[no]=true;

    rows.push({raw:raw, kind: why? 'bad':'ok', no:no, name:nm.replace(/\s+/g,' ').trim(), cid:cid, why:why});
  });

  /* 🔴 학번 자릿수는 「8자리」로 못박지 않습니다 — 학교마다·학번 체계마다 다릅니다.
     대신 이 파일에서 가장 많은 자릿수를 기준으로 삼고, 혼자 다른 줄만 빨갛게 잡습니다.
     (8자리로 박아 두면 학번 체계가 다를 때 90명 전부가 빨갛게 되어 못 씁니다) */
  var cnt={}, top='', best=0;
  rows.forEach(function(r){ if(r.kind==='ok'){ var L=String(r.no).length; cnt[L]=(cnt[L]||0)+1; } });
  for(var k in cnt){ if(cnt[k]>best){ best=cnt[k]; top=k; } }
  if(best>=2){
    rows.forEach(function(r){
      if(r.kind==='ok' && String(r.no).length!==Number(top)){
        r.kind='bad'; r.why='학번 자릿수가 다릅니다 (이 파일은 대부분 '+top+'자리)';
      }
    });
  }
  return rows;
}

  /* ① 붙여넣기 */
  h += '<div class="card"><h3>① 엑셀에서 긁어 붙여넣기 <span class="bg green">가장 편한 방법</span></h3>'+
    '<p class="muted">엑셀에서 학생 줄을 드래그해 복사(Ctrl+C)한 뒤 아래 칸에 붙여넣으십시오(Ctrl+V).</p>'+
    '<textarea id="rosterText" style="min-height:120px" placeholder="여기에 붙여넣기\n\n예)  20261234&#9;바이오융합공학과&#9;홍길동\n     20261235&#9;바이오융합공학과&#9;김철수" '+
    'oninput="rosterText=this.value">'+esc(rosterText)+'</textarea>'+
    '<div class="btnrow" style="margin-top:8px">'+
      '<button class="btn pri" onclick="rosterRead()">읽어 보기</button>'+
      '<button class="btn" onclick="rosterText=ROSTER_SAMPLE;rosterParsed=null;render()">예시 넣어 보기</button>'+
      '<button class="btn" onclick="rosterText=&#39;&#39;;rosterParsed=null;render()">지우기</button>'+
    '</div></div>';

  /* ② 파일 */
  h += '<div class="card"><h3>② 파일로 올리기</h3>'+
    '<p class="muted">CSV · TXT 파일을 그대로 올리셔도 됩니다. '+
    '<b>엑셀(.xlsx) 파일은 「다른 이름으로 저장 → CSV」</b>로 바꾸시거나, 위 ①번처럼 붙여넣으십시오.</p>'+
    '<input type="file" id="rosterFile" accept=".csv,.txt,.tsv" onchange="rosterPickFile(this)" '+
    'style="padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;font-size:13px">'+
    (rosterFileName? '<div class="note b" style="margin-top:8px">읽은 파일: <b>'+esc(rosterFileName)+'</b></div>':'')+
    '<div class="note">🔤 한글이 깨지지 않도록 <b>UTF-8과 한글 윈도우(EUC-KR) 두 가지를 모두</b> 읽습니다.</div></div>';

  /* ③ PDF — 25차 (2026-08-23) 교수님 지시: "출석부 PDF파일도 올릴 수 있게 추가해줘" */
  var pdfReady = (typeof DBR!=='undefined' && DBR.on && DBCONF.url && DBR.tok && DBR.tok.access_token);
  h += '<div class="card"><h3>③ 출석부 <b>PDF</b>로 올리기 <span class="bg green">새로 생김</span></h3>'+
    '<p class="muted">동양미래대 출석부 <b>PDF 파일</b>을 그대로 올리시면, 학번과 이름을 자동으로 읽어 아래 미리보기로 보여 드립니다. '+
      '읽은 뒤에는 ①·②와 똑같이 <b>확인하고 넣기</b> 흐름을 거칩니다.</p>'+
    (pdfReady
      ? '<input type="file" id="rosterPdf" accept="application/pdf,.pdf" onchange="rosterPickPdf(this)" '+
        (rosterPdfBusy?'disabled ':'')+
        'style="padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;font-size:13px">'+
        (rosterPdfBusy? '<div class="note b" style="margin-top:8px">📄 PDF를 읽는 중입니다… 잠시만 기다려 주세요(보통 몇 초).</div>':'')
      : '<div class="note b">💡 PDF 읽기는 <b>데이터베이스가 켜진 배포본</b>에서만 됩니다 — 서버가 PDF의 글자를 뽑아 주기 때문입니다. '+
        '지금 화면(브라우저 저장 방식)에서는 위 ①<b>붙여넣기</b>나 ②<b>CSV</b>로 올려 주세요.</div>')+
    '<div class="note">🔴 <b>글자로 된 PDF</b>만 읽습니다. 스캔한 <b>그림</b> PDF는 글자가 없어 읽지 못합니다 — 그때는 ①·②로 올려 주세요.</div></div>';

  if(rosterParsed) h += rosterPreview();
  return h;
}

/* --------------------------------------------------------------------------
   PDF 올리기 — 파일을 서버(parse_roster)로 보내 학번·이름을 받아
                지금 있는 「미리보기 → 확인」 흐름에 그대로 태웁니다. (25차)
   🔴 서버가 필요합니다(브라우저는 외부 라이브러리 금지라 PDF 글자를 직접 못 뽑음).
   🔴 저장은 하지 않습니다 — 받은 [{no,name}] 을 붙여넣기와 똑같이 검증만 하고
      실제 등록은 기존 [○○ 강좌에 N명 등록하기] 단계에서만 이뤄집니다(RLS 가 지킴).
   -------------------------------------------------------------------------- */
function rosterPickPdf(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  if(typeof DBR==='undefined' || !DBR.on || !DBCONF.url){
    toast('PDF 읽기는 서버(데이터베이스)가 켜져 있어야 합니다. ①붙여넣기나 ②CSV로 올려 주세요.');
    inp.value=''; return;
  }
  if(!DBR.tok || !DBR.tok.access_token){
    toast('로그인 후 다시 시도해 주세요. (PDF 읽기는 로그인한 교수만 됩니다)');
    inp.value=''; return;
  }
  if(f.size > 10*1024*1024){ toast('PDF가 너무 큽니다(10MB 이하로). CSV로 올려 주세요.'); inp.value=''; return; }

  rosterFileName = f.name; rosterPdfBusy=true; render();
  var fr = new FileReader();
  fr.onerror = function(){ rosterPdfBusy=false; rosterFileName=''; toast('🔴 파일을 읽지 못했습니다.'); render(); };
  fr.onload = function(){
    var b64 = String(fr.result||'').replace(/^data:.*?;base64,/, '');
    inp.value='';
    rosterSendPdf(b64, f.name, false);
  };
  fr.readAsDataURL(f);
}
/* 서버에 보내기 — 출입증이 만료됐으면(401) 한 번 갱신하고 다시 보냅니다(수업 3시간 대비) */
function rosterSendPdf(b64, fname, retried){
  DBR.call('/functions/v1/parse_roster', {method:'POST', headers:DBR.hdr(true), body:JSON.stringify({pdf:b64})})
    .then(function(res){
      rosterPdfBusy=false;
      var rows = (res && res.rows) || [];
      if(!rows.length){
        rosterFileName='';
        toast('🔴 '+((res&&res.warn)||'PDF에서 글자를 읽지 못했습니다. CSV나 붙여넣기로 올려 주세요.'));
        render(); return;
      }
      /* 받은 [{no,name}] 을 붙여넣기 형식(학번\t이름)으로 바꿔 기존 검증에 그대로 태웁니다 */
      rosterText = rows.map(function(r){ return (r.no||'')+'\t'+(r.name||''); }).join('\n');
      rosterParsed = parseRoster(rosterText, rosterCid||myClass());
      rosterMode='add';
      toast(fname+' — '+rows.length+'명을 읽었습니다. 아래 미리보기를 확인해 주세요.');
      render();
    }, function(err){
      if(err && err.kind==='auth' && err.status===401 && !retried && DBR.tok && DBR.tok.refresh_token){
        DBR.refresh().then(function(){ rosterSendPdf(b64, fname, true); },
          function(){ rosterPdfBusy=false; rosterFileName='';
            toast('🔴 로그인이 만료되었습니다. 다시 로그인 후 시도해 주세요.'); render(); });
        return;
      }
      rosterPdfBusy=false; rosterFileName='';
      var msg = (err && err.kind==='net') ? '네트워크가 불안정합니다. 잠시 뒤 다시 시도해 주세요.'
               : (err && err.status===401) ? '로그인이 만료되었습니다. 다시 로그인 후 시도해 주세요.'
               : 'PDF를 읽지 못했습니다. CSV나 붙여넣기로 올려 주세요.';
      toast('🔴 '+msg); render();
    });
}

function rosterRead(){
  var e=$('rosterText'); if(e) rosterText=e.value;
  if(!rosterText.replace(/\s/g,'')){ toast('붙여넣은 내용이 없습니다.'); return; }
  rosterParsed = parseRoster(rosterText, rosterCid||myClass());
  rosterMode='add';
  render();
}
function rosterPickFile(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  rosterFileName = f.name;
  var fr = new FileReader();
  fr.onload = function(){
    var buf = fr.result, txt='';
    try{
      var u8 = new Uint8Array(buf);
      /* 엑셀 원본(.xlsx)은 압축파일이라 글자가 안 나옵니다 — 미리 알려 드립니다 */
      if(u8[0]===0x50 && u8[1]===0x4b){
        toast('⛔ 엑셀 원본(.xlsx)은 그대로 못 읽습니다. CSV로 저장하시거나 ①번에 붙여넣으십시오.');
        rosterFileName=''; render(); return;
      }
      txt = new TextDecoder('utf-8').decode(buf);
      if(txt.indexOf('�')>=0){ try{ txt = new TextDecoder('euc-kr').decode(buf); }catch(e2){} }
    }catch(e){ txt=''; }
    rosterText = txt;
    rosterParsed = parseRoster(rosterText, rosterCid||myClass());
    rosterMode='add';
    toast(f.name+' — 읽었습니다.'); render();
  };
  fr.readAsArrayBuffer(f);
}

/* ---- 미리보기 ---- */
function rosterPreview(){
  var cid = rosterCid || myClass();
  var rows = rosterParsed;
  var ok  = rows.filter(function(r){return r.kind==='ok';});
  var bad = rows.filter(function(r){return r.kind==='bad';});
  var head= rows.filter(function(r){return r.kind==='head';});

  /* 이미 명단에 있는 학번인지 */
  ok.forEach(function(r){
    var ex = DB.one('students', function(x){return x.no===r.no;});
    r.exists = ex? ex : null;
  });
  var fresh = ok.filter(function(r){return !r.exists;});
  var dupDb = ok.filter(function(r){return r.exists;});

  var h = '<div class="card" style="border-color:var(--ink);border-width:2px">'+
    '<h3>🔎 미리보기 — 넣기 전에 확인하십시오</h3>'+

      (rosterMode==='add'? fresh.length : ok.length)+'명을 등록합니다.</b><br>'+
      '<span class="muted">읽은 줄 '+rows.length+'개 중 · 정상 '+ok.length+' · '+
      '이미 있음 '+dupDb.length+' · 🔴 이상한 줄 '+bad.length+
      (head.length? ' · 머리글 '+head.length : '')+'</span></div>';

  if(bad.length) h += '<div class="note r"><b>🔴 이상한 줄 '+bad.length+'개는 넣지 않습니다.</b> '+
    '아래 빨간 줄을 확인하시고, 출석부를 고쳐 다시 올리시거나 나중에 <b>[학생 한 명 추가]</b>로 넣으십시오.</div>';

  h += '<div class="scroll"><table style="table-layout:fixed"><tr><th class="c" style="width:30px">줄</th><th class="nw" style="width:88px">학번</th><th class="nw" style="width:64px">이름</th><th>상태</th></tr>'+
    rows.map(function(r,i){
      var st, color='';
      if(r.kind==='head'){ st='<span class="bg gray">머리글 — 건너뜀</span>'; }
      else if(r.kind==='bad'){ st='<b style="color:var(--red)">🔴 '+esc(r.why)+'</b>'; color=' style="background:var(--red-w)"'; }
      else if(r.exists){ st='<span class="bg blue">이미 있음</span> <span class="muted">'+(rosterMode==='add'?'건너뜁니다':'다시 넣습니다')+'</span>'; }
      else st='<span class="bg green">✅ 새로 등록</span>';
      return '<tr'+color+'><td class="c muted">'+(i+1)+'</td>'+
        '<td class="nw">'+esc(r.no||'-')+'</td><td class="nw">'+esc(r.name||'-')+'</td>'+
        '<td>'+st+(r.cid && r.cid!==cid? ' <span class="bg purple">'+esc(r.cid)+'</span>':'')+'</td></tr>';
    }).join('')+'</table></div>';

  /* 다시 올리기 — 방식 고르기 */
  var cur = liveStudents([cid]).length;
  h += '<div class="hr"></div><h4>어떻게 넣을까요?</h4>'+
    '<div class="btnrow">'+
      '<button class="btn '+(rosterMode==='add'?'pri':'')+'" onclick="rosterMode=&#39;add&#39;;render()">① 없는 사람만 추가</button>'+
      '<button class="btn '+(rosterMode==='replace'?'dan':'')+'" onclick="rosterMode=&#39;replace&#39;;render()">② 전부 새로 넣기</button>'+
    '</div>';

  if(rosterMode==='add'){
    h += '<div class="note g" style="margin-top:8px">✅ <b>안전합니다.</b> 이미 있는 학생 '+dupDb.length+'명은 <b>손대지 않습니다</b> — '+
      '이름·팀·낸 것이 그대로 남습니다. <b>새 학생 '+fresh.length+'명만</b> 들어갑니다.<br>'+
      '<span class="muted">수강 정정으로 학생이 늘어 두 번째로 올리실 때 쓰는 방식입니다.</span></div>'+
      '<button class="btn pri full" style="margin-top:8px" onclick="rosterApply()">'+
      esc(cid)+' 강좌에 '+fresh.length+'명 등록하기</button>';
  }else{
    /* 사라지는 것을 실제로 세어 보여 줍니다 */
    var gone = liveStudents([cid]).filter(function(s){
      return !ok.some(function(r){return r.no===s.no;}); });
    var f={peer:0, sv:0, tut:0, att:0};
    liveStudents([cid]).forEach(function(s){ var x=footprint(s);
      f.peer+=x.준팀간+x.준팀내; f.sv+=x.설문; f.tut+=x.튜터링확인; f.att+=x.참석; });
    h += '<div class="note r" style="margin-top:8px"><b>🔴 되돌릴 수 없습니다. 무엇이 사라지는지 실제로 세어 보여 드립니다.</b><br><br>'+

      '· 함께 사라지는 것 — 동료평가 <b>'+f.peer+'건</b> · 설문 응답 <b>'+f.sv+'건</b> · 튜터링 확인 <b>'+f.tut+'건</b> · 참석 기록 <b>'+f.att+'건</b><br>'+
      '· <b>팀 배정도 전부 풀립니다</b> (팀 자체는 남고 팀원이 비워집니다)<br><br>'+
      '🔴 동료평가가 사라지면 <b>다른 팀의 점수까지 바뀝니다.</b> 학기 중에는 ①번을 쓰십시오.</div>'+
      '<label class="f">그래도 진행하시려면 <b>'+esc(cid)+'</b> 라고 적으세요</label>'+
      '<input type="text" id="rosterConfirm" placeholder="'+esc(cid)+'">'+
      '<button class="btn dan full" style="margin-top:8px" onclick="rosterApply()">전부 새로 넣기 (되돌릴 수 없음)</button>';
  }
  h += '<div class="btnrow" style="margin-top:8px"><button class="btn" onclick="rosterParsed=null;render()">그만두기</button></div></div>';
  return h;
}

/* 🆕 (26차) 강좌별로 묶기 — 슈퍼가 F1·F2·F3 섞인 출석부를 올릴 수 있으므로
   각 줄의 강좌(파일에 강좌 열이 있으면 그 값, 없으면 고른 강좌)로 나눕니다.
   일반 교수는 자기 강좌만 편집 가능하므로 canEdit 이 아니면 기본 강좌로 넣습니다. */
function rosterGroups(list, defCid){
  var g={};
  list.forEach(function(r){
    var cid = (isSuper() && r.cid)? r.cid : defCid;
    if(!canEdit(cid)) cid = defCid;
    (g[cid]=g[cid]||[]).push({no:r.no, name:r.name});
  });
  return Object.keys(g).map(function(k){ return {classId:k, rows:g[k]}; });
}
function rosterApply(){
  var cid = rosterCid || myClass();
  if(!canEdit(cid)){ toast('이 강좌에는 넣을 수 없습니다.'); return; }
  var rows = rosterParsed||[];
  var ok = rows.filter(function(r){return r.kind==='ok';});
  var remote = (typeof DBR!=='undefined' && DBR.on);

  if(rosterMode==='replace'){
    if(val('rosterConfirm')!==cid){ toast('⛔ 「'+cid+'」라고 정확히 적어 주셔야 진행됩니다.'); return; }
    /* 🔴 (26차) 「전부 새로 넣기」는 옛 계정을 지워야 하는데, 계정 삭제는 규칙상 관리자만 됩니다.
       일반 교수가 하면 옛 계정이 남아(고아) 같은 학번이 다시 안 들어옵니다 — 그래서 막습니다. */
    if(remote && !isSuper()){
      toast('⛔ 「전부 새로 넣기」는 관리자(곽호석)만 됩니다. 교수님은 「없는 사람만 추가」를 쓰시거나, 개별 학생을 삭제한 뒤 올려 주세요.');
      return;
    }
    var old = liveStudents([cid], true);
    APP.confirm('마지막 확인입니다.\n\n'+cid+' 강좌 학생 '+old.length+'명을 전부 지우고\n이 파일의 '+ok.length+'명으로 바꿉니다.\n'+
      '동료평가·설문·팀 배정이 함께 사라집니다.\n⛔ 되돌릴 수 없습니다.\n\n진행할까요?', function(){
        if(remote){
          DBR.bar('바꾸는 중입니다… 잠시만 기다려 주십시오.', 'amber');
          old.forEach(function(s){ purgeStudent(s.id, s); });   /* 삭제를 큐에 쌓습니다 */
          DBR.drainThen(function(){                              /* 삭제가 서버에 다 반영된 뒤에 새로 넣습니다(순서 보장) */
            DBR.addStudentGroups(rosterGroups(ok, cid), {}, function(tot){
              DBR.bar('','');
              DB.log('🔴 출석부 전부 새로 넣기', cid+' · 지운 학생 '+old.length+'명 → 새로 넣은 학생 '+tot.added+'명');
              rosterParsed=null; rosterText=''; rosterFileName='';
              toast(cid+' 강좌를 파일과 똑같이 맞췄습니다 — '+tot.added+'명.');
              go('admin',{p:'students'});
            }, function(errs){ DBR.bar('',''); toast('🔴 새로 넣기에 실패했습니다. 다시 시도해 주세요.'); });
          });
          return;
        }
        old.forEach(function(s){ purgeStudent(s.id, s); });
        var made = rosterInsert(ok, cid);
        DB.log('🔴 출석부 전부 새로 넣기', cid+' · 지운 학생 '+old.length+'명 → 새로 넣은 학생 '+made+'명');
        rosterParsed=null; rosterText=''; rosterFileName='';
        toast(cid+' 강좌를 파일과 똑같이 맞췄습니다 — '+made+'명.');
        go('admin',{p:'students'});
    });
    return;
  }
  var fresh = ok.filter(function(r){ return !DB.one('students', function(x){return x.no===r.no;}); });
  if(!fresh.length){ toast('새로 넣을 학생이 없습니다. (모두 이미 명단에 있습니다)'); return; }

  if(remote){
    /* 🆕 (26차) 직접 INSERT 하지 않고 서버 함수로 — 일반 교수도 저장됩니다 */
    DBR.bar('등록 중입니다… 잠시만 기다려 주십시오.', 'amber');
    DBR.addStudentGroups(rosterGroups(fresh, cid), {}, function(tot){
      DBR.bar('','');
      DB.log('출석부 올리기(없는 사람만 추가)', cid+' · '+tot.added+'명 추가'+(tot.skipped?(' · 건너뜀 '+tot.skipped):''));
      rosterParsed=null; rosterText=''; rosterFileName='';
      toast(cid+' 강좌에 '+tot.added+'명을 등록했습니다.'+(tot.skipped?(' (이미 있음 '+tot.skipped+'명 건너뜀)'):''));
      go('admin',{p:'students'});
    }, function(errs){
      DBR.bar('','');
      var e=errs&&errs[0];
      toast('🔴 저장하지 못했습니다: '+((e&&(e.msg||e.status))||'서버 오류')+'. 다시 시도해 주세요.');
    });
    return;
  }
  var n = rosterInsert(fresh, cid);
  DB.log('출석부 올리기(없는 사람만 추가)', cid+' · '+n+'명 추가');
  rosterParsed=null; rosterText=''; rosterFileName='';
  toast(cid+' 강좌에 '+n+'명을 등록했습니다.');
  go('admin',{p:'students'});
}
function rosterInsert(list, defCid){
  var n=0;
  list.forEach(function(r){
    var cid = (isSuper() && r.cid)? r.cid : defCid;      /* 파일의 강좌 열이 있으면 그것을 먼저 */
    if(!canEdit(cid)) cid = defCid;
    if(DB.one('students', function(x){return x.no===r.no;})) return;
    var acc = DB.add('accounts',{name:r.name,num:r.no,role:'student',classId:cid,active:true});
    DB.add('students',{accountId:acc.id,name:r.name,no:r.no,classId:cid,teamId:null,active:true,
      regAt:nowStr(), lastLoginAt:''});
    DB.add('consents',{no:r.no,ok:false,at:'',ver:'v1(초안)'});
    n++;
  });
  return n;
}

var checkResult=null, checkRunning=false;
function runCheck(){
  /* 배포본에만 있는 줄 */
  checkResult=[{항목:'배포본에서는 자체 점검을 돌리지 않습니다', 결과:'건너뜀',
    비고:'점검 210항목은 코드에 박힌 실제 명단을 기준으로 짜여 있습니다. 배포본에는 명단이 없습니다(일부러 뺐습니다). 점검은 교내용 index.html 에서 돌리십시오.'}];
  checkRunning=false; VIEW={name:'admin',p:{p:'check'}}; render(); return;
  checkRunning=true;
  try{ checkResult = window.__protoCheck(); }
  catch(e){
    var part = (window.__chkOut && window.__chkOut.length) ? window.__chkOut.slice() : [];
    checkResult = part.concat([{항목:'⛔ 점검이 여기서 멈췄습니다', 결과:'실패', 비고:e.message}]);
  }
  checkRunning=false;
  VIEW={name:'admin',p:{p:'check'}}; render();
}
function admCheck(){
  if(checkRunning) return '<div class="card"><p>🧪 점검 중입니다…</p></div>';
  var h='<div class="card"><h2>자체 점검</h2>'+
    '<p class="muted">시제품이 스스로를 검사합니다. 화면을 하나하나 그려 보고, 로그인·출석부·권한을 실제로 시켜 봅니다.</p>'+
    '<button class="btn pri full" onclick="runCheck()">지금 점검 돌리기</button></div>';
  if(!checkResult) return h+'<div class="card"><div class="note">아직 돌리지 않았습니다. 위 버튼을 누르십시오.</div></div>';
  var fail = checkResult.filter(function(r){return r.결과!=='통과';});
  h += '<div class="card"><div class="note '+(fail.length?'r':'g')+'"><b>'+
    (fail.length? '🔴 '+fail.length+'건 실패 / '+checkResult.length+'건 중' : '✅ '+checkResult.length+'건 전부 통과')+
    '</b></div><div class="scroll"><table><tr><th>항목</th><th class="c">결과</th></tr>'+
    checkResult.map(function(r){
      return '<tr><td>'+esc(r.항목)+'<br><span class="muted" style="font-size:13px">'+esc(r.비고)+'</span></td>'+
        '<td class="c nw"><span class="bg '+(r.결과==='통과'?'green':'red')+'">'+r.결과+'</span></td></tr>';
    }).join('')+'</table></div></div>';
  return h;
}

      return 2+((i+hh)%3);                                  /* 2~4점 */
    }
    /* 🔴 문항마다 오르는 폭을 다르게 둡니다 — 전부 똑같이 +1이면
       「가장 많이 오른 문항 / 가장 적게 오른 문항」이 나오지 않아
       교수님이 해석 화면을 눌러 보실 수가 없습니다. (예시 데이터 전용) */
    function dGain(pair){
      var h=0, k=String(pair);
      for(var c=0;c<k.length;c++) h=(h*31+k.charCodeAt(c))%101;
      return h%3;                                           /* 0 · 1 · 2 */
    }
    function dVal(q, i, mode){
      if(q.type==='5점'){
        if(!q.pair) return String(3+((i+q.order)%3));        /* 교과목 만족도 3~5 */
        var b0=dBase(i, q.pair);
        if(mode==='now')  return String(Math.min(5, b0+dGain(q.pair)));
        if(mode==='back') return String(Math.max(1, b0-1));
        return String(b0);
      }
      if(q.type==='단일') return q.opts[(i+q.order)%q.opts.length];
      if(q.type==='복수'){
        var o1=q.opts[(i+q.order)%q.opts.length], o2=q.opts[(i+q.order+2)%q.opts.length];
        return o1===o2? o1 : o1+' / '+o2;
      }
      if(q.type==='서술짧') return ['ChatGPT','제미나이','클로드','퍼플렉시티'][(i+q.order)%4];
      return ['팀으로 끝까지 해 본 것이 가장 도움이 되었습니다.',
              '일정이 촉박해 영상 편집이 어려웠습니다.'][(i+q.order)%2];
    }
    DB.get('students', function(s){return !!s.lastLoginAt;}).forEach(function(s,i){
      DB.add('consents',{no:s.no,ok:true,at:'2026-08-26 10:0'+(i%10),ver:'v1(초안)'});
      if(i%7===3) return;                                   /* 사전 미응답자 */
      qs1.forEach(function(q){
        DB.add('answers',{surveyId:sv1.id,qId:q.id,studentId:s.id,

      if(i%3!==0) return;                                   /* 최종은 3분의 1만 */
      qs2.forEach(function(q){
        DB.add('answers',{surveyId:sv2.id,qId:q.id,studentId:s.id,

        if(q.dual) DB.add('answers',{surveyId:sv2.id,qId:q.id,studentId:s.id,

    /* 🎤 18차 — 4·7주차 발표 순서 (강좌마다 8팀) · 13·14주차 배정 (24팀 → 12+12) */

      var ts=DB.get('teams', function(t){return t.classId===cid;}).sort(function(a,b){return a.no-b.no;});
      [4,7].forEach(function(wn){ ts.forEach(function(t,i){ DB.add('assign',{n:wn, teamId:t.id, order:i+1}); }); });

      var m=DB.d.settings; if(!m.assignMeta) m.assignMeta={};
      m.assignMeta[13]={rev:1, by:'곽호석', at:'2026-11-18 09:40'};

    /* 4주차(1회차) 평가 */
    var r1prof = DB.get('rubrics', function(x){return x.round===1&&x.kind==='prof';});
    var r1int  = DB.get('rubrics', function(x){return x.round===1&&x.kind==='inter';});

    DB.get('teams').forEach(function(t,ti){

    DB.get('students', function(s){return s.teamId && s.lastLoginAt;}).forEach(function(s,si){

        r1int.forEach(function(rb,k){

      DB.get('members', function(m){return m.teamId===myTeam && m.studentId!==s.id;}).forEach(function(m,mi){

            score:2+((si+mi+k)%3), text:'맡은 부분을 기한 안에 잘 마무리해 주었습니다.', at:'2026-09-16 12:5'+(si%10), secs:40+((si*5)%120)});

    }finally{ DB.release(); }     /* 여기서 딱 한 번 저장됩니다 */
    return made;
  },

  /* ==========================================================================
     🧮 19차 — 「학기 끝」까지 채우기
     --------------------------------------------------------------------------
     fill() 이 채우는 것은 4주차(1회차)까지입니다. 성적 화면·점수표를 눈으로

  fillScores:function(){

                score: 1+demoRand(si*10007 + ti*101 + k*13 + rd),

                at:(rd===2? '2026-10-14 12:4':'2026-11-25 12:4')+(si%10), secs:60+((si*7)%180)});

      /* ⚖️ 20차 — 팀내 평가(intra) 3회차.

      [1,2,3].forEach(function(rd){
        var rbIn = DB.get('rubrics', function(x){return x.round===rd && x.kind==='intra';});
        DB.get('teams').forEach(function(t){
          var ms = DB.get('members', function(m){return m.teamId===t.id;});
          var slow = (t.classId==='F2' && ms.length) ? ms[ms.length-1].studentId : null;
          ms.forEach(function(giver, gi){
            ms.forEach(function(target, ti){
              if(giver.studentId===target.studentId) return;
              if(DB.one('peerMember', function(x){
                return x.round===rd && x.evaluator===giver.studentId && x.studentId===target.studentId; })) return;
              var low = (target.studentId===slow && rd<3);
              rbIn.forEach(function(rb,k){
                DB.add('peerMember',{round:rd, evaluator:giver.studentId, studentId:target.studentId,

            from: pickNew ? '' : fp.id, ok:(ti<=2), okAt:(ti<=2?'2026-09-23 11:0'+ti:''),
            back:'', need:'', how:'', comment:''});

      });
      /* 🚌 11주차 견학 의견 — 강좌마다 앞 4팀만 (교수님이 「참여/미참여 팀」을 눌러 보시게) */

      CIDS.forEach(function(cid){
        DB.get('teams', function(t){return t.classId===cid;})

          var ms=DB.get('members', function(m){return m.teamId===t.id;});
          ms.slice(0, ti===0?3:(ti===3?1:2)).forEach(function(m,k){

            DB.add('excursion',{teamId:t.id,classId:cid,week:11,author:st.name,authorId:st.id,
              text:evc[k%evc.length],at:'2026-11-04 1'+(4+k)+':'+(20+ti)});

      /* 📢 R9 — 학기 끝 상태이므로 모든 주차를 열고, 성적 공개도 「공개된」 상태로 둡니다
         (교수님이 미리보기에서 학생 공개 화면까지 바로 눌러 보실 수 있게). */
      WEEKDEF.forEach(function(w){ DB.set('weeks','w'+w.n,{state:'열림'}); });
      (function(){ var all=discloseAll();      /* 직접 채웁니다 — 예시라 변경 기록은 남기지 않습니다 */
        CIDS.forEach(function(cid){ all[cid]=all[cid]||{}; DISC_KEYS.forEach(function(k){ all[cid][k]=true; }); });

      /* ✏️ R10 — 최종주제 「수정됨」 표기도 예시로 보이게: 승인 대기(ok=false) 팀 하나를 수정된 것으로 */

      DB.log('예시 데이터 — 학기 끝까지', '7주차·13·14주차 평가 + 출석·중간·기말 점수 + 최종 주제·견학 의견 + 성적 공개 ON');
    }finally{ DB.release(); }

/* ==========================================================================

   --------------------------------------------------------------------------
   🔴 2026-08-20 (7차) — 팀은 학생 한 명이 팀원을 골라 만듭니다(2주차).
      교수는 ① 현황을 보고 ② 남는 학생을 기존 팀에 넣습니다.
      25명을 3~4명씩 8팀으로 나누면 수치상 맞지만(3×7+4×1) 실제로는 끝에
      한두 명이 반드시 남습니다. 그 정리가 교수의 몫이라, 이때만 4명 상한을
      넘길 수 있게 열어 두고 대신 확인창을 띄웁니다.
   ⛔ 초대코드는 없습니다.

function admTeams(){
  var cids=visibleClasses();
  var h='<div class="card"><h2>팀 관리</h2>'+
    '<p class="muted">팀은 <b>학생 한 명이 팀원을 골라</b> 만듭니다(2주차 · 9/2). '+
    '여기서는 <b>현황을 보고, 남는 학생을 넣어</b> 주십니다.</p>'+
    '<div class="note b">팀 수 상한 <b>'+teamCap()+'팀</b> · 팀당 <b>3~4명</b>'+
    (isSuper()? ' <span class="muted">— 상한은 [운영 설정]에서 바꾸십니다</span>':'')+'</div>';
  cids.forEach(function(cid){ h += admTeamBlock(cid); });
  return h+'</div>';
}
function admTeamBlock(cid){
  var ts=DB.get('teams', function(t){return t.classId===cid;}).sort(function(a,b){return a.no-b.no;});
  var free=DB.get('students', function(s){return s.classId===cid && s.active!==false && !s.teamId;})
             .sort(function(a,b){return a.no<b.no?-1:1;});
  var done=ts.filter(function(t){ var n=teamMembers(t.id).length; return n>=3 && n<=4; }).length;
  var ed=canEdit(cid);

  var h='<div class="hr"></div><b>'+esc(clsFull(cid))+'</b> '+
    (ed? '<span class="bg green">수정 가능</span>'
       : '<span class="bg gray">🔒 조회만'+(cid===myClass()?' ([내 강좌]로 전환하면 수정)':'')+'</span>')+
    '<div class="note '+(free.length? 'a':'g')+'" style="margin-top:6px">'+
      '<b>'+teamCap()+'팀 중 '+done+'팀 완성</b> <span class="muted">(3~4명인 팀)</span> · '+
      '만들어진 팀 '+ts.length+'개 · <b>팀 없는 학생 '+free.length+'명</b></div>';

  /* 🔴 폰(375px)에서 표를 쓰면 팀원 칸이 옆으로 밀려 안 보입니다.
     그래서 팀마다 한 덩어리로 세로로 쌓습니다. */
  if(!ts.length) h += '<p class="muted">아직 만들어진 팀이 없습니다. 팀은 2주차(9/2)에 학생들이 만듭니다.</p>';
  else h += ts.map(function(t){
    var ms=teamMembers(t.id), mk=teamCreator(t);
    var badN = (ms.length<3 || ms.length>4);
    return '<div class="acc" style="padding:9px 10px;margin:0 0 7px">'+
      '<div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap">'+
        '<b>'+t.no+'팀 「'+esc(t.name)+'」</b>'+
        '<span class="bg '+(badN?'red':'green')+'">'+ms.length+'명'+(badN?' ⚠️':'')+'</span>'+
        (t.ok? '<span class="bg green">✅ 승인</span>'
             : (ed? '<button class="btn sm ok" onclick="okTeam(&#39;'+t.id+'&#39;)">승인</button>'
                  : '<span class="bg gray">미승인</span>'))+
        '<span class="sp" style="flex:1"></span>'+
        (ed? '<button class="quiet" onclick="profTeamDrop(&#39;'+t.id+'&#39;)">해체</button>':'')+
      '</div>'+
      '<div class="muted" style="margin:3px 0">뜻: '+esc(t.meaning||'-')+
        ' · 만든 사람: '+esc(mk? sn(mk):'교수 지정')+'</div>'+
      (ms.length
        ? ms.map(function(m){
            return '<div style="display:flex;gap:6px;align-items:center;font-size:14px;margin:2px 0">'+
              '<span style="flex:1">'+memLabel(t, m.st)+'</span>'+
              (ed? '<button class="quiet" onclick="profTeamOut(&#39;'+m.st.id+'&#39;)">빼기</button>':'')+
              '</div>'; }).join('')
        : '<div class="muted">팀원이 없습니다 — 아래에서 학생을 넣어 주십시오.</div>')+
      '</div>';
  }).join('');

  /* 🔴 남는 학생 처리 — 여기가 교수님 손이 실제로 가는 곳입니다 */
  if(free.length){
    h += '<div class="note a"><b>팀 없음 '+free.length+'명 — 기존 팀에 넣어 주세요</b><br>'+
      '<span class="muted">3~4명씩 나누면 끝에 한두 명이 남습니다. '+
      '이때만 <b>4명을 넘겨 넣을 수 있고</b>, 넘길 때는 확인창이 뜹니다.</span></div>';
    /* 기본으로 「인원이 가장 적은 팀」이 골라져 있게 — 교수님이 매번 고르지 않으시도록 */
    var thin=null, tmin=99;
    ts.forEach(function(t){ var n=teamMembers(t.id).length; if(n<tmin){ tmin=n; thin=t; } });
    if(ed && ts.length){
      h += free.map(function(s){
        return '<div style="display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap">'+
          '<span style="flex:1;min-width:120px">'+esc(sn(s))+'</span>'+
          '<select id="fp_'+s.id+'" style="flex:1;min-width:130px">'+
          ts.map(function(t){ var n=teamMembers(t.id).length;
            return '<option value="'+t.id+'"'+((thin&&t.id===thin.id)?' selected':'')+'>'+
              t.no+'팀 '+esc(t.name)+' ('+n+'명)</option>'; }).join('')+
          '</select>'+
          '<button class="btn sm pri" onclick="profTeamIn(&#39;'+s.id+'&#39;)">이 학생을 넣기</button></div>';
      }).join('')+
      '<div class="btnrow" style="margin-top:6px">'+
      '<button class="btn sm" onclick="autoPlace(&#39;'+cid+'&#39;)">남은 학생 자동 배치</button>'+
      '<span class="muted" style="align-self:center">— 인원이 적은 팀부터 채웁니다</span></div>';
    }else if(ed){
      h += '<p class="muted">먼저 팀이 하나라도 있어야 넣을 수 있습니다.</p>';
    }else{
      h += '<p class="muted">'+free.map(function(s){return esc(sn(s));}).join(', ')+'</p>';
    }
  }

  /* 교수가 직접 팀 만들기 — 학생이 안 만들고 넘어간 경우를 위해 */
  if(ed){
    h += '<div class="hr"></div><b>＋ 교수가 팀 만들기</b> <span class="muted">— 빈 팀을 만든 뒤 위에서 학생을 넣습니다</span>';
    if(teamFull(cid)) h += '<div class="note">이미 '+teamCap()+'팀입니다. 더 만들려면 '+
      (isSuper()? '[운영 설정]에서 상한을 올리십시오.' : '슈퍼 관리자(곽호석 교수님)께 상한 조정을 요청하십시오.')+'</div>';
    else h += '<label class="f">팀 이름 <span class="lim">2~15자</span></label>'+
      '<input type="text" id="ptn_'+cid+'" maxlength="15">'+
      '<label class="f">팀 이름의 뜻 <span class="lim">한 문장</span></label>'+
      '<input type="text" id="ptw_'+cid+'" maxlength="100">'+
      '<button class="btn sm pri" style="margin-top:6px" onclick="profTeamNew(&#39;'+cid+'&#39;)">빈 팀 만들기</button>';
  }
  return h;
}
function okTeam(id){
  var t=team(id); if(!canEdit(t.classId)){ toast('다른 강좌는 수정할 수 없습니다.'); return; }
  DB.set('teams', id, {ok:true}); DB.log('팀 승인', t.classId+' '+t.no+'팀 「'+t.name+'」'); render();
}
/* 남는 학생 한 명을 고른 팀에 넣기 — 4명을 넘길 때만 확인창 */
function profTeamIn(sid){
  var s=DB.one('students', sid); if(!s) return;
  if(!canEdit(s.classId)){ toast('다른 강좌는 수정할 수 없습니다.'); return; }
  var e=$('fp_'+sid); if(!e || !e.value){ toast('넣을 팀을 골라 주세요.'); return; }
  var t=DB.one('teams', e.value); if(!t){ toast('그 팀을 찾을 수 없습니다.'); return; }
  var n=teamMembers(t.id).length;
  var apply=function(){
    teamJoin(t.id, sid, '팀원');
    DB.log('교수가 팀에 넣음', t.classId+' '+t.no+'팀 「'+t.name+'」 ← '+sn(s));
    toast(sn(s)+'을(를) '+t.no+'팀에 넣었습니다.'); render();
  };
  if(n>=4) APP.confirm('「'+t.name+'」 팀은 이미 '+n+'명입니다.\n\n'+
    sn(s)+'을(를) 넣으면 '+(n+1)+'명이 되어 기준(3~4명)을 넘습니다.\n'+
    '남는 학생을 정리하실 때만 쓰십시오.\n\n진행할까요?', apply);
  else apply();
}
function profTeamOut(sid){
  var s=DB.one('students', sid); if(!s) return;
  if(!canEdit(s.classId)){ toast('다른 강좌는 수정할 수 없습니다.'); return; }
  var t=teamOf(s);
  APP.confirm(sn(s)+'을(를) 「'+(t? t.name:'')+'」 팀에서 뺍니다.\n'+
    '그 학생은 「팀 없음」이 되고, 다른 팀에 넣어 주셔야 합니다.\n\n진행할까요?', function(){
    teamLeave(sid);
    DB.log('교수가 팀에서 뺌', (t? t.classId+' '+t.no+'팀 「'+t.name+'」 → ':'')+sn(s));
    toast('뺐습니다.'); render();
  });
}
function profTeamNew(cid){
  if(!canEdit(cid)){ toast('다른 강좌는 수정할 수 없습니다.'); return; }
  if(teamFull(cid)){ toast('이미 '+teamCap()+'팀입니다.'); return; }
  var nm=val('ptn_'+cid), wy=val('ptw_'+cid);
  var bad=teamNameBad(cid, nm, wy);
  if(bad){ toast('⛔ '+bad); return; }
  var t=DB.add('teams',{classId:cid, no:teamNoNext(cid), name:nm, meaning:wy, createdBy:null, ok:false, at:nowStr()});
  DB.log('교수가 팀 만듦', cid+' '+t.no+'팀 「'+nm+'」');
  toast('빈 팀을 만들었습니다. 위에서 학생을 넣어 주십시오.'); render();
}

/* 남은 학생 자동 배치 — 인원이 적은 팀부터. 4명이 상한이라 다 못 넣을 수 있습니다 */
function autoPlace(cid){
  if(!canEdit(cid)){ toast('다른 강좌는 수정할 수 없습니다.'); return; }
  var free=DB.get('students', function(s){return s.classId===cid && s.active!==false && !s.teamId;});
  var ts=DB.get('teams', function(t){return t.classId===cid;});
  if(!ts.length){ toast('먼저 팀이 하나라도 있어야 합니다.'); return; }
  var put=0;
  free.forEach(function(s){
    var target=null, min=99;

/* ==========================================================================
   🚫 주차에서 뺀 날 — 화면에 남깁니다 (2026-08-21 · 13차)
   --------------------------------------------------------------------------
   🔴 그냥 날짜만 바꿔 두면 나중에 누군가 「왜 10/7이 없지?」 하고 되돌립니다.
      그래서 「뺐다」는 사실과 이유를 주차 설정 화면 두 곳에 붙여 둡니다.
   ========================================================================== */
function skipFirstShifted(){                 /* 몇 주차부터 밀렸는가 */
  if(!WEEK_SKIP.length) return 0;
  var first=null;
  WEEK_SKIP.forEach(function(x){ if(first===null || x.date<first) first=x.date; });
  for(var i=0;i<WEEKDEF.length;i++){ var w=wrow(WEEKDEF[i].n); if(w && w.date>first) return WEEKDEF[i].n; }
  return 0;
}
function weekSkipNote(){
  if(!WEEK_SKIP.length) return '';
  var n=skipFirstShifted();
  return '<div class="note a"><b>🚫 주차에서 뺀 날</b><br>'+
    WEEK_SKIP.map(function(x){
      return '🚫 <b>'+mdw(x.date)+'</b> — '+esc(x.why)+' <b>(주차에서 제외)</b>'; }).join('<br>')+
    (n? '<br>그래서 <b>'+n+'주차부터 한 주씩 뒤로</b> 밀려 있습니다. 날짜가 이상해 보여도 <b>되돌리지 마십시오.</b>' : '')+
    '<br><span class="muted">⚠️ 휴강이 또 생기면 <b>날짜 15개를 손으로 고치지 마시고</b> 그 날 하루만 「뺀 날」에 더하면 됩니다 — 나머지가 저절로 밀립니다.</span></div>';
}
function weekSkipRow(n, cols){               /* n주차와 다음 주차 사이에 낀 날 */
  var w=wrow(n), nx=wrow(n+1); if(!w) return '';
  return WEEK_SKIP.filter(function(x){
      return dayDiff(w.date, x.date)>0 && (!nx || dayDiff(x.date, nx.date)>0); })
    .map(function(x){
      return '<tr><td class="c">🚫</td><td colspan="'+cols+'" class="muted">'+
        '<b>'+mdw(x.date)+'</b> — '+esc(x.why)+' <b>(주차에서 제외)</b></td></tr>'; }).join('');
}

   12. 팀 점수 순위 — ⛔ 등급을 매기지 않습니다 · 자동 확정 금지 · 동점이면 멈춤
   ========================================================================== */
/* 🔴 교수평가 점수(100점 환산) — 회차마다 「그 회차를 채점한 교수들의 평균」을 냅니다 */
function profScore100(teamId){
  var vals=[];
  [1,2,3].forEach(function(r){
    var rows=DB.get('profEval', function(x){return x.round===r && x.teamId===teamId;});
    if(!rows.length) return;
    var full=rbFull(r,'prof')||1;
    var byProf={};
    rows.forEach(function(x){ (byProf[x.profId]=byProf[x.profId]||[]).push(x.score); });
    var per=Object.keys(byProf).map(function(k){
      return byProf[k].reduce(function(a,b){return a+b;},0)/full*100; });
    vals.push(per.reduce(function(a,b){return a+b;},0)/per.length);   /* 교수 3명 평균 */
  });
  return vals.length? vals.reduce(function(a,b){return a+b;},0)/vals.length : 0;
}

function calcGrades(cid){

  var teams=DB.get('teams', function(t){return t.classId===cid;});
  var rows=teams.map(function(t){
    /* 🔴 19차 — 계산은 pF_final.js 한 곳에서만 합니다.
       · 회차마다 「교수 40% + 동료 60%」로 100점을 만들고
       · 회차끼리는 **배점(10·20·25)으로 가중**해 평균합니다
         (옛 코드는 회차를 똑같이 놓고 평균해, 25점짜리 최종발표와 10점짜리
          중간발표1의 무게가 같았습니다)
       · 동료평가는 **평가자 한 사람의 총점**을 단위로 최고 1·최저 1을 뺍니다
         (옛 코드는 항목 점수 하나하나를 놓고 잘라 교수님 지시와 달랐습니다) */
    var pres = teamPresent100(t.id);
    return {t:t, prof:pres.prof, peer:pres.peer, rounds:pres.rounds,
            total:Math.round(pres.score*10)/10};
  }).sort(function(a,b){return b.total-a.total;});
  /* 동점 확인 */
  var tie=null;
  for(var i=1;i<rows.length;i++) if(rows[i].total===rows[i-1].total && rows[i].total>0) tie=[i,i+1,rows[i].total];
  return {rule:rule, rows:rows, tie:tie};
}

}

   13. 다운로드 (CSV)
   🔒 교번 칸을 절대 만들지 않습니다 · 이름 칸과 학번 칸은 따로
   🔒 동료평가 원자료의 평가자는 「평가자A」처럼 번호로만
   ========================================================================== */
/* 설문 원자료 한 장 — 응답 한 줄에 학생 한 명, 문항마다 한 칸 */
function surveyCSV(kind, cids){
  var sv=DB.one('surveys', function(s){return s.kind===kind;});
  if(!sv) return [['설문이 없습니다']];
  var qs=DB.get('questions', function(q){return q.surveyId===sv.id;}).sort(function(a,b){return a.order-b.order;});
  var head=['이름','학번','담당교수','강좌'];
  qs.forEach(function(q){
    var nm = (q.no? 'Q'+q.no : '자유'+(q.freeNo||''));
    if(q.dual){ head.push(nm+'_현재'); head.push(nm+'_수강전'); }
    else head.push(nm);
  });
  head.push('제출시각');
  var r=[head];
  /* 두 번째 줄에 문항 전문을 넣어 두면 집계할 때 무엇이 무엇인지 압니다 */
  var sub=['(문항)','','',''];
  qs.forEach(function(q){
    var t=String(q.text).replace(/\n/g,' ');
    if(q.dual){ sub.push(t+' ['+q.dual[0]+']'); sub.push(t+' ['+q.dual[1]+']'); } else sub.push(t);
  });
  sub.push('');
  r.push(sub);
  DB.get('students', function(s){return cids.indexOf(s.classId)>=0 && s.active!==false;}).forEach(function(s){
    var mine=DB.get('answers', function(a){return a.surveyId===sv.id && a.studentId===s.id;});
    if(!mine.length) return;
    var line=[s.name, s.no, classProf(s.classId), s.classId];
    qs.forEach(function(q){
      var a =mine.filter(function(x){return x.qId===q.id && x.part!=='수강전';})[0];
      var b2=mine.filter(function(x){return x.qId===q.id && x.part==='수강전';})[0];
      line.push(a? a.val:'');
      if(q.dual) line.push(b2? b2.val:'');
    });
    line.push((mine[0]||{}).at||'');
    r.push(line);
  });
  return r;
}
function csvEsc(v){ v=String(v==null?'':v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(rows){ return '\uFEFF'+rows.map(function(r){return r.map(csvEsc).join(',');}).join('\r\n'); }
function download(name, rows){
  var txt=toCSV(rows);
  try{
    var b=new Blob([txt],{type:'text/csv;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 800);
    toast(name+' 을(를) 내려받았습니다.');
  }catch(e){ toast('내려받기가 막혔습니다. 아래 미리보기를 긁어 쓰세요.'); }
  return txt;
}

/* 🔒 교번 새는지 검사 — 칸 이름과 값을 모두 봅니다 */
function hasProfNum(rows){
