/* ---- 팀 만들기 / 고치기 화면 ---- */
function stTeamMake(st, editT){
  var cid = st.classId, edit = !!editT;
  var h = '<div class="card"><h3>'+(edit? '✏️ 우리 팀 수정하기' : '[1단계] 팀 만들기')+'</h3>';

  if(!edit && teamFull(cid))
    return h + '<div class="note r"><b>이 강좌는 '+teamCap()+'팀이 모두 만들어졌습니다. 담당교수님께 말씀해 주세요.</b></div>'+
      '<p class="muted">남은 학생을 기존 팀에 넣어 주시는 것은 담당교수님이 하십니다.</p></div>';

  h += '<p class="muted">우리 팀을 만듭니다. <b>팀에서 한 명만 입력하면 됩니다.</b> '+
       '고른 팀원들은 아무것도 하지 않아도 이 팀에 들어갑니다.</p>'+
       '<div class="kv">'+
       '<span class="k">나</span><span><b>'+esc(sn(st))+'</b> <span class="muted">— 자동으로 팀원이 됩니다 (못 바꿈)</span></span>'+
       '<span class="k">강좌</span><span>'+esc(clsFull(cid))+' <span class="muted">— 같은 강좌 학생만 고를 수 있습니다</span></span>'+
       '</div>';

  var cur = teamPreset ? teamPreset.slice()
          : (edit? teamMembers(editT.id).map(function(m){return m.st.id;}) : []);
  var pool = teamPickPool(st);
  var busyN = pool.filter(function(s){ return s.teamId && cur.indexOf(s.id)<0; }).length;

  h += '<div class="hr"></div><label class="f">팀원 고르기 <span class="req">*</span> <span class="lim">나 포함 3~4명</span></label>'+
    '<input type="text" id="tmQ" placeholder="검색: 이름 또는 학번" autocomplete="off" oninput="teamFilter(this.value)">'+
    '<div class="picklist" id="tmList">'+
    pool.map(function(s){
      var inMine = cur.indexOf(s.id)>=0;
      var busy = !!s.teamId && !inMine;
      var ot = busy? DB.one('teams', s.teamId) : null;
      return '<label class="pickrow'+(busy?' off':'')+'" data-k="'+esc(s.name+' '+s.no)+'">'+
        '<input type="checkbox" class="tmPick" value="'+s.id+'" '+(inMine?'checked ':'')+(busy?'disabled ':'')+'onchange="teamPickCount()">'+
        '<span>'+esc(sn(s))+'</span>'+
        (busy? '<span class="bg gray">⊘ 이미 '+(ot? ot.no+'팀 「'+esc(ot.name)+'」':'다른 팀')+'</span>':'')+
        '</label>';
    }).join('')+'</div>'+
    '<div class="note b" id="tmCount">'+teamPickText(cur.length+1)+'</div>'+
    (busyN? '<p class="muted">⊘ 표시된 '+busyN+'명은 <b>이미 다른 팀</b>이라 고를 수 없습니다. 목록에서 지우지 않고 그대로 두어, 누가 어느 팀인지 보이게 했습니다.</p>':'')+
    '<label class="f">팀 이름 <span class="req">*</span> <span class="lim">2~15자 · 같은 강좌 안에서 중복 불가</span></label>'+
    '<input type="text" id="tmName" maxlength="15" value="'+esc(edit? editT.name:'')+'" placeholder="예: 초록물결">'+
    '<label class="f">팀 이름의 뜻 <span class="req">*</span> <span class="lim">왜 이렇게 지었는지 한 문장</span></label>'+
    '<input type="text" id="tmWhy" maxlength="100" value="'+esc(edit? (editT.meaning||''):'')+'" placeholder="예: 우리가 만든 것이 초록 물결처럼 퍼지기를 바라서">'+
    (teamErr? '<div class="note r"><b>⛔ '+esc(teamErr)+'</b><br>'+
       '<span class="muted">고르신 것은 그대로 두었습니다. 고쳐서 다시 눌러 주세요.</span></div>':'')+
    '<div class="btnrow" style="margin-top:10px">'+
    (edit
      ? '<button class="btn fix" onclick="teamSaveEdit(\''+editT.id+'\')">✏️ 수정 저장하기</button>'+
        '<button class="btn" onclick="teamCloseEdit()">그만두기</button>'
      : '<button class="btn pri full" onclick="teamMake()">팀 만들기</button>')+
    '</div></div>';
  return h;
}
function teamPickText(n){
  return '→ 지금 <b>'+n+'명</b> (나 + '+(n-1)+'명)'+
    (n<3? ' <span class="bg red">3명이 되어야 저장됩니다</span>'
        : (n>4? ' <span class="bg red">4명까지입니다</span>' : ' <span class="bg green">저장할 수 있습니다</span>'));
}
/* 고른 인원수 — 화면을 다시 그리지 않고 숫자만 바꿉니다 (검색칸 글자가 날아가지 않게) */
function teamPickCount(){
  var n=1, els=document.querySelectorAll('.tmPick');
  for(var i=0;i<els.length;i++) if(els[i].checked) n++;
  var c=$('tmCount'); if(c) c.innerHTML = teamPickText(n);
}
/* 검색 — 25명을 폰에서 훑지 않으시라고. ★ 이미 고른 사람은 검색해도 계속 보입니다 */
function teamFilter(q){
  q = String(q==null?'':q).replace(/[\s ]/g,'');
  var rows=document.querySelectorAll('#tmList .pickrow');
  for(var i=0;i<rows.length;i++){
    var k=(rows[i].getAttribute('data-k')||'').replace(/[\s ]/g,'');
    var box=rows[i].querySelector('input');
    rows[i].style.display = (!q || k.indexOf(q)>=0 || (box&&box.checked))? '' : 'none';
  }
}
function teamPicked(){
  var ids=[], els=document.querySelectorAll('.tmPick');
  for(var i=0;i<els.length;i++) if(els[i].checked && !els[i].disabled) ids.push(els[i].value);
  return ids;
}
function teamOpenEdit(){ teamEditOpen=true; teamPreset=null; teamErr=''; render(); }
function teamCloseEdit(){ teamEditOpen=false; teamPreset=null; teamErr=''; render(); }
function teamMake(){
  var r = teamCreate(SESS.me, teamPicked(), val('tmName'), val('tmWhy'));
  if(!r.ok){ teamPreset=teamPicked(); teamErr=r.msg; toast('⛔ '+r.msg); render(); return; }
  SESS.me = DB.one('students', SESS.me.id);
  teamEditOpen=false; teamPreset=null; teamErr='';
  DB.log('팀 만들기', r.team.classId+' '+r.team.no+'팀 「'+r.team.name+'」 · '+
    teamMembers(r.team.id).map(function(m){return m.st.name;}).join(', '));
  toast('팀을 만들었습니다. 고른 팀원들은 따로 입력하지 않아도 이 팀에 들어갑니다.');
  render();
}
function teamSaveEdit(tid){
  var t=DB.one('teams', tid), st=DB.one('students', SESS.me.id);
  if(!t || !teamEditable(t, st)){ toast('지금은 팀을 고칠 수 없습니다.'); return; }
  var ids=teamPicked(), nm=val('tmName'), wy=val('tmWhy');
  var stop=function(msg){ teamPreset=ids; teamErr=msg; toast('⛔ '+msg); render(); };
  var bad=teamNameBad(t.classId, nm, wy, t.id);
  if(bad){ stop(bad); return; }
  var total=ids.length+1;
  if(total<3||total>4){ stop('나를 포함해 3명 또는 4명이어야 합니다. 지금 '+total+'명입니다.'); return; }
  for(var i=0;i<ids.length;i++){
    var s=DB.one('students', ids[i]);
    if(!s || s.active===false || s.classId!==t.classId){ stop('같은 강좌 학생만 고를 수 있습니다.'); return; }
    if(s.teamId && s.teamId!==t.id){ stop(s.name+' 학생이 방금 다른 팀에 들어갔습니다. 다시 골라 주세요.'); return; }
  }
  teamMembers(t.id).forEach(function(m){          /* 빠진 사람 */
    if(m.st.id!==st.id && ids.indexOf(m.st.id)<0) teamLeave(m.st.id); });
  ids.forEach(function(id){                        /* 새로 들어온 사람 */
    if(!DB.one('members', function(m){return m.studentId===id && m.teamId===t.id;})) teamJoin(t.id, id, '팀원'); });
  DB.set('teams', t.id, {name:nm, meaning:wy});
  DB.log('팀 수정', t.classId+' '+t.no+'팀 「'+nm+'」 · '+
    teamMembers(t.id).map(function(m){return m.st.name;}).join(', '));
  teamEditOpen=false; teamPreset=null; teamErr=''; SESS.me=DB.one('students', st.id);
  toast('팀을 고쳤습니다.'); render();
}
function stTeamDisband(tid){
  var t=DB.one('teams', tid); if(!t) return;
  APP.confirm('「'+t.name+'」 팀을 해체합니다.\n\n'+
    '· 팀원 '+teamMembers(tid).length+'명이 모두 「팀 없음」이 됩니다\n'+
    '· 이 팀이 낸 가주제도 함께 사라집니다\n\n진행할까요?', function(){
    DB.log('팀 해체', t.classId+' '+t.no+'팀 「'+t.name+'」');
    teamDisband(tid);
    SESS.me=DB.one('students', SESS.me.id);
    teamEditOpen=false; toast('팀을 해체했습니다. 다시 만드실 수 있습니다.'); render();
  });
}

/* ---- [2단계] 가주제 3개 — 팀원 누구나 입력합니다 ---- */
function stTopics(t){
  var tps = DB.get('topics', function(x){return x.teamId===t.id && x.kind==='가주제';}).sort(function(a,b){return a.no-b.no;});
  var h = '<div class="card"><h3>[2단계] 가주제 3개 <span class="muted">— 팀원 누구나 입력할 수 있습니다</span></h3>';
  for(var i=1;i<=3;i++){
    var tp = tps.filter(function(x){return x.no===i;})[0];
    h += '<div class="hr"></div><b>가주제 '+i+'</b>'+
      '<label class="f">제목 <span class="req">*</span> <span class="lim">40자</span></label>'+
      '<input type="text" id="tp'+i+'t" maxlength="40" value="'+esc(tp?tp.title:'')+'">'+
      '<label class="f">한 줄 설명 <span class="req">*</span> <span class="lim">100자</span></label>'+
      '<input type="text" id="tp'+i+'s" maxlength="100" value="'+esc(tp?tp.summary:'')+'">'+
      (tp&&tp.comment? '<div class="note b" style="margin-top:6px">👩‍🏫 교수 의견: '+esc(tp.comment)+'</div>':'');
  }
  var hasTp = tps.length>=3;
  h += (canFix(2)
        ? '<div class="btnrow" style="margin-top:10px">'+
          (hasTp? fixBtn("saveTopics('"+t.id+"')", '수정 저장하기')
                : '<button class="btn pri" onclick="saveTopics(\''+t.id+'\')">제출하기</button>')+
          '</div>'+fixLine(2)+
          '<p class="muted">※ 3개를 모두 채워야 제출됩니다</p>'
        : '<div class="note" style="margin-top:10px">⬛ <b>'+FIX_LOCKED+'</b></div>')+
    /* 🔴 8차 — 여기서 정한 3개가 3주차 제출함 3개가 됩니다. 학생이 미리 알아야
       "왜 3주차에 이 주제가 떠 있지"라고 되묻지 않습니다. */
    '<div class="note b" style="margin-top:8px">➡️ 여기서 정한 <b>가주제 3개가 그대로 3주차 제출함 3개</b>가 됩니다. '+
    '3주차에는 <b>주제마다 따로</b> 배경·필요성·조사 방법을 냅니다.</div></div>';
  return h;
}
function stKosac(){
  return '<div class="card"><h3>[안내] KOSAc 영상콘텐츠 챌린지</h3>'+
    '<p class="muted">교수님이 올린 안내문·링크·파일이 여기 나옵니다.</p></div>';
}

function saveTopics(tid){
  if(!canFix(2)){ toast('⛔ '+FIX_LOCKED); return; }
  var rows=[];
  for(var i=1;i<=3;i++){
    var t=val('tp'+i+'t'), s=val('tp'+i+'s');
    if(!t||!s){ toast('가주제 '+i+'의 제목과 설명을 채워 주세요.'); return; }
    rows.push({no:i,title:t,summary:s});
  }
  if(teamMembers(tid).length<3){ toast('팀원이 3명 이상이어야 가주제를 낼 수 있습니다.'); return; }
  rows.forEach(function(r){
    var ex=DB.one('topics', function(x){return x.teamId===tid&&x.kind==='가주제'&&x.no===r.no;});
    if(ex) DB.set('topics', ex.id, {title:r.title, summary:r.summary});
    else DB.add('topics',{teamId:tid,kind:'가주제',no:r.no,title:r.title,summary:r.summary,back:'',need:'',how:'',comment:''});
  });
  toast(rows.length&&DB.get('topics',function(x){return x.teamId===tid&&x.kind==='가주제';}).length>=3
    ? '가주제 3개를 저장했습니다.' : '가주제 3개를 제출했습니다.'); render();
}

/* ==========================================================================
   ===== 3주차 — 가주제마다 「제출함」 하나씩 (2026-08-20 · 8차) =====
   --------------------------------------------------------------------------
   교수님 지시: "2주차에 정한 주제 3개마다 과제 제출함을 만들어서 제출할 수 있게"

   ▸ 제출함 3개가 나란히 있고 각각 「따로」 냅니다. 하나라도 빠지면 3/3이 아닙니다.
   ▸ 2주차 가주제를 그대로 물려받습니다 — 여기서 주제를 새로 만들지 않습니다.
   ▸ 팀 공동 제출물 — 팀원 누구나 쓰고 고칩니다.
   ▸ 🔴 임시 저장이 있습니다. 조사 글은 길어 한 번에 못 씁니다.
   ========================================================================== */
var CIRC = ['①','②','③','④','⑤'];
var subOpen=null;     /* 지금 열어 놓은 제출함(가주제 id) — 한 번에 하나만 엽니다 */
var subTeam=null;     /* 그 제출함이 어느 팀 것인가 (교수가 남의 팀 것을 열 수도 있으므로) */
var subRev=null;      /* 열었을 때의 「고친 횟수」 — 남이 먼저 고쳤는지 가리는 자 */
var subDraft=null;    /* 🔴 저장이 거부돼도 쓰던 글을 잃지 않게 들고 있습니다 */
var subStale='';      /* 남이 먼저 고쳐 저장을 멈춘 안내 — 사라지는 토스트 말고 화면에 남깁니다 */
var subErr='';        /* 거부 사유 (필수 칸·글자 수) */

/* 지금 쓰는 사람 이름 — 「마지막으로 낸 사람」에 그대로 들어갑니다 */
function subWho(){
  if(SESS.role==='student') return SESS.me? SESS.me.name : '학생';
  return SESS.acc? SESS.acc.name : '담당교수';
}
function subOpenBox(teamId, topicId){
  var r=subRow(teamId, topicId);
  subOpen=topicId; subTeam=teamId; subRev=r? (r.rev||0) : 0;
  subDraft=null; subStale=''; subErr=''; render();
}
function subClose(){ subOpen=null; subTeam=null; subRev=null; subDraft=null; subStale=''; subErr=''; render(); }
function subReadForm(){ return {back:val('sb_back'), need:val('sb_need'), how:val('sb_how'), refs:val('sb_refs')}; }
function subDo(wantDone){
  var d=subReadForm();
  subDraft=d;                     /* 무슨 일이 있어도 쓴 글은 들고 있습니다 */
  var res=subSave(subTeam, subOpen, d, !!wantDone, subWho(), subRev);
  if(res.stale){ subStale=res.msg; subErr=''; render(); return; }
  if(!res.ok){ subErr=res.msg; subStale=''; toast('⛔ '+res.msg); render(); return; }
  subRev=res.row.rev; subDraft=null; subStale=''; subErr='';
  if(wantDone){ subOpen=null; subTeam=null; toast('제출했습니다.'); }
  else toast('임시 저장했습니다. 이어서 쓰셔도 됩니다.');
  render();
}
/* 남이 먼저 저장한 글을 불러옵니다 — 내가 쓰던 글은 이때만 버려집니다(확인창) */
function subRefresh(){
  APP.confirm('방금 저장된 내용을 불러옵니다.\n\n· 지금 칸에 쓰고 계시던 글은 사라집니다\n· 필요하면 먼저 긁어서 복사해 두세요\n\n진행할까요?', function(){
    var r=subRow(subTeam, subOpen);
    subRev=r? (r.rev||0) : 0; subDraft=null; subStale=''; subErr='';
    toast('방금 저장된 내용을 불러왔습니다.'); render();
  });
}

/* ---- 학생 화면 ---- */
function stResearch(){
  var t=teamOf(SESS.me);
  if(!t) return '<div class="card"><h3>조사 자료 제출</h3>'+
    '<div class="note a">먼저 <b>2주차</b>에서 팀을 만들어야 합니다. 제출은 팀 단위입니다.</div>'+
    '<button class="btn pri" onclick="go(\'week\',{n:2})">2주차로 가기</button></div>';

  var tps=teamTopics(t.id);
  /* 🔴 가주제가 아직 없으면 3주차가 성립하지 않습니다 — 빈 상자 대신 길을 알려 줍니다 */
  if(tps.length<3) return '<div class="card"><h3>조사 자료 제출</h3>'+
    '<div class="note a"><b>2주차에서 가주제 3개를 먼저 정해 주세요.</b><br>'+
    '제출함은 그 3개를 <b>그대로 물려받습니다</b> — 3주차에서 주제를 새로 만들지 않습니다.'+
    (tps.length? '<br>지금은 '+tps.length+'개만 있습니다.':'')+'</div>'+
    '<button class="btn pri" onclick="go(\'week\',{n:2})">2주차로 가기</button></div>';

  var c=subCount(t.id), ro=(wState(3)==='마감');
  return '<div class="card"><h3>[1] 조사 자료 제출 <span class="muted">— 가주제마다 하나씩</span></h3>'+
    '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'+
      '<b>우리 팀 '+t.no+'팀 「'+esc(t.name)+'」</b><span style="flex:1"></span>'+
      '<span class="bg '+(c.done>=c.need?'green':(c.done?'amber':'gray'))+'">제출 '+c.done+'/'+c.need+'</span></div>'+
    '<div class="note b" style="margin-top:8px"><b>세 개를 따로 냅니다.</b> 하나라도 빠지면 '+c.need+'/'+c.need+'가 되지 않습니다. '+
      '<b>팀원 누구나</b> 쓰고 고칠 수 있습니다 — 만든 사람만이 아닙니다.</div>'+
    fixNote(3)+
    tps.map(function(tp,i){ return subBox(t, tp, i, ro); }).join('')+
    '</div>';
}

/* ---- 제출함 한 칸 ---- */
function subBox(t, tp, i, ro){
  var r=subRow(t.id, tp.id);
  var open=(subOpen===tp.id && subTeam===t.id);
  var stat = (r && r.done)
    ? '<span class="bg green">✅ 제출 완료</span> <span class="muted">'+esc(r.doneAt||'')+' · '+esc(subDoneActor(r))+'</span>'
    : (subHasText(r)
       ? '<span class="bg amber">💾 임시 저장됨</span> <span class="muted">'+esc(r.at||'')+' · '+esc(subActor(r))+'</span>'
       : '<span class="bg gray">⬜ 아직 제출하지 않았습니다</span>');
  /* 🔴 9차 — 버튼은 「수정하기」 한 말로, 채워진 파랑으로.
     마감 뒤에는 수정 버튼을 아예 없애고 이유만 남깁니다(눌리지 않는 버튼은 계속 눌립니다) */
  var open2 = "subOpenBox('"+t.id+"','"+tp.id+"')";
  var btn;
  if(ro)                 btn = '<button class="btn sm" onclick="'+open2+'">낸 내용 보기</button>';
  else if(r && r.done)   btn = fixBtn(open2, '수정하기', true);
  else                   btn = '<button class="btn sm pri" onclick="'+open2+'">'+(subHasText(r)? '이어서 쓰기':'제출하기')+'</button>';
  var why = '';
  /* ⚠️ 마감 문구는 화면 맨 위에 한 번만 — 칸마다 세 번 되풀이하면 정작 볼 것이 묻힙니다 */
  if(!ro && r && r.done) why = fixLine(3);
  return '<div class="acc" style="padding:10px;margin:8px 0 0">'+
    '<div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap">'+
      '<b>가주제 '+CIRC[i]+'</b><span style="flex:1;min-width:120px">'+esc(tp.title)+'</span></div>'+
    (tp.summary? '<div class="muted" style="margin:2px 0 0">'+esc(tp.summary)+'</div>':'')+
    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px">'+stat+
      '<span style="flex:1"></span>'+
      (open? '<button class="btn sm" onclick="subClose()">접기</button>' : btn)+'</div>'+
    (why? '<div style="margin-top:4px">'+why+'</div>':'')+
    (open? subFormHtml(t, tp, !ro) : '')+'</div>';
}

/* ---- 제출함 안 — 학생도 교수도 「같은 양식」을 씁니다 ---- */
function subFld(label, id, lim, v, req, tall){
  return '<label class="f">'+label+(req?' <span class="req">*</span>':'')+
    ' <span class="lim">'+(req? SUB_MIN+'자 이상 · ':'선택 · ')+lim+'자까지</span></label>'+
    '<textarea id="'+id+'" maxlength="'+lim+'"'+(tall?' style="min-height:120px"':'')+'>'+esc(v||'')+'</textarea>';
}
function subFormHtml(t, tp, canWrite){
  var r=subRow(t.id, tp.id), d=subDraft||r||{};
  var h='<div class="hr"></div>';

  /* 🔴 두 사람이 동시에 쓴 경우 — 조용히 덮어쓰지 않고 여기서 멈춥니다 */
  if(subStale) h += '<div class="note r">⚠️ <b>'+esc(subStale)+'</b><br>'+
    '지금 쓰신 글은 아래 칸에 <b>그대로 있습니다</b> — 사라지지 않았습니다. 필요한 곳만 옮겨 적으시면 됩니다.'+
    ((r&&r.back)? '<br><span class="muted">방금 저장된 배경: '+esc(String(r.back).slice(0,60))+'…</span>':'')+
    '<br><button class="btn sm" style="margin-top:6px" onclick="subRefresh()">새로 고침 — 방금 저장된 내용 불러오기</button></div>';
  if(subErr) h += '<div class="note a">⛔ '+esc(subErr)+'</div>';

  if(!canWrite){
    return h + '<b>배경</b><p>'+esc(d.back||'(비어 있음)')+'</p>'+
      '<b>필요성</b><p>'+esc(d.need||'(비어 있음)')+'</p>'+
      '<b>조사 방법</b><p>'+esc(d.how||'(비어 있음)')+'</p>'+
      '<b>참고한 자료</b><p class="muted">'+esc(d.refs||'(없음)')+'</p>'+
      '<div class="btnrow"><button class="btn" onclick="subClose()">닫기</button></div>';
  }

  h += subFld('배경','sb_back',800,d.back,true,true)+
       subFld('필요성','sb_need',500,d.need,true)+
       subFld('조사 방법','sb_how',500,d.how,true)+
       subFld('참고한 자료','sb_refs',300,d.refs,false)+
       '<label class="f">파일 첨부 <span class="lim">선택</span></label>'+
       '<div class="note"><b>여기는 자리만 있습니다.</b> 실제 파일 올리기는 <b>데이터베이스가 붙어야</b> 됩니다 — '+
         '고른 파일은 저장되지 않습니다(파일 보관 기능은 없습니다).<br>'+
         '<button class="btn sm" disabled style="margin-top:6px">파일 고르기 (아직 안 됩니다)</button></div>'+
       '<div class="btnrow" style="margin-top:10px">'+
         ((r&&r.done)? '<button class="btn fix" onclick="subDo(1)">✏️ 수정해 다시 제출하기</button>'
                     : '<button class="btn pri" onclick="subDo(1)">제출하기</button>')+
         '<button class="btn" onclick="subDo(0)">💾 임시 저장</button>'+
         '<button class="btn" onclick="subClose()">닫기</button></div>'+
       '<p class="muted">※ <b>임시 저장</b>은 빈칸이 있어도 됩니다 — 쓰다 말고 저장해 두었다가 이어서 쓰세요. '+
         '<b>제출하기</b>는 배경·필요성·조사 방법을 다 채워야 됩니다.</p>'+
       (r? '<p class="muted">마지막 저장 '+esc(r.at||'-')+' · '+esc(subActor(r))+
           (r.done? ' · 제출 '+esc(r.doneAt||'')+' · '+esc(subDoneActor(r)):'')+'</p>':'');
  return h;
}
/* ===== 교수 튜터링 — 🔴 학생 화면에는 없습니다 (2026-08-22 · 17차) =====
   교수님 지시(원문): "학생들은 튜터링 내용이 현재 보이나? 굳이 보일필요는 없을 것 같아."

   ⛔ 옛 `stTutor()` · `ackTutor()` · 「확인했습니다」 버튼 · 확인 시각 기록을 전부 걷어냈습니다.
      일지는 **교수 기록물**이지 학생 피드백이 아닙니다. 학생이 본다는 것을 알면 교수가
      솔직하게 못 쓰고(「이 팀은 준비가 부족함」 같은 판단을 순화하게 됨), 그러면 6회를 쌓아
      학기말 근거로 쓰려던 일지의 값이 떨어집니다. 둘을 한 칸에 섞은 것이 잘못이었습니다.

   ▸ 튜터링 내용이 나가는 곳은 이제 세 군데뿐입니다 — 교수 화면 · A4 일지 · tutoring_all.csv.
     셋 다 교수·슈퍼 관리자만 봅니다(다른 강좌 교수는 읽기만).
   ================================================================== */

/* ===== 5주차 — 최종 주제 ===== */
function stFinalTopic(){
  var t=teamOf(SESS.me); if(!t) return '';
  var tps=DB.get('topics',function(x){return x.teamId===t.id&&x.kind==='가주제';}).sort(function(a,b){return a.no-b.no;});
  var fin=DB.one('topics',function(x){return x.teamId===t.id&&x.kind==='최종';});
  /* 🔴 R12 (2026-08-23) — 교수 승인 후에도 학생이 언제든 최종주제를 수정할 수 있습니다.
     (교수님 지시) 옛 「승인 완료 = 읽기 전용」 잠금을 없애고, 승인 상태에서도 편집 폼을 그대로 띄웁니다.
     승인 뒤 수정하면 교수 승인 화면에 「✏️ 승인 후 수정됨」 배지가 떠서 교수가 다시 확인합니다. */
  /* fin.from 이 있으면 = 가주제에서 고른 것 · 비어 있는데 fin 이 있으면 = 새 주제 직접 작성 */
  var isNew = !!(fin && !fin.from);
  var okBanner = (fin && fin.ok) ?
    '<div class="note" style="border-color:#2e7d32">✅ <b>교수 승인 완료</b>'+
      (fin.okAt? ' <span class="muted">('+esc(fin.okAt)+')</span>':'')+
      (fin.editedAfterOk? ' · <span class="bg amber">✏️ 승인 후 수정됨</span>'+(fin.okEditAt? ' <span class="muted">'+esc(fin.okEditAt)+'</span>':''):'')+
      '<br>승인 뒤에도 <b>언제든 수정</b>할 수 있습니다. 다만 수정하시면 담당교수님이 <b>다시 확인</b>합니다(승인은 그대로 유지됩니다).</div>' : '';
  return '<div class="card"><h3>[1] 최종 주제 선정'+(fin&&fin.ok?' <span class="bg green">✅ 승인 완료</span>':'')+'</h3>'+
    okBanner+
    '<p class="muted">가주제 3개 중 하나를 고르거나, <b>새 주제를 직접 작성</b>할 수 있습니다. 어느 쪽이든 <b>최종 주제 1개 + 사유</b>를 남기면 됩니다.</p>'+
    tps.map(function(tp){
      return '<div class="chk"><input type="radio" name="fin" value="'+tp.id+'" '+(fin&&fin.from===tp.id?'checked':'')+
      ' onclick="finPick(\''+esc(tp.title).replace(/'/g,"\\'")+'\')"><span>가주제 '+tp.no+' 「'+esc(tp.title)+'」</span></div>'; }).join('')+
    '<div class="chk"><input type="radio" name="fin" value="__new__" '+(isNew?'checked':'')+
      ' onclick="finPick(\'\')"><span>✏️ 새 주제 직접 작성 (가주제에 없던 주제로 정하기)</span></div>'+
    '<label class="f">최종 주제명 <span class="req">*</span> <span class="lim">40자 · 가주제를 고르면 자동으로 채워집니다. 다듬거나 새로 적어도 됩니다</span></label>'+
    '<input type="text" id="fnTitle" maxlength="40" value="'+esc(fin?fin.title:'')+'">'+
    '<label class="f">선정/작성 사유 <span class="req">*</span> <span class="lim">500자 · 왜 이 주제를 최종으로 정했는지</span></label>'+
    '<textarea id="fnWhy">'+esc(fin?fin.summary:'')+'</textarea>'+
    /* 🔴 R12 (2026-08-23) — 최종주제는 승인 전이든 후든 「언제든 제한 없이」 수정할 수 있습니다.
       평가(4·7·13·14주차)의 「1회 수정」 잠금과 다릅니다 — 여기는 횟수·마감 잠금이 없습니다. */
    '<div class="btnrow">'+(fin? fixBtn("saveFinal('"+t.id+"')", '수정 저장하기')
                                : '<button class="btn pri" onclick="saveFinal(\''+t.id+'\')">제출하기</button>')+'</div>'+
    '<div class="muted">'+(fin? (fin.ok? '승인 후에도 <b>언제든</b> 수정할 수 있습니다. 수정하면 교수님이 다시 확인합니다.'
                                       : '<b>언제든 제한 없이</b> 수정할 수 있습니다 (마감·횟수 제한 없음).')
                              : '낸 뒤에도 <b>언제든</b> 수정할 수 있습니다.')+'</div>'+
    (fin && !fin.ok? '<div class="note b" style="margin-top:8px">제출됨'+
          (fin.edited? ' · <b>수정됨</b> ('+esc(fin.editedAt||'')+')':'')+
          ' — 교수 승인을 기다리는 중입니다.</div>':'')+'</div>';
}
/* 가주제 라디오를 고르면 최종 주제명 칸을 그 제목으로 채워 줍니다(비어 있을 때만 자동, 이미 손대셨으면 그대로 둠).
   「새 주제 직접 작성」을 고르면 빈 칸으로 두어 직접 적게 합니다. */
function finPick(title){
  var el=$('fnTitle'); if(!el) return;
  if(title){ if(!el.value.trim()) el.value=title; }   /* 가주제 선택 — 비어 있을 때만 채움 */
  el.focus();
}
function saveFinal(tid){
  /* 🔴 R12 (2026-08-23) — 최종주제는 마감 잠금도, 승인 잠금도 두지 않습니다.
     교수 승인 후에도 학생이 언제든 수정할 수 있습니다(교수님 지시). 승인 상태(ok)는 그대로 두고,
     승인 뒤 실제로 내용이 바뀌면 editedAfterOk 표시만 남겨 교수님이 다시 확인하게 합니다. */
  var pick=document.querySelector('input[name=fin]:checked');
  var ti=val('fnTitle'), wy=val('fnWhy');
  if(!pick){ toast('가주제 중 하나를 고르거나 「새 주제 직접 작성」을 선택해 주세요.'); return; }
  if(!ti||!wy){ toast('주제명과 선정/작성 사유는 필수입니다.'); return; }
  /* 가주제를 고르면 from=가주제id · 새 주제면 from='' (빈 값이 「직접 작성」의 표시입니다) */
  var from = (pick.value==='__new__') ? '' : pick.value;
  var ex=DB.one('topics',function(x){return x.teamId===tid&&x.kind==='최종';});
  if(ex){
    /* 🔴 R10/R12 — 최초 저장 뒤 실제로 내용이 바뀌면 「수정됨」으로 표시합니다(교수 화면에 보임).
       제목·사유·선택(from) 중 하나라도 달라졌을 때만 수정으로 봅니다(똑같이 다시 눌렀을 때 제외). */
    var changed = (ex.title!==ti) || (ex.summary!==wy) || ((ex.from||'')!==(from||''));
    var patch={title:ti,summary:wy,from:from};
    if(changed){
      patch.edited=true; patch.editedAt=nowStr();
      /* 이미 승인된 뒤의 수정이면 별도 배지(교수 승인 화면) — 승인 자체는 유지합니다 */
      if(ex.ok){ patch.editedAfterOk=true; patch.okEditAt=nowStr(); }
    }
    DB.set('topics', ex.id, patch);
    DB.log(ex.ok?'최종 주제 수정(승인 후)':'최종 주제 수정', tid+' 「'+ti+'」');
    toast(changed? (ex.ok? '최종 주제를 수정했습니다. 담당교수님이 다시 확인합니다.' : '최종 주제를 수정했습니다.') : '변경 사항이 없습니다.');
  }else{
    DB.add('topics',{teamId:tid,kind:'최종',no:1,title:ti,summary:wy,from:from,ok:false,
      edited:false, at:nowStr(), back:'',need:'',how:'',comment:''});
    DB.log('최종 주제 제출', tid+' 「'+ti+'」');
    toast('최종 주제를 제출했습니다.');
  }
  render();
}

/* ===== 11주차 — 현장견학 「팀별 견학 의견」 (2026-08-23 신설) =====
   교수님 지시: "11주차 현장 견학에 대해서 팀별로 견학에 대한 학생들이 의견을 적어서 기록할 수 있게."
   ▸ 목록형입니다 — 한 팀이 함께 쓰는 칸 하나가 아니라, 팀원들이 각자 한 줄씩 쌓습니다.
     기록마다 작성자 이름·시각이 남습니다("학생들이 의견을 적어서"에 맞춘 해석).
   ▸ 견학 안내(집합·교통·준비물)는 stNotice 가 위에 그대로 보여 주고, 그 아래에 이 영역이 붙습니다.
   ▸ 저장은 기존 관문(DB.add/set/del) 그대로 — 원격이면 excursion 표로 갑니다.            */
function stExcursion(){
  var t=teamOf(SESS.me);
  if(!t) return '<div class="card"><h3>[의견] 우리 팀 견학 의견</h3>'+
    '<div class="note a">아직 팀에 들어가 있지 않습니다. 견학 의견은 <b>팀 단위</b>로 기록합니다.</div></div>';
  var list=DB.get('excursion', function(x){return x.teamId===t.id;})
             .sort(function(a,b){return (b.at||'')<(a.at||'')?-1:1;});   /* 최근이 위로 */
  var h='<div class="card"><h3>[의견] 우리 팀 견학 의견 <span class="muted">— '+list.length+'개</span></h3>'+
    '<p class="muted">현장견학에서 보고 느낀 점을 팀원 누구나 한 줄씩 남길 수 있습니다. 남긴 사람과 시각이 함께 기록됩니다.</p>';
  if(list.length){
    h += list.map(function(x){
      var mine = (SESS.me && x.authorId===SESS.me.id);
      return '<div class="note" style="margin-top:6px"><b>'+esc(x.author||'-')+'</b> '+
        '<span class="muted">'+esc(x.at||'')+'</span><br>'+esc(x.text).replace(/\n/g,'<br>')+
        (mine && canFix(11)? '<div style="margin-top:5px"><button class="btn sm" onclick="delExcursion(\''+x.id+'\')">🗑 내 의견 지우기</button></div>':'')+
        '</div>';
    }).join('');
  } else {
    h += '<div class="note">아직 남긴 의견이 없습니다. 첫 의견을 남겨 보세요.</div>';
  }
  if(canFix(11)){
    h += '<label class="f">견학 의견 남기기 <span class="req">*</span> <span class="lim">500자</span></label>'+
      '<textarea id="excText" placeholder="예) ○○기업의 배양 공정을 직접 보니 수업에서 배운 스케일업이 이해되었다."></textarea>'+
      '<div class="btnrow" style="margin-top:8px"><button class="btn pri" onclick="addExcursion(\''+t.id+'\')">의견 남기기</button></div>';
  } else {
    h += '<div class="note">⬛ <b>'+FIX_LOCKED+'</b></div>';
  }
  return h+'</div>';
}
function addExcursion(tid){
  if(!canFix(11)){ toast('⛔ '+FIX_LOCKED); return; }
  var tx=val('excText');
  if(!tx || tx.length<5){ toast('의견을 5자 이상 적어 주세요.'); return; }
  DB.add('excursion', {teamId:tid, classId:(SESS.me?SESS.me.classId:myClass()), week:11,
    author:(SESS.acc?SESS.acc.name:(SESS.me?SESS.me.name:'-')), authorId:(SESS.me?SESS.me.id:''),
    text:tx, at:nowStr()});
  toast('견학 의견을 남겼습니다.'); render();
}
function delExcursion(id){
  var x=DB.one('excursion', id); if(!x) return;
  if(!(SESS.me && x.authorId===SESS.me.id)){ toast('내가 남긴 의견만 지울 수 있습니다.'); return; }
  if(!canFix(11)){ toast('⛔ '+FIX_LOCKED); return; }
  DB.del('excursion', id); toast('내 견학 의견을 지웠습니다.'); render();
}

/* ===== 타이틀 전용 주차 (6·9·10·12) — 학생 입력 없음 (2026-08-23 교수님 지시) =====
   교수님: "6주차 광고 영상 제작 / 9·10·12주차 최종 앱 개발 — 제목만 남기고 학생 입력은 삭제.
           수업에서 진행하고, 앱에 따로 낼 것은 없다."
   ▸ 학생 화면의 입력 요소만 걷어냈습니다. 교수 튜터링(tutor:N)은 그대로 유지됩니다(교수 화면).
   ▸ 「5주차 이후 팀 주제는 최종 1개만」 원칙에 맞춰 우리 팀 최종 주제를 함께 보여 줍니다(표시만).  */
function stTitleOnly(n, title, sub){
  var t=teamOf(SESS.me);

         : '<div class="note a" style="margin-top:8px">아직 <b>최종 주제 미선정</b>입니다 — 5주차에서 최종 주제를 먼저 정해 주세요.</div>');
  return '<div class="card"><h3>'+esc(title)+'</h3>'+

}
/* ===== 6주차 — 광고 영상 제작 (타이틀만) ===== */

/* ===== 12주차 — 최종 앱 개발 ③ (타이틀만, 학생 입력 없음) =====
   ▸ 학생 입력(준비도·발표자·남은 과제)은 삭제했습니다.
   ▸ 다만 「최종발표 평가 기준(3회차 루브릭)」 공개는 입력이 아니라 학생이 봐야 할 정보라 그대로 둡니다. */
function stPrep(){
  var h = stTitleOnly(12, '최종 앱 개발 ③',
    '최종발표를 앞둔 마무리 개발 단계입니다. 수업에서 진행하며 앱에 따로 낼 것은 없습니다.');
  var open = DB.get('rubrics', function(r){return r.round===3 && r.openAt;});
  if(open.length){
    h += '<div class="card"><h3>📢 최종발표 평가 기준</h3><p class="muted">공개일 '+esc(open[0].openAt)+' · 최종발표는 이 기준으로 평가합니다</p>'+ rubricTable(3) +'</div>';
  }else{
    h += '<div class="card"><div class="note">최종발표 평가 기준은 수업에서 공개됩니다.</div></div>';
  }
  return h;
}
function savePrep(tid){
  if(!canFix(12)){ toast('⛔ '+FIX_LOCKED); return; }
  var sp=document.querySelector('input[name=p12]:checked');
  var row={teamId:tid,week:12,stage:sp?sp.value:'시작 전',did:val('p12who'),next:val('p12next'),at:nowStr()};
  var ex=DB.one('activity', function(x){return x.teamId===tid&&x.week===12;});
  if(ex) DB.set('activity', ex.id, row); else DB.add('activity', row);
  toast('12주차 준비 상황을 제출했습니다.'); render();
}
/* 🔴 18차 — 「점수」가 아니라 「수준」을 보여 줍니다.
   교수님 지시: "단순히 점수가 아닌 각 점수의 의미, 수준이 설명되어 있어서
                학생들이 그걸 기반으로 평가할 수 있도록"
   ▸ 12주차 「최종발표 평가 기준 공개」와 [루브릭 만들기]의 미리보기가 이 함수 하나를 씁니다. */
function rubricTable(round){
  var D = (typeof RUBRIC_DRAFT!=='undefined' && RUBRIC_DRAFT[round]) || {};
  var h = D.run ? '<div class="note"><b>진행</b> '+esc(D.run)+(D.note? '<br>'+esc(D.note):'')+'</div>' : '';
  [['prof','교수평가'],['inter','동료평가 — 팀간'],['intra','동료평가 — 팀내']].forEach(function(k){
    var rs=DB.get('rubrics', function(r){return r.round===round && r.kind===k[0];})
             .sort(function(a,b){return a.order-b.order;});
    if(!rs.length) return;
    var sum=0; rs.forEach(function(r){ sum += (r.max||4); });
    h += '<div class="hr"></div><b>['+k[1]+']</b> <span class="muted">'+rs.length+'개 항목 · 항목마다 4단계 · 합계 '+sum+'점</span>';
    rs.forEach(function(r){
      var lv = rbLevels(r), max = r.max||4;
      h += '<div class="lvq">'+esc(r.name)+'</div><div class="scroll"><table>'+
        lv.map(function(txt,idx){
          return '<tr><td class="c nw" style="width:34px"><b>'+(max-idx)+'</b></td><td>'+esc(txt)+'</td></tr>';
        }).join('')+'</table></div>';
    });
  });
  h += '<div class="note" style="margin-top:8px">총점은 <b>항목 합계</b>입니다 — 항목마다 가중치를 두지 않습니다. '+
       '점수와 함께 <b>서술 한 문장</b>을 반드시 적습니다.</div>';
  return h;
}
var ACC_SEQ = 0;
/* title 은 HTML 그대로 받습니다 — 부르는 쪽에서 esc() 하십시오.
   act = {open:'열 때 글자', close:'접을 때 글자', pri:true} */
function acc(title, open, body, act){
  var id='ac'+(++ACC_SEQ);
  var oL=(act&&act.open)||'펼치기', cL=(act&&act.close)||'접기';
  var pri=!!(act&&act.pri);
  return '<div class="acc"><div class="hd" onclick="accToggle(&#39;'+id+'&#39;)">'+
    '<span>'+title+'</span><span class="sp"></span>'+
    '<button type="button" class="btn sm'+((pri&&!open)?' pri':'')+'" id="'+id+'b"'+
      ' data-o="'+esc(oL)+'" data-c="'+esc(cL)+'" data-p="'+(pri?'1':'')+'"'+
      ' onclick="event.stopPropagation();accToggle(&#39;'+id+'&#39;)">'+esc(open?cL:oL)+'</button>'+
    '</div>'+
    '<div class="bd" id="'+id+'d" style="display:'+(open?'block':'none')+'">'+body+'</div></div>';
}
/* 열면 누르는 글자가 바뀌고, 첫 입력칸에 커서가 들어갑니다 (16차) */
function accToggle(id){
  var d=document.getElementById(id+'d'), b=document.getElementById(id+'b');
  if(!d) return;
  var willOpen = (d.style.display==='none');
  d.style.display = willOpen ? 'block' : 'none';
  if(b){
    b.textContent = willOpen ? b.getAttribute('data-c') : b.getAttribute('data-o');
    if(b.getAttribute('data-p')) b.className = willOpen ? 'btn sm' : 'btn sm pri';
  }
  if(willOpen){
    var el=d.querySelector('textarea,input[type=text],input[type=number]');
    if(el){ try{ el.focus(); }catch(e){} }
  }
}

/* ==========================================================================
   🎤 발표 순서 배정 · 루브릭 평가 공용 (2026-08-22 · 18차 신설)
   --------------------------------------------------------------------------
   교수님 지시(원문):
     · "발표의 순서는 교수가 들어가서 8개팀의 순서를 정할 수 있게 해주고,
        학생들에게는 그 순서대로 평가서가 보이도록 만들어줘"
     · "13주차에 교수가 24개 팀 중 12개 팀을 순서대로 체크하면 학생들에게
        발표팀 순서로 보이도록, 14주차도 마찬가지로 12개 팀을"
     · "교수들에게는 동일하게 13-14주차에 팀과 순서를 선정하거나 수정할 수 있게 해줘"

   🔑 누가 정하나
     · 4·7주차  — **담당교수가 자기 강좌 8팀**만 (기존 「수정은 자기 강좌만」 규칙 그대로)
     · 13·14주차 — **교수 3명 모두**가 **24팀 전체**를 정하고 고칩니다 (통합 발표)

   🔴 세 분이 같은 배정표 하나를 고칩니다 — 조용히 덮어쓰지 않습니다
     3주차 제출물에서 쓴 방식을 그대로 씁니다.
     ① 마지막으로 고친 사람·시각을 화면 위에 늘 표시
     ② 내가 연 뒤에 남이 고쳤으면 **저장을 멈추고** 알립니다
     ③ 무엇이 바뀌었는지 **변경 기록(audit)**에 남깁니다
   ========================================================================== */

var PRES_WEEKS = [4, 7, 13, 14];
function presJoint(n){ return n===13 || n===14; }            /* 3개 강좌 합동 주차 */
function presNeed(n){ return presJoint(n) ? 12 : 8; }        /* 그 주에 발표하는 팀 수 */

/* 그 주차 배정 후보 — 합동 주차는 24팀 전부, 그 밖은 그 강좌 8팀 */
function presPool(n, cid){
  if(presJoint(n)) return DB.get('teams').slice()
    .sort(function(a,b){ return a.classId===b.classId ? a.no-b.no : (a.classId<b.classId?-1:1); });
  var c = cid || myClass();
  return DB.get('teams', function(t){return t.classId===c;}).sort(function(a,b){return a.no-b.no;});
}

/* 정해진 발표 순서 — [{team, order}] · 없으면 빈 배열 */
function presList(n, cid){
  var rows = DB.get('assign', function(a){return a.n===n;});
  if(!presJoint(n) && cid) rows = rows.filter(function(a){ var t=team(a.teamId); return t && t.classId===cid; });
  return rows.map(function(a){ return {team:team(a.teamId), order:a.order}; })
             .filter(function(x){ return !!x.team; })
             .sort(function(a,b){ return a.order-b.order; });
}
function presDone(n, cid){ return presList(n, cid).length > 0; }

/* ---- 배정표의 「판(rev)」 · 마지막으로 고친 사람 ------------------------- */
function presMeta(n){
  var s = DB.d.settings;
  if(!s.assignMeta) s.assignMeta = {};
  if(!s.assignMeta[n]) s.assignMeta[n] = {rev:0, by:'', at:''};
  return s.assignMeta[n];
}
var presSeenRev = {};      /* 화면을 그린 순간의 판 — 저장할 때 이것과 견줍니다 */
var presPick    = {};      /* 화면에서 고르는 중인 값 {n: {teamId:순서}} */

function presCanEdit(n){
  if(!isProf()) return false;
  if(presJoint(n)) return true;                 /* 🔴 13·14주차는 교수 3명 모두 */
  return canEdit(myClass());                    /* 4·7주차는 자기 강좌만 */
}

/* ---- 저장 -------------------------------------------------------------- */
/* ids = 순서대로 늘어놓은 teamId 배열 */
function presSave(n, ids, seenRev){
  if(!presCanEdit(n)) return {msg:'이 주차의 발표 순서를 정할 권한이 없습니다.'};
  var need = presNeed(n);
  if(ids.length !== need)
    return {msg:'발표 팀은 정확히 '+need+'팀이어야 합니다. 지금 '+ids.length+'팀을 고르셨습니다.'};
  var seen = {};
  for(var i=0;i<ids.length;i++){
    if(seen[ids[i]]) return {msg:'같은 팀을 두 번 고르셨습니다.'};
    seen[ids[i]] = 1;
    if(!team(ids[i])) return {msg:'없는 팀이 들어 있습니다.'};
  }
  var meta = presMeta(n);
  /* 🔴 내가 연 뒤에 남이 고쳤으면 덮어쓰지 않고 멈춥니다 */
  if(seenRev!==undefined && seenRev!==null && meta.rev !== seenRev)
    return {stale:true, msg:(meta.by||'다른 교수님')+'이 방금 배정을 고치셨습니다. 새로 고침 후 다시 정해 주세요.'};

  var before = presList(n).map(function(x){ return x.team.classId+'-'+x.team.no; }).join(',');

  /* 이 주차 배정을 새로 씁니다 */
  DB.get('assign', function(a){return a.n===n;}).forEach(function(a){ DB.del('assign', a.id); });
  ids.forEach(function(tid, i){ DB.add('assign', {n:n, teamId:tid, order:i+1}); });

  /* 🔴 13주차를 정하면 나머지 12팀이 14주차로 자동 배정됩니다 (교수님 지시) */
  var auto = 0;
  if(n===13){
    var rest = DB.get('teams').filter(function(t){ return ids.indexOf(t.id)<0; })
      .sort(function(a,b){ return a.classId===b.classId ? a.no-b.no : (a.classId<b.classId?-1:1); });
    DB.get('assign', function(a){return a.n===14;}).forEach(function(a){ DB.del('assign', a.id); });
    rest.forEach(function(t, i){ DB.add('assign', {n:14, teamId:t.id, order:i+1}); });
    auto = rest.length;
    var m14 = presMeta(14);
    m14.rev = (m14.rev||0)+1; m14.by = SESS.acc.name; m14.at = nowStr();
  }

  meta.rev = (meta.rev||0)+1;
  meta.by  = SESS.acc.name;
  meta.at  = nowStr();
  DB.flush();

  var after = presList(n).map(function(x){ return x.team.classId+'-'+x.team.no; }).join(',');
  DB.log(n+'주차 발표 배정 변경',
    (before? '전: '+before+' → ':'처음 배정 · ')+'후: '+after + (auto? ' · 나머지 '+auto+'팀은 14주차로 자동 배정':''));

  return {ok:true, auto:auto};
}

/* 무작위 순서 — 4·7주차에서 교수님이 매번 손으로 번호를 매기지 않으시도록 */
function presShuffle(n){
  var pool = presPool(n).slice();
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  presPick[n] = {};
  pool.forEach(function(t,i){ presPick[n][t.id] = i+1; });
  render();
}

/* ==========================================================================
   배정 화면 — 주차 화면(교수) 안에 들어갑니다
   ========================================================================== */
function presPanel(n){
  var joint = presJoint(n), need = presNeed(n), meta = presMeta(n);
  var ed = presCanEdit(n);
  presSeenRev[n] = meta.rev;

  var cur = presList(n, joint ? null : myClass());
  var pick = presPick[n];
  if(!pick){                                   /* 처음 열면 저장된 순서를 그대로 올려 둡니다 */
    pick = presPick[n] = {};
    cur.forEach(function(x){ pick[x.team.id] = x.order; });
  }
  var picked = Object.keys(pick).filter(function(k){ return pick[k]; });

  var h = '<div class="card"><h3>발표 순서 배정 <span class="muted">— '+n+'주차 · '+need+'팀</span></h3>';

  /* 진행 표시 */
  if(joint){
    var c13 = presList(13).length, c14 = presList(14).length;
    h += '<div class="btnrow" style="margin-bottom:6px">'+
      '<span class="bg '+(c13===12?'green':'gray')+'">13주차 배정 '+c13+'/12</span>'+
      '<span class="bg '+(c14===12?'green':'gray')+'">14주차 배정 '+c14+'/12</span>'+
      '<span class="bg '+((c13+c14)===24?'green':'gray')+'">전체 '+(c13+c14)+'/24</span></div>';
  }else{
    h += '<div class="btnrow" style="margin-bottom:6px"><span class="bg '+(cur.length===need?'green':'gray')+'">'+
      '배정 '+cur.length+'/'+need+'팀</span></div>';
  }

  /* 🔴 마지막으로 고친 사람 — 세 분이 같은 표를 고치므로 늘 보여 드립니다 */
  if(meta.at) h += '<div class="muted" style="margin-bottom:6px">마지막 수정: <b>'+esc(meta.by)+' 교수</b> · '+esc(meta.at)+'</div>';

  if(!ed){
    h += '<div class="note">'+(joint
      ? '🔒 학생은 배정을 볼 수 없습니다.'
      : '🔒 '+roLabel(myClass()))+'</div>';
  }

  if(joint){
    h += '<div class="note">3개 강좌 <b>24팀 전체</b>에서 이 주에 발표할 <b>12팀</b>을 고르고 순서를 매깁니다. '+
      (n===13? '<b>저장하면 나머지 12팀이 14주차로 자동 배정</b>됩니다.'
             : '13주차에 배정되지 않은 12팀입니다. <b>순서만</b> 정하시면 됩니다.')+'</div>';
    if(n===14 && !presDone(13))
      h += '<div class="note r">13주차 배정을 먼저 하셔야 합니다. 13주차에서 12팀을 고르시면 나머지가 여기로 옵니다.</div>';
  }else{
    h += '<div class="note">이 강좌 '+need+'팀의 발표 순서를 정합니다. 정하신 순서 그대로 <b>학생 평가서가 배치</b>됩니다.</div>';
  }

  /* 목록 */
  var pool = presPool(n);
  if(n===14 && presDone(14)) pool = presList(14).map(function(x){return x.team;});   /* 14주차는 배정된 12팀만 */

  h += '<div class="scroll"><table><tr>'+
    (joint&&n===13? '<th class="c">발표</th>':'')+
    '<th>팀</th>'+(joint? '<th class="nw">담당교수</th>':'')+'<th class="c nw">순서</th></tr>'+
    pool.map(function(t){
      var v = pick[t.id] || '';
      return '<tr>'+
        ((joint&&n===13)
          ? '<td class="c"><input type="checkbox" '+(v?'checked':'')+' '+(ed?'':'disabled')+
            ' onchange="presToggle('+n+',&#39;'+t.id+'&#39;,this.checked)"></td>'
          : '')+
        '<td class="nw">'+esc(t.classId+'-'+t.no+' 「'+t.name+'」')+'</td>'+
        (joint? '<td class="nw">'+esc(classProf(t.classId))+'</td>':'')+
        '<td class="c" style="width:86px">'+
          (ed? '<input type="number" min="1" max="'+need+'" value="'+v+'" style="text-align:center;width:100%;min-width:58px;padding-left:4px;padding-right:4px"'+
               ' oninput="presNum('+n+',&#39;'+t.id+'&#39;,this.value)">'
             : (v||'-'))+'</td></tr>';
    }).join('')+'</table></div>';

  if(ed){
    h += '<div class="btnrow" style="margin-top:8px">'+
      '<button class="btn pri" onclick="presDoSave('+n+')">발표 순서 저장</button>'+
      (joint? '' : '<button class="btn" onclick="presShuffle('+n+')">순서 자동 배정 (무작위)</button>')+
      '<button class="btn" onclick="presPick['+n+']=null;render()">되돌리기</button></div>'+
      '<div class="muted" style="margin-top:4px">고른 팀 '+picked.length+'/'+need+' — '+need+'팀이 아니면 저장되지 않습니다.</div>';
    if(cur.length===need)
      h += '<div class="note">✅ <b>배정이 끝났습니다.</b> 지금 고치시면 <b>학생 화면의 평가서 순서가 바로 바뀝니다</b> — 발표 직전에는 조심하십시오.</div>';
  }
  return h + '</div>';
}

function presToggle(n, tid, on){
  if(!presPick[n]) presPick[n] = {};
  if(on){
    if(!presPick[n][tid]){
      var used = Object.keys(presPick[n]).map(function(k){return presPick[n][k];}).filter(function(x){return x;});
      var next = 1; while(used.indexOf(next)>=0) next++;
      presPick[n][tid] = next;
    }
  }else delete presPick[n][tid];
  render();
}
function presNum(n, tid, v){
  if(!presPick[n]) presPick[n] = {};
  var num = Number(v);
  if(!v || isNaN(num) || num<1) delete presPick[n][tid];
  else presPick[n][tid] = num;
}
function presDoSave(n){
  var pick = presPick[n] || {};
  var ids = Object.keys(pick).filter(function(k){ return pick[k]; })
    .sort(function(a,b){ return pick[a]-pick[b]; });
  var nums = ids.map(function(k){ return pick[k]; });
  for(var i=1;i<nums.length;i++) if(nums[i]===nums[i-1]){ toast('⛔ '+nums[i]+'번이 두 팀에 붙어 있습니다. 번호를 하나씩만 쓰십시오.'); return; }
  var r = presSave(n, ids, presSeenRev[n]);
  if(!r.ok){ toast('⛔ '+r.msg); if(r.stale){ presPick[n]=null; render(); } return; }
  presPick[n] = null;
  toast('발표 순서를 저장했습니다.'+(r.auto? ' 나머지 '+r.auto+'팀은 14주차로 배정했습니다.':''));
  render();
}

/* ==========================================================================
   🔘 루브릭 4단계 고르개 — 「점수」가 아니라 「수준 설명」을 누릅니다
   --------------------------------------------------------------------------
   교수님 지시: "단순히 점수가 아닌 각 점수의 의미, 수준이 설명되어 있어서
                학생들이 그걸 기반으로 평가할 수 있도록"
   ▸ 설명 문장 자체가 버튼입니다. 숫자만 눌러서는 무엇을 보고 그 점수인지 알 수 없습니다.
   ========================================================================== */
function rbLevels(r){
  if(r.lv && r.lv.length) return r.lv;
  return ['매우 우수','우수','보통','미흡'];
}
function rbPick(r, cur, onclickTpl){
  var lv = rbLevels(r), max = r.max || 4;
  return '<div class="lvgroup">'+                        /* 🔲 항목 하나를 카드로 감쌉니다 */
    '<div class="lvq">'+esc(r.name)+' <span class="req">*</span></div>'+
    '<div class="lvpick">'+ lv.map(function(txt, i){
      var v = max - i;                                   /* lv[0] = 만점 */
      return '<button type="button" class="'+(Number(cur)===v?'on':'')+'" '+
        'onclick="'+onclickTpl.replace('__V__', v)+'">'+
        '<span class="n">'+v+'</span><span class="t">'+esc(txt)+'</span></button>';
    }).join('')+'</div>'+
    '</div>';
}

/* ==========================================================================
   4·7·13·14주차 — 동료평가
   🔒 지켜야 할 것
     · 자기 팀은 목록에 아예 없습니다 (evalTargets 에서 걸러냅니다)
     · 「누가 평가했는지」는 어느 화면에도 그리지 않습니다
     · 서술 20자 이상 필수 · 제출 후 학생 수정 불가 · 소요 시간을 조용히 기록
   ========================================================================== */
var evalDraft = {};      /* {teamId 또는 studentId: {rubricId:점수, _t:서술}} */
var evalStart = null;

/* 🔴 평가 대상 팀 — 「교수가 정한 발표 순서 그대로」 · 자기 팀은 절대 들어오지 않습니다
   교수님 지시: "학생들에게는 그 순서대로 평가서가 보이도록 만들어줘" */
function evalTargets(def, who){
  var me = who || SESS.me;
  if(!me) return [];
  var n = def.n;
  return presList(n, presJoint(n) ? null : me.classId)
    .map(function(x){ return x.team; })
    .filter(function(t){ return t && t.id !== me.teamId; });     /* ★ 자기 팀 제외 */
}

/* ---- 임시 저장 — 앱을 닫았다 열어도 쓰던 것이 남습니다 (12팀은 한 번에 못 끝냅니다) ---- */
function evalDraftKey(){ return 'bio_evdraft_' + (SESS.me ? SESS.me.id : '-'); }
function evalDraftLoad(){
  try{ var v = localStorage.getItem(evalDraftKey()); if(v) evalDraft = JSON.parse(v) || {}; }catch(e){}
}
function evalDraftSave(){
  try{ localStorage.setItem(evalDraftKey(), JSON.stringify(evalDraft)); }catch(e){}
}

var evalCursor = {};        /* {주차: 지금 보고 있는 순번} — 한 화면에 한 팀만 */
var evalLoaded = false;

/* 🔁 2026-08-23 — 평가 주차(4·7·13·14) 학생 동료평가는 「제출 후 1회 수정」까지 허용합니다.
   editCount: 없음(-1)=아직 제출 안 함 · 0=제출됨(1회 수정 가능) · 1=수정까지 마침(잠금).
   ⛔ 교수평가(profEval)에는 이 제한을 두지 않습니다 — 발표 현장에서 점수를 자유로이 고쳐야 하기 때문입니다(기존 설계 유지). */
function peerRows(col, round, field, key){
  return DB.get(col, function(p){ return p.round===round && p.evaluator===SESS.me.id && p[field]===key; });
}
function peerState(rows){ return rows.length ? ((rows[0].editCount||0)>=1 ? 1 : 0) : -1; }
function interState(round, teamId){ return peerState(peerRows('peerTeam', round, 'teamId', teamId)); }
function intraState(round, sid){ return peerState(peerRows('peerMember', round, 'studentId', sid)); }
/* 이미 제출한 평가를 다시 열 때, 화면·검증이 쓸 수 있도록 임시입력(evalDraft)을 저장값으로 채웁니다(비어 있을 때만). */
function seedDraftFrom(target, rows){
  if(evalDraft[target]) return;
  if(!rows.length) return;
  var d={}; rows.forEach(function(z){ d[z.rubricId]=z.score; d._t=z.text; }); evalDraft[target]=d;
}
function stEval(n, def){
  var me = SESS.me, t = teamOf(me);
  if(!t) return '<div class="card"><div class="note r">팀이 없어 평가에 참여할 수 없습니다. 담당교수님께 문의하세요.</div></div>';
  if(!evalLoaded){ evalDraftLoad(); evalLoaded = true; }
  var D = (typeof RUBRIC_DRAFT !== 'undefined' && RUBRIC_DRAFT[def.round]) || {};
  var h = '';

  /* ── [0] 이 주차 운영 안내 ──────────────────────────────────────────
     ⛔ 교수님 지시: "각 주차에 직접 학생이 파일을 제출하는 건 만들 필요 없어. 따로 받을 예정"
        → 파일·영상 제출 자리를 전부 걷어냈습니다. 이 주차에는 평가만 있습니다. */
  h += '<div class="card"><h3>' + esc(D.title || (n + '주차 발표')) + ' <span class="muted">' + n + '주차</span></h3>' +
    '<div class="note"><b>진행</b> ' + esc(D.run || '') + (D.note ? '<br>' + esc(D.note) : '') + (D.extra ? '<br>'+esc(D.extra) : '') + '</div>' +
    '<p class="muted">이 주차에는 <b>따로 낼 파일이 없습니다.</b> 발표자료는 담당교수님이 따로 받으십니다. ' +
    '여러분이 할 일은 <b>동료평가</b>입니다.</p></div>';

  /* ── [1] 발표 순서 ───────────────────────────────────────────────── */
  var full = presList(n, presJoint(n) ? null : me.classId);
  var list = evalTargets(def);
  h += '<div class="card"><h3>[1] 발표 순서</h3>';
  if(!full.length){
    h += '<div class="note">발표 순서가 <b>아직 정해지지 않았습니다.</b> 수업 시간에 안내됩니다.</div></div>';
  }else{
    h += '<p class="muted">' + (presJoint(n) ? '오늘 발표하는 ' + full.length + '팀 · 3개 강좌 합동' : '교수님이 정하신 순서') + '</p>' +
      '<div class="scroll"><table><tr><th class="c">순서</th><th>팀</th>' +
      (presJoint(n) ? '<th class="nw">담당교수</th>' : '') + '</tr>' +
      full.map(function(x, i){
        var mine = x.team.id === t.id;
        return '<tr' + (mine ? ' class="alt"' : '') + '><td class="c">' + (i + 1) + '</td>' +
          '<td class="nw">' + esc(x.team.classId + '-' + x.team.no + ' 「' + x.team.name + '」') + (mine ? ' <b>★ 우리 팀</b>' : '') + '</td>' +
          (presJoint(n) ? '<td class="nw">' + esc(classProf(x.team.classId)) + '</td>' : '') + '</tr>';
      }).join('') + '</table></div></div>';
  }

  /* ── [2] 동료평가 — 팀간 · 🔴 한 화면에 한 팀만 ────────────────────── */
  if(full.length){
    var rbI = DB.get('rubrics', function(r){ return r.round === def.round && r.kind === 'inter'; })
      .sort(function(a, b){ return a.order - b.order; });
    var doneRows = DB.get('peerTeam', function(p){ return p.round === def.round && p.evaluator === me.id; });
    var stT = {}; list.forEach(function(x){ stT[x.id] = interState(def.round, x.id); });   /* -1/0/1 */
    var doneT = {}; list.forEach(function(x){ if(stT[x.id] >= 0) doneT[x.id] = 1; });
    var cnt = list.filter(function(x){ return stT[x.id] >= 0; }).length;      /* 제출한 팀 수 */
    var lockCnt = list.filter(function(x){ return stT[x.id] === 1; }).length; /* 수정까지 끝난 팀 수 */

    h += '<div class="card"><h3>[2] 동료평가 — 팀간 <span class="muted">(자기 팀 제외 · ' + list.length + '팀)</span></h3>';

    if(!list.length){
      h += '<p class="muted">평가할 팀이 없습니다.</p>';
    }else if(lockCnt >= list.length){
      /* 전부 「제출 + 1회 수정」까지 끝나 더는 못 고치는 상태 — 읽기 전용 표 */
      h += '<div class="note g">✅ ' + list.length + '/' + list.length + '팀 제출·수정 완료 — <b>더는 고칠 수 없습니다.</b> 내가 낸 평가는 아래와 같습니다.</div>' +
        '<div class="scroll"><table><tr><th class="c">순서</th><th>대상 팀</th>' +
        rbI.map(function(r){ return '<th class="c">' + esc(r.name) + '</th>'; }).join('') + '<th class="c">계</th></tr>' +
        list.map(function(x, i){
          var mine2 = doneRows.filter(function(z){ return z.teamId === x.id; });
          var sum = 0;
          return '<tr><td class="c">' + (i + 1) + '</td><td class="nw">' + esc(x.classId + '-' + x.no + ' 「' + x.name + '」') + '</td>' +
            rbI.map(function(r){
              var pp = mine2.filter(function(z){ return z.rubricId === r.id; })[0];
              if(pp) sum += pp.score;
              return '<td class="c">' + (pp ? pp.score : '-') + '</td>';
            }).join('') + '<td class="c"><b>' + sum + '</b></td></tr>';
        }).join('') + '</table></div>';
    }else{
      /* 🔴 12팀을 한 화면에 늘어놓지 않습니다 — 한 팀씩. 아직 안 낸 팀 우선, 없으면 수정 가능한 팀부터 */
      var idx = evalCursor[n];
      if(idx === undefined || idx < 0 || idx >= list.length){
        idx = -1;
        for(var q = 0; q < list.length; q++) if(stT[list[q].id] < 0){ idx = q; break; }
        if(idx < 0) for(var q2 = 0; q2 < list.length; q2++) if(stT[list[q2].id] === 0){ idx = q2; break; }
        if(idx < 0) idx = 0;
        evalCursor[n] = idx;
      }
      var cx = list[idx];
      var cxState = stT[cx.id];

      h += '<div class="btnrow" style="margin-bottom:6px">' +
        '<span class="bg ' + (cnt ? 'green' : 'gray') + '">제출 ' + cnt + '/' + list.length + '팀</span>' +
        '<span class="bg gray">남은 ' + (list.length - cnt) + '팀</span></div>' +
        '<p class="muted">한 팀씩 평가합니다. <b>제출한 뒤에도 딱 1회까지는 다시 고칠 수 있습니다.</b> 쓰던 것은 자동으로 남습니다.</p>' +
        /* 순서 목록 — 아무 팀이나 눌러 바로 이동 (✅ 제출 · 🔒 수정까지 끝) */
        '<div class="btnrow" style="margin-bottom:8px">' + list.map(function(x, i){
          var mk = stT[x.id]===1 ? ' 🔒' : (stT[x.id]===0 ? ' ✅' : '');
          return '<button class="btn sm' + (i === idx ? ' pri' : '') + '" onclick="evalGo(' + n + ',' + i + ')">' +
            (i + 1) + mk + '</button>';
        }).join('') + '</div>';

      if(cxState === 1){
        h += '<div class="note g">🔒 <b>' + esc(cx.classId + '-' + cx.no + ' 「' + cx.name + '」') + '</b>은 제출 후 1회 수정까지 마쳐 <b>더는 고칠 수 없습니다.</b></div>';
      }else{
        if(cxState === 0) seedDraftFrom(cx.id, doneRows.filter(function(z){ return z.teamId === cx.id; }));
        h += '<div class="acc" style="padding:12px">' +
          '<div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap">' +
          '<b style="font-size:17px">' + (idx + 1) + '번 ' + esc(cx.classId + '-' + cx.no + ' 「' + cx.name + '」') + '</b>' +
          (presJoint(n) ? '<span class="muted">' + esc(classProf(cx.classId)) + ' 교수</span>' : '') +
          (cxState === 0 ? '<span class="bg amber">제출됨 · 1회 수정 가능</span>' : '') + '</div>' +
          rbI.map(function(r){
            var cur = (evalDraft[cx.id] || {})[r.id];
            return rbPick(r, cur, "setEval(&#39;" + cx.id + "&#39;,&#39;" + r.id + "&#39;,__V__)");
          }).join('') +
          '<label class="f">' + esc(D.ask || '잘한 점 / 개선점') + ' <span class="req">*</span> <span class="lim">20자 이상</span></label>' +
          '<textarea id="et_' + cx.id + '" placeholder="' + esc(D.askHint || '') + '" oninput="evalTouch(&#39;' + cx.id + '&#39;)">' +
          esc((evalDraft[cx.id] || {})._t || '') + '</textarea>' +
          '<div class="btnrow" style="margin-top:8px">' +
          '<button class="btn pri full" onclick="submitInter(&#39;' + cx.id + '&#39;,' + def.round + ',' + n + ')">' +
          (cxState === 0 ? '수정 제출 (마지막 1회)' : '이 팀 평가 제출') + '</button></div>' +
          '<div class="muted">' + (cxState === 0
            ? '이번 수정 제출 <b>이후에는 더 고칠 수 없습니다.</b>'
            : '제출한 뒤에도 <b>1회까지</b> 다시 고칠 수 있습니다.') + '</div></div>';
      }

      h += '<div class="pager" style="margin-top:10px">' +
        '<button class="btn" ' + (idx <= 0 ? 'disabled' : '') + ' onclick="evalGo(' + n + ',' + (idx - 1) + ')">← 이전 팀</button>' +
        '<span style="align-self:center;text-align:center;flex:1" class="muted">' + (idx + 1) + ' / ' + list.length + '</span>' +
        '<button class="btn" ' + (idx >= list.length - 1 ? 'disabled' : '') + ' onclick="evalGo(' + n + ',' + (idx + 1) + ')">다음 팀 →</button></div>';
    }

    h += '<div class="note">🔒 여러분이 매긴 개별 점수는 <b>담당교수님만</b> 봅니다. 다른 학생에게는 어떤 형태로도 공개되지 않으며, <b>누가 평가했는지는 교수님께도 보이지 않습니다.</b></div></div>';
  }

  /* ── [3] 동료평가 — 팀내 (발표 순서와 무관한 별도 구역) ────────────── */
  var wantIntra = !def.joint || def.intra;
  if(wantIntra){
    var rbM = DB.get('rubrics', function(r){ return r.round === def.round && r.kind === 'intra'; })
      .sort(function(a, b){ return a.order - b.order; });
    var mates = teamMembers(t.id).filter(function(m){ return m.st.id !== me.id; });   /* ★ 나 제외 */
    var doneM = DB.get('peerMember', function(p){ return p.round === def.round && p.evaluator === me.id; });
    var stM = {}; mates.forEach(function(m){ stM[m.st.id] = intraState(def.round, m.st.id); });   /* -1/0/1 */
    var subM = mates.filter(function(m){ return stM[m.st.id] >= 0; }).length;
    h += '<div class="card"><h3>[3] 동료평가 — 팀내 <span class="muted">(나 제외 · 우리 팀원 ' + mates.length + '명)</span></h3>' +
      '<div class="btnrow" style="margin-bottom:6px"><span class="bg ' + (subM === mates.length && mates.length ? 'green' : 'gray') + '">' +
      '제출 ' + subM + '/' + mates.length + '</span></div>' +
      '<p class="muted">제출한 뒤에도 <b>딱 1회까지는</b> 다시 고칠 수 있습니다.</p>';
    mates.forEach(function(m, i){
      if(stM[m.st.id] === 1){
        h += '<div class="acc"><div class="hd"><span>▸ ' + esc(sn(m.st)) + '</span><span class="sp"></span><span class="bg green">🔒 제출·수정 완료</span></div></div>';
        return;
      }
      var editable = stM[m.st.id] === 0;
      if(editable) seedDraftFrom(m.st.id, doneM.filter(function(z){ return z.studentId === m.st.id; }));
      var body = (editable ? '<div class="note b">이미 제출했습니다 — 이번 <b>1회까지</b> 수정할 수 있습니다.</div>' : '') +
        rbM.map(function(r){
          var cur = (evalDraft[m.st.id] || {})[r.id];
          return rbPick(r, cur, "setEval(&#39;" + m.st.id + "&#39;,&#39;" + r.id + "&#39;,__V__)");
        }).join('') +
        '<label class="f">한 줄 의견 <span class="req">*</span> <span class="lim">20자 이상</span></label>' +
        '<textarea id="et_' + m.st.id + '" oninput="evalTouch(&#39;' + m.st.id + '&#39;)">' + esc((evalDraft[m.st.id] || {})._t || '') + '</textarea>' +
        '<div class="btnrow" style="margin-top:8px"><button class="btn pri" onclick="submitIntra(&#39;' + m.st.id + '&#39;,' + def.round + ')">' +
        (editable ? '수정 제출 (마지막 1회)' : '이 팀원 평가 제출') + '</button></div>' +
        '<div class="muted">' + (editable ? '이번 수정 제출 <b>이후에는 더 고칠 수 없습니다.</b>' : '제출한 뒤에도 1회까지 고칠 수 있습니다.') + '</div>';
      h += acc('▸ ' + esc(sn(m.st)) + (editable ? ' <span class="bg amber">제출됨 · 1회 수정 가능</span>' : ''), i === 0, body, {open:'평가하기', close:'접기'});
    });
    h += '</div>';
  }
  return h;
}

function evalGo(n, i){ evalCursor[n] = i; window.scrollTo(0, 0); render(); }
function evalTouch(target){
  if(!evalDraft[target]) evalDraft[target] = {};
  var ta = $('et_' + target); if(ta) evalDraft[target]._t = ta.value;
  evalDraftSave();
}

function setEval(target, rubricId, v){
  if(!evalDraft[target]) evalDraft[target]={};
  var ta=$('et_'+target); if(ta) evalDraft[target]._t = ta.value;
  evalDraft[target][rubricId]=v;
  if(!evalStart) evalStart = Date.now();
  evalDraftSave();
  render();
}
function collect(target, kind, round){
  var rb = DB.get('rubrics', function(r){return r.round===round && r.kind===kind;});
  var d = evalDraft[target]||{};
  var ta=$('et_'+target); var txt = ta? ta.value.trim() : (d._t||'');
  for(var i=0;i<rb.length;i++) if(!d[rb[i].id]){ toast('「'+rb[i].name+'」 점수를 골라 주세요.'); return null; }
  if(txt.replace(/\s/g,'').length < 20){ toast('서술은 20자 이상 적어 주세요. (성의 없는 제출을 막기 위한 규칙입니다)'); return null; }
  var vals = rb.map(function(r){return d[r.id];});
  var same = vals.every(function(v){return v===vals[0];});
  return {rb:rb, d:d, txt:txt, same:same, secs: evalStart? Math.round((Date.now()-evalStart)/1000) : 30};
}
function submitInter(teamId, round, n){
  var c = collect(teamId,'inter',round); if(!c) return;
  /* 이미 낸 것이 있으면 = 수정 제출. editCount 0 → 1(잠금). 이미 1이면 거부. */
  var old = DB.get('peerTeam', function(p){ return p.round===round && p.evaluator===SESS.me.id && p.teamId===teamId; });
  if(old.length && (old[0].editCount||0) >= 1){ toast('⛔ 제출 후 1회 수정까지 마쳐 더는 고칠 수 없습니다.'); return; }
  var ec = old.length ? (old[0].editCount||0)+1 : 0;
  var doIt=function(){
    old.forEach(function(o){ DB.del('peerTeam', o.id); });      /* 옛 점수 덮어쓰기 */
    c.rb.forEach(function(r){
      DB.add('peerTeam',{round:round,evaluator:SESS.me.id,teamId:teamId,rubricId:r.id,
        score:c.d[r.id],text:c.txt,at:nowStr(),secs:c.secs,editCount:ec});
    });
    delete evalDraft[teamId]; evalStart=null; evalDraftSave();
    /* 🔴 첫 제출이면 「아직 안 낸 다음 팀」으로 저절로 넘어갑니다 — 12팀을 도는 부담을 줄입니다 */
    if(n && ec===0){
      var def2=wdef(n), lst=evalTargets(def2), got={};
      DB.get('peerTeam', function(p){return p.round===round && p.evaluator===SESS.me.id;})
        .forEach(function(p){ got[p.teamId]=1; });
      for(var k=0;k<lst.length;k++) if(!got[lst[k].id]){ evalCursor[n]=k; break; }
      window.scrollTo(0,0);
    }
    toast(ec>=1 ? '수정했습니다. 이제 더는 고칠 수 없습니다.' : '제출했습니다. 1회까지 수정할 수 있습니다.'); render();
  };
  if(c.same) APP.confirm('전 항목에 같은 점수를 주셨습니다.\n정말 이대로 제출할까요?', doIt); else doIt();
}
function submitIntra(studentId, round){
  var c = collect(studentId,'intra',round); if(!c) return;
  var old = DB.get('peerMember', function(p){ return p.round===round && p.evaluator===SESS.me.id && p.studentId===studentId; });
  if(old.length && (old[0].editCount||0) >= 1){ toast('⛔ 제출 후 1회 수정까지 마쳐 더는 고칠 수 없습니다.'); return; }
  var ec = old.length ? (old[0].editCount||0)+1 : 0;
  var doIt=function(){
    old.forEach(function(o){ DB.del('peerMember', o.id); });
    c.rb.forEach(function(r){
      DB.add('peerMember',{round:round,evaluator:SESS.me.id,studentId:studentId,rubricId:r.id,
        score:c.d[r.id],text:c.txt,at:nowStr(),secs:c.secs,editCount:ec});
    });
    delete evalDraft[studentId]; evalStart=null; evalDraftSave();
    toast(ec>=1 ? '수정했습니다. 이제 더는 고칠 수 없습니다.' : '제출했습니다. 1회까지 수정할 수 있습니다.'); render();
  };

}

function saveNotice(cid,n){

function saveComment(tid){

function saveTutor(teamId, round){
  /* 🔴 팀 하나만 저장합니다 — 다른 팀 칸은 건드리지 않습니다 (2026-08-20 10차) */
  var t=team(teamId);
  if(!canEdit(t.classId)){ toast(t.classId===myClass()? '[내 강좌] 보기로 바꾸신 뒤 쓰실 수 있습니다.' : '다른 강좌는 쓸 수 없습니다.'); return; }
  var d=tuRead(teamId);
  if(!d.date || !d.talk || !d.next){ toast('일자 · 튜터링 내용 · 다음까지 할 일은 필수입니다. (쓰던 것은 임시 저장되어 있습니다)'); tuAuto(teamId, round); return; }
  var ex=tuRow(teamId, round);
  var patch={date:d.date, talk:d.talk, fix:d.fix, next:d.next, done:true, at:nowStr()};
  if(ex){
    var was = ex.done!==false;
    DB.set('tutoring', ex.id, patch);
    DB.log(was? '튜터링 기록 수정':'튜터링 기록 작성', round+'회차 · '+t.classId+'-'+t.no+' '+t.name);
    toast(was? '수정해 저장했습니다.' : '저장했습니다. 이제 학생에게 보입니다.');
  }else{
    patch.teamId=teamId; patch.round=round; patch.nextdate='';
    DB.add('tutoring', patch);
    DB.log('튜터링 기록 작성', round+'회차 · '+t.classId+'-'+t.no+' '+t.name);
    toast('저장했습니다. 이제 학생에게 보입니다.');
  }
  tuOpen[teamId]=false;              /* 쓴 팀은 접어 다음 팀으로 */
  render();
}

function teamWorkPeek(teamId, n){
  var h='';
  if(n===3){
    /* 🔴 8차 — 튜터링을 쓰면서 그 팀이 낸 조사 자료를 「같은 자리에서 끝까지」 읽습니다.
       요약만 보여 주면 결국 다른 화면을 열게 되어 창을 왔다 갔다 하게 됩니다. */
    var tps=teamTopics(teamId);
    if(!tps.length) return '<div class="note a" style="margin-top:8px">이 팀은 아직 <b>2주차 가주제</b>를 정하지 않았습니다.</div>';
    var c=subCount(teamId);
    h = '<b>이 팀이 낸 조사 자료 '+c.done+'/'+c.need+'</b>'+
      '<div style="max-height:230px;overflow-y:auto;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px">'+
      tps.map(function(tp,i){
        var s=subRow(teamId, tp.id);
        return '<div style="margin:0 0 8px"><b>가주제 '+CIRC[i]+' '+esc(tp.title)+'</b> '+
          (s&&s.done? '<span class="bg green">✅</span>' : (subHasText(s)? '<span class="bg amber">💾 임시</span>':'<span class="bg gray">⬛ 미제출</span>'))+
          (s&&subHasText(s)
            ? '<div style="font-size:13px;margin-top:3px"><b>배경</b> '+esc(s.back||'-')+
              '<br><b>필요성</b> '+esc(s.need||'-')+'<br><b>조사 방법</b> '+esc(s.how||'-')+
              (s.refs? '<br><b>참고</b> '+esc(s.refs):'')+'</div>'
            : '<div class="muted" style="font-size:13px">아직 낸 것이 없습니다.</div>')+'</div>';
      }).join('')+'</div>';
  }else if(n===5){
    var f=DB.one('topics', function(x){return x.teamId===teamId&&x.kind==='최종';});
    h = f? '<b>최종 주제</b> '+esc(f.title)+'<br><span class="muted">'+esc((f.summary||'').slice(0,110))+'</span>'
         : '<span class="muted">아직 최종 주제를 내지 않았습니다.</span>';
  }else{
    var a=DB.one('activity', function(x){return x.teamId===teamId&&x.week===n;});
    h = a? '<b>이 팀이 낸 것</b><br><span class="muted">'+esc(((a.did||a.plan||'')+' '+(a.stage||'')).slice(0,120))+'</span>'
         : '<span class="muted">이 주차에 아직 낸 것이 없습니다.</span>';
  }
  return '<div class="note b" style="margin-top:8px">'+h+'</div>';
}

   --------------------------------------------------------------------------

     · 13·14주차 — 🔴 **교수 3명 모두가 그 주 발표하는 12팀 전부**를 평가합니다
                    (교수님 확정: "13-14주차에 교수평가는 3명이 다 같이해")
                    → 기존 「수정은 자기 강좌만」 규칙의 **예외**입니다.

/* 🔴 이 주차에 이 팀을 채점할 수 있는가 — 예외는 여기 한 곳에서만 정합니다 */
function evalCanScore(n, classId){
  if(!isProf()) return false;
  if(presJoint(n)) return true;          /* 13·14주차 예외 — 다른 강좌 팀도 채점 */
  return canEdit(classId);               /* 4·7주차 — 자기 강좌만 */
}

/* 한 교수가 한 팀에 매긴 점수 */
function peRows(round, teamId, profId){
  return DB.get('profEval', function(x){ return x.round===round && x.teamId===teamId && x.profId===profId; });
}
function peSum(round, teamId, profId){
  var rs = peRows(round, teamId, profId);
  return rs.length ? rs.reduce(function(a,b){ return a+b.score; }, 0) : null;
}
/* 그 팀을 평가한 교수들 — 13·14주차는 3명이 다 넣어야 완성입니다 */
function peProfs(round, teamId){
  var m = {}; DB.get('profEval', function(x){ return x.round===round && x.teamId===teamId; })
    .forEach(function(x){ m[x.profId] = 1; });
  return Object.keys(m);
}

  h += '<div class="card"><h3>'+esc(D.title || (n+'주차 발표'))+' <span class="muted">'+n+'주차</span></h3>'+
    '<div class="note"><b>진행</b> '+esc(D.run||'')+(D.note? '<br>'+esc(D.note):'') + (D.extra ? '<br>'+esc(D.extra) : '')+'</div>'+
    '<p class="muted">⛔ 학생이 앱에 <b>파일을 내지 않습니다</b> — 발표자료는 따로 받으십니다. '+
    '이 화면에서 하실 일은 <b>발표 순서 배정</b>과 <b>교수평가 입력</b>입니다.</p></div>';

  /* ② 발표 순서 배정 (pE_present.js) */
  h += presPanel(n);

  /* ③ 교수평가 입력 — 발표 순서대로 */
  h += profScorePanel(n, def);

  /* ④ 동료평가 감독판 */
  h += profPeerWatch(n, def, cids);
  return h;
}

/* ---- ③ 교수평가 입력 --------------------------------------------------- */
var peOpen = {};                    /* 펼친 팀 */
function profScorePanel(n, def){
  var rb = DB.get('rubrics', function(r){ return r.round===def.round && r.kind==='prof'; })
    .sort(function(a,b){ return a.order-b.order; });
  var full = rbFull(def.round, 'prof');
  var order = presList(n, presJoint(n)? null : myClass());
  var me = SESS.acc.id;
  var mine = order.filter(function(x){ return peSum(def.round, x.team.id, me)!==null; }).length;

  var h = '<div class="card"><h3>교수평가 입력 <span class="muted">— '+def.round+'회차 · 발표 순서대로</span></h3>';

  if(!order.length)
    return h + '<div class="note r">발표 순서를 먼저 정해 주십시오. 순서가 정해져야 평가서가 이 순서대로 놓입니다.</div></div>';

  h += '<div class="btnrow" style="margin-bottom:6px">'+
    '<span class="bg '+(mine===order.length?'green':'gray')+'">평가 '+mine+'/'+order.length+'팀</span>'+
    '<span class="bg gray">항목 '+rb.length+'개 · 만점 '+full+'점</span></div>';

  /* 🔴 13·14주차 — 세 분이 각각 얼마나 하셨는지 (발표 당일 마무리에 필요합니다) */
  if(presJoint(n)){
    h += '<div class="muted" style="margin-bottom:6px">'+ PROFS.map(function(p){
      var c = order.filter(function(x){ return peSum(def.round, x.team.id, p.id)!==null; }).length;
      return esc(p.name)+' '+c+'/'+order.length;
    }).join(' · ')+'</div>'+
    '<div class="note">🔴 <b>교수 3명이 모두 '+order.length+'팀 전부</b>를 평가합니다. 자기 강좌 팀도 포함합니다. '+
    '팀 점수는 <b>세 분의 평균</b>이 됩니다(가중치 없음).</div>';
  }

  h += '<p class="muted">팀마다 [평가 입력]을 눌러 그 자리에서 채점하십시오. <b>팀별로 따로 저장</b>됩니다.</p>';

  order.forEach(function(x, i){
    var t = x.team, ed = evalCanScore(n, t.classId);
    var got = rb.map(function(r){
      var e = DB.one('profEval', function(z){ return z.round===def.round && z.teamId===t.id && z.rubricId===r.id && z.profId===me; });
      return e ? e.score : null;
    });
    var sum = got.reduce(function(a,b){ return a+(b||0); }, 0);
    var has = got.some(function(v){ return v!==null; });
    var open = !!peOpen[t.id];

    var head = '<div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;cursor:pointer" '+
      'onclick="peToggle(&#39;'+t.id+'&#39;)">'+
      '<b>'+(i+1)+'번 '+esc(t.classId+'-'+t.no+' 「'+t.name+'」')+'</b>'+
      (has? '<span class="bg green">✅ '+sum+'/'+full+'점</span>' : '<span class="bg gray">⬜ 아직</span>')+
      (presJoint(n)? '<span class="muted">'+esc(classProf(t.classId))+' 교수</span>':'')+
      '<span style="flex:1"></span><span class="muted">'+(open?'▲ 접기':'▼ 펼치기')+'</span></div>';

    /* 🔴 13·14주차 — 세 분의 점수를 나란히 (교수끼리는 보입니다 · 학생에게는 안 보입니다) */
    var three = '';
    if(presJoint(n)){
      var vals = PROFS.map(function(p){ return {name:p.name, v:peSum(def.round, t.id, p.id)}; });
      var got3 = vals.filter(function(v){ return v.v!==null; });
      var avg = got3.length ? (got3.reduce(function(a,b){ return a+b.v; }, 0)/got3.length) : null;
      three = '<div class="muted" style="margin-top:3px">'+
        vals.map(function(v){ return esc(v.name)+' '+(v.v===null? '-' : v.v); }).join(' · ')+
        ' · <b>평균 '+(avg===null? '-' : (Math.round(avg*10)/10))+'</b>'+
        ' <span class="bg '+(got3.length===3?'green':'gray')+'">'+got3.length+'/3명 평가 완료</span></div>';
    }

    if(!open){
      h += '<div class="tucard">'+head+three+
        '<div class="btnrow" style="margin-top:7px">'+
        (ed? '<button class="btn'+(has?'':' pri')+'" onclick="peWrite(&#39;'+t.id+'&#39;)">'+(has?'평가 수정':'평가 입력')+'</button>'
           : '<button class="btn" onclick="peToggle(&#39;'+t.id+'&#39;)">점수 보기</button>')+
        '</div></div>';
      return;
    }

    h += '<div class="tucard">'+head+three;
    if(ed){
      h += rb.map(function(r, k){
        return rbPick(r, got[k], "peSet(&#39;"+t.id+"&#39;,&#39;"+r.id+"&#39;,__V__)");
      }).join('')+
      '<label class="f">한 줄 총평 <span class="lim">선택 · 200자</span></label>'+
      '<textarea id="pe_t_'+t.id+'" maxlength="200">'+esc(peNote(def.round, t.id, me))+'</textarea>'+
      '<div class="btnrow" style="margin-top:8px">'+
        '<button class="btn pri" onclick="saveProfEval(&#39;'+t.id+'&#39;,'+def.round+','+n+')">저장</button></div>';
    }else{
      h += '<div class="scroll"><table><tr><th>항목</th><th class="c">점수</th></tr>'+
        rb.map(function(r,k){ return '<tr><td>'+esc(r.name)+'</td><td class="c">'+(got[k]==null?'-':got[k])+'</td></tr>'; }).join('')+
        '</table></div><div class="note">'+roLabel(t.classId)+'</div>';
    }
    h += '</div>';
  });

  return h + '</div>';
}
function peNote(round, teamId, profId){
  var r = peRows(round, teamId, profId)[0];
  return r && r.text ? r.text : '';
}
function peToggle(tid){ peOpen[tid] = !peOpen[tid]; render(); }
function peWrite(tid){
  peOpen[tid] = true; render();
  setTimeout(function(){ var el=$('pe_t_'+tid); if(el){ try{ el.scrollIntoView({block:'center'}); }catch(e){} } }, 0);
}
var peDraft = {};
function peSet(teamId, rubricId, v){
  if(!peDraft[teamId]) peDraft[teamId] = {};
  peDraft[teamId][rubricId] = v;
  /* 바로 저장합니다 — 발표 현장에서 [저장]을 놓쳐 점수가 날아가면 다시 못 봅니다 */
  var t = team(teamId);
  var round = null;
  var rb = DB.one('rubrics', rubricId); if(rb) round = rb.round;
  if(round!==null){
    var ex = DB.one('profEval', function(x){ return x.round===round && x.teamId===teamId && x.rubricId===rubricId && x.profId===SESS.acc.id; });
    if(ex) DB.set('profEval', ex.id, {score:v});
    else DB.add('profEval', {round:round, teamId:teamId, profId:SESS.acc.id, rubricId:rubricId, score:v, text:'', fixed:false, at:nowStr()});
  }
  render();
}

function saveProfEval(teamId, round, n){
  var t = team(teamId);
  if(!evalCanScore(n, t.classId)){
    toast(presJoint(n)? '평가 권한이 없습니다.' : (t.classId===myClass()? '[내 강좌] 보기로 바꾸신 뒤 입력해 주세요.' : '4·7주차는 자기 강좌만 채점할 수 있습니다.'));
    return;
  }
  var rb = DB.get('rubrics', function(r){ return r.round===round && r.kind==='prof'; });
  var miss = [];
  var note = $('pe_t_'+teamId) ? $('pe_t_'+teamId).value.trim() : '';
  rb.forEach(function(r){
    var ex = DB.one('profEval', function(x){ return x.round===round && x.teamId===teamId && x.rubricId===r.id && x.profId===SESS.acc.id; });
    if(!ex){ miss.push(r.name); return; }
    DB.set('profEval', ex.id, {text:note, at:nowStr()});
  });
  if(miss.length){ toast('⛔ 「'+miss[0]+'」 수준을 골라 주세요.'); return; }
  DB.log('교수평가 저장', t.classId+'-'+t.no+' '+round+'회차 · '+SESS.acc.name);
  peOpen[teamId] = false;
  toast('저장했습니다.'); render();
}

/* ---- ④ 동료평가 감독판 ------------------------------------------------- */
function profPeerWatch(n, def, cids){
  var watch = presJoint(n) ? CIDS.slice() : cids;      /* 합동 주차는 3개 강좌 전부 */
  var ss = DB.get('students', function(s){ return watch.indexOf(s.classId)>=0 && s.active!==false; });
  function interDone(s){
    if(!s.teamId) return null;
    var need = evalTargets(def, s).length;
    var got = {};
    DB.get('peerTeam', function(p){ return p.round===def.round && p.evaluator===s.id; }).forEach(function(p){ got[p.teamId]=1; });
    return {need:need, got:Object.keys(got).length};
  }
  function intraDone(s){
    if(!s.teamId) return null;
    var need = teamMembers(s.teamId).filter(function(m){ return m.st.id!==s.id; }).length;
    var got = {};
    DB.get('peerMember', function(p){ return p.round===def.round && p.evaluator===s.id; }).forEach(function(p){ got[p.studentId]=1; });
    return {need:need, got:Object.keys(got).length};
  }
  var subI = ss.filter(function(s){ var d=interDone(s); return d && d.need>0 && d.got>=d.need; });
  var subM = ss.filter(function(s){ var d=intraDone(s); return d && d.need>0 && d.got>=d.need; });
  var noI  = ss.filter(function(s){ return subI.indexOf(s)<0; });

  var h = '<div class="card"><h3>동료평가 제출 현황 <span class="muted">('+def.round+'회차)</span></h3>'+
    '<div class="btnrow"><span class="bg '+(subI.length===ss.length&&ss.length?'green':'gray')+'">팀간 '+subI.length+'/'+ss.length+'</span>'+
    '<span class="bg '+(subM.length===ss.length&&ss.length?'green':'gray')+'">팀내 '+subM.length+'/'+ss.length+'</span></div>'+
    '<div class="note">🔒 여기서 보이는 것은 <b>「누가 안 냈나」</b>뿐입니다. <b>「누가 누구에게 몇 점을 줬나」는 교수님께도 익명</b>입니다.</div>'+
    '<b>미제출자 명단</b>'+
    (noI.length? '<p>'+noI.map(function(s){ var d=interDone(s);
        return esc(sn(s))+' <span class="muted">('+esc(classProf(s.classId))+')</span>'+
          (d && d.got>0? ' <span class="bg gray">부분 제출 '+d.got+'/'+d.need+'</span>':' <span class="bg red">미제출</span>');
      }).join('<br>')+'</p>'+
      '<button class="btn sm" onclick="copyList(&#39;'+noI.map(function(s){return s.name+' '+s.no;}).join(', ')+'&#39;)">명단 복사</button>'
      : '<p class="muted">전원 제출했습니다.</p>');

  /* 성의 없는 제출 */
  var lazy=[];
  ss.forEach(function(s){
    var rows=DB.get('peerTeam', function(p){ return p.round===def.round && p.evaluator===s.id; });
    if(!rows.length) return;
    var byTeam={}; rows.forEach(function(r){ (byTeam[r.teamId]=byTeam[r.teamId]||[]).push(r); });
    var allSame=true, minSec=9999;
    Object.keys(byTeam).forEach(function(k){
      var v=byTeam[k].map(function(r){ return r.score; });
      if(!v.every(function(x){ return x===v[0]; })) allSame=false;
      byTeam[k].forEach(function(r){ if(r.secs<minSec) minSec=r.secs; });
    });
    if(allSame || minSec<30) lazy.push(sn(s)+' — '+(allSame?'전 항목 동일 점수':'')+(minSec<30?' 소요 '+minSec+'초':''));
  });
  h += '<div class="hr"></div><b>⚠️ 성의 없는 제출 표시</b>'+
    (lazy.length? '<p class="muted">'+lazy.map(esc).join('<br>')+'</p>' : '<p class="muted">해당 없음</p>')+'</div>';
  return h;
}

function copyList(s){
  try{ navigator.clipboard.writeText(s); toast('명단을 복사했습니다.'); }
  catch(e){ toast('복사가 안 되면 직접 긁어 주세요: '+s.slice(0,40)+'…'); }
}

/* ==========================================================================
   📥 3주차 교수 화면 — 제출 격자 + 제출물 열람 (2026-08-20 · 8차)
   --------------------------------------------------------------------------
   3주차는 「튜터링 1회차」와 같은 주입니다. 그래서 이 판은 세 가지가 한 화면에
   차례로 놓입니다: ① 어느 팀의 몇 번째가 비었나(격자) ② 무엇을 냈나(열람)

/* 5주차 — 최종 주제 승인 */
function profTopicApprove(cids){
  var h='<div class="card"><h3>최종 주제 승인</h3>';
  var teams=DB.get('teams', function(t){return cids.indexOf(t.classId)>=0;});
  var ok=0, wait=0, none=0;
  var rows = teams.map(function(t){
    var fin=DB.one('topics', function(x){return x.teamId===t.id&&x.kind==='최종';});
    if(!fin) none++; else if(fin.ok) ok++; else wait++;
    /* 🔴 R12 — 승인 뒤 학생이 수정하면 「✏️ 승인 후 수정됨」 배지로 눈에 띄게 알립니다(교수 재확인용) */
    var afterOk = !!(fin && fin.ok && fin.editedAfterOk);
    return '<tr><td class="nw">'+esc(t.classId+'-'+t.no+' '+t.name)+'</td><td>'+(fin?esc(fin.title)+
        (fin.edited && !fin.ok? ' <span class="bg amber">✏️ 수정됨</span>'+(fin.editedAt? ' <span class="muted">'+esc(fin.editedAt)+'</span>':''):'')+
        (afterOk? ' <span class="bg red">✏️ 승인 후 수정됨</span>'+(fin.okEditAt? ' <span class="muted">'+esc(fin.okEditAt)+'</span>':''):'')
        :'<span class="muted">미제출</span>')+'</td>'+
      '<td class="c">'+(fin? (fin.ok?'<span class="bg green">승인</span>':'<span class="bg amber">대기</span>') : '-')+'</td>'+
      '<td class="c">'+(fin && canEdit(t.classId)?
        ((!fin.ok || afterOk)? '<button class="btn sm ok" onclick="approveTopic(\''+fin.id+'\',1)">'+(afterOk?'재확인':'승인')+'</button> ':'')+
        (!fin.ok? '<button class="btn sm" onclick="approveTopic(\''+fin.id+'\',0)">보완</button>':'') : '')+'</td></tr>';
  }).join('');
  h += '<p class="muted">승인 '+ok+' · 대기 '+wait+' · 미제출 '+none+'</p>'+
    '<div class="scroll"><table><tr><th>팀</th><th>최종 주제</th><th class="c">상태</th><th class="c"></th></tr>'+rows+'</table></div></div>';
  return h;
}
function approveTopic(id, ok){
  /* 🔴 R12 — 재확인(승인)하면 「승인 후 수정됨」 배지를 지웁니다. 보완 요청이면 ok=false 로 되돌립니다. */
  var patch = ok? {ok:true, okAt:nowStr(), editedAfterOk:false} : {ok:false, okAt:nowStr()};
  DB.set('topics', id, patch);
  DB.log(ok?'최종 주제 승인':'최종 주제 보완 요청', id); toast(ok?'승인했습니다.':'보완을 요청했습니다.'); render();
}

/* 🚌 11주차 — 팀별 견학 의견 모아 보기 (2026-08-23 신설)
   학생들이 stExcursion 에서 남긴 의견을 교수님이 팀별로 접어서 봅니다. 읽기 전용입니다. */
function profExcursionPanel(cids){
  var teams=DB.get('teams', function(t){return cids.indexOf(t.classId)>=0;})
    .sort(function(a,b){ return a.classId===b.classId? a.no-b.no : (a.classId<b.classId?-1:1); });
  var all=DB.get('excursion', function(x){return true;});
  var wrote=0; teams.forEach(function(t){ if(DB.one('excursion', function(x){return x.teamId===t.id;})) wrote++; });
  var h='<div class="card"><h3>팀별 견학 의견 <span class="muted">— 총 '+all.length+'개 · '+wrote+'/'+teams.length+' 팀 참여</span></h3>';
  if(!teams.length) h += '<p class="muted">아직 만들어진 팀이 없습니다.</p>';
  teams.forEach(function(t){
    var list=DB.get('excursion', function(x){return x.teamId===t.id;})
              .sort(function(a,b){return (b.at||'')<(a.at||'')?-1:1;});
    h += acc('▸ '+esc(t.classId+'-'+t.no+' 「'+t.name+'」  ('+classProf(t.classId)+' 교수) · '+list.length+'개'), false,
      (list.length? list.map(function(x){
        return '<div class="note" style="margin-top:6px"><b>'+esc(x.author||'-')+'</b> <span class="muted">'+esc(x.at||'')+'</span><br>'+
          esc(x.text).replace(/\n/g,'<br>')+'</div>';
      }).join('') : '<p class="muted">아직 남긴 의견이 없습니다.</p>'));
  });
  return h+'</div>';
}

/* 6·9·10·12주차 — 활동 현황 */
function profActivityPanel(n, cids){
  var teams=DB.get('teams', function(t){return cids.indexOf(t.classId)>=0;});
  var help=[];
  teams.forEach(function(t){ var a=DB.one('activity', function(x){return x.teamId===t.id&&x.week===n;});
