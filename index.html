<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바이오기초설계</title>
<style>
:root{
  /* ======================================================================
     🎨 색 — 교수님이 정해 주신 네 가지만 씁니다 (2026-08-21 · 15차)
        "검정, 빨강, 파랑, 초록 정도의 색감을 사용하는게 어떨까"
     ----------------------------------------------------------------------
       검정·회색 : 글자 · 선 · 구조            (화면의 90%)
       🔵 파랑  : 「누르는 것」에만 — 버튼·링크·선택된 상태
                 ⛔ 안내문·제목·장식에 절대 쓰지 않습니다
       🔴 빨강  : 위험·경고 — 아껴 씁니다
       🟢 초록  : 완료 — 작게. 완료는 조용해도 됩니다
     ⛔ 주황·노랑·보라·하늘·민트는 전부 걷어냈습니다.
        옛 이름(--amber·--purple)은 호출부가 많아 남겨 두되 「회색」을 가리킵니다.
     🔴 색만으로 구분하지 않습니다 — 상태에는 반드시 글자와 모양(✅⬛⚠️)을 함께 둡니다.
        (빨강·초록을 구별하지 못하는 학생이 75명 중 두세 명 있다고 보는 것이 맞습니다)

     📄 바탕은 「밝은 쪽」으로 확정했습니다 — 어두운 모드는 만들지 않습니다.
        ① 밝은 강의실에서 씁니다(수요일 10~13시 창가 폰)
        ② 읽고 쓰는 앱이라 어두운 바탕의 밝은 글자는 번져 보입니다
        ③ A4 인쇄물이 있어 흰 종이와 결이 같아야 합니다
        ④ 어두운 바탕에서는 빨강과 초록이 서로 가까워집니다
     ⛔ 순백(#fff)·순검정(#000)은 쓰지 않습니다 — 대비가 지나쳐 눈이 아픕니다.
     ====================================================================== */
  --bg:#f2f4f7;        /* 페이지 바탕 — 아주 옅은 회색 (순백 아님) */
  --card:#ffffff;      /* 카드·입력칸 바탕만 흰색 — 페이지와 살짝 구분 */
  --line:#ccd3db;      /* 테두리 */
  --soft:#e9edf2;      /* 옅은 채움 (표 머리·막대 바탕) */
  --ink:#15191e;       /* 본문 글자 — 거의 검정 (순검정 아님) */
  --dim:#4d5661;       /* 보조 설명 — 🔴 흐리지 않게 대비를 지킵니다 */
  --blue:#0f4c9e;   --blue-w:#e6eefa;    /* 🔵 누르는 것 */
  --red:#b41f1f;    --red-w:#fbe9e9;     /* 🔴 위험·경고 */
  --green:#0f6b32;  --green-w:#e4f2e9;   /* 🟢 완료 */
  --gray-w:#eceff3;
  --amber:#4d5661;  --amber-w:#eceff3;   /* ⛔ 폐지 → 회색으로 흡수 */
  --purple:#4d5661; --purple-w:#eceff3;  /* ⛔ 폐지 → 회색으로 흡수 */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%}
body{
  background:var(--bg); color:var(--ink);
  /* 🔴 시스템 글꼴만 — 웹폰트를 불러오지 않습니다 (외부 참조 0건 원칙) */
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Nanum Gothic",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
  /* 숫자를 고정폭으로 — 학번·점수가 목록에서 자리가 맞아 읽기 쉽습니다 */
  font-variant-numeric:tabular-nums;
}
/* 한 줄이 너무 길어지지 않게 (한글 40자 안팎) */
.wrap{max-width:860px;margin:0 auto;padding:0 12px 64px}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.4}
/* 📏 글자 크기는 네 단계로 고정합니다 — 화면 제목 / 구역 제목 / 본문 / 작은 설명 */
h2{font-size:21px;font-weight:800} h3{font-size:17px;font-weight:800} h4{font-size:15px;font-weight:700}
p{margin:0 0 8px}
p,.note,.hint{max-width:660px}
a{color:var(--blue)}

/* ===== 시제품 띠 ===== */
/* 🧪 시제품 띠 — 🔴 15차에서 3줄→한 줄로 줄였습니다.
   가장 크고 시끄러운 것이 아무 기능도 없는 경고문이면 나머지가 전부 죽습니다.
   ⛔ 없애지는 않습니다 — 실제 명단이 들어 있다는 경고는 남아야 합니다. */
#protoBar{
  background:var(--red);color:#fff;padding:7px 12px;font-size:13px;font-weight:700;
  text-align:center;line-height:1.4;position:sticky;top:0;z-index:60
}
#protoBar button{
  margin-left:10px;background:none;color:#fff;border:0;padding:0;
  font-size:13px;font-weight:400;text-decoration:underline;cursor:pointer;font-family:inherit
}

/* ===== 🧪 미리보기(예시 데이터) 띠 — ?demo=1 일 때만 나타납니다 ===== */
#previewBar{
  background:#b45309;color:#fff;padding:8px 12px;font-size:13px;font-weight:700;
  text-align:center;line-height:1.5;position:sticky;top:0;z-index:70;border-bottom:2px solid #7c2d12
}
#previewBar button{
  margin-left:10px;background:#fff;color:#7c2d12;border:0;border-radius:6px;padding:4px 12px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit
}

/* ===== 상단바 ===== */
.topbar{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center
}
.topbar .ttl{font-weight:800;font-size:18px}
.topbar .sub{font-size:13px;color:var(--dim);width:100%}
.topbar .sp{flex:1}
.scopebar{background:var(--blue-w);border-color:#b9d0ef}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:var(--card);padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--dim);min-height:42px}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}

/* ===== 카드 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card>h3:first-child,.card>h2:first-child{margin-top:0}
/* 📝 안내문 — 🔴 15차: 색 상자를 없앴습니다.
   색이 전부 안내문에 쓰이면 정작 눌러야 할 것에 쓸 색이 남지 않습니다.
   왼쪽 가는 세로선 + 회색 글씨로 충분합니다. */
.note{background:none;border:0;border-left:3px solid var(--line);border-radius:0;
  padding:6px 0 6px 11px;font-size:14px;line-height:1.6;color:var(--dim);margin:0 0 12px}
.note b{color:var(--ink)}
.note.b,.note.a,.note.p{border-left-color:var(--line)}          /* ⛔ 파랑·주황·보라 상자 폐지 */
.note.g{border-left-color:var(--green)}                          /* 🟢 완료 — 조용하게 */
/* 🔴 완료는 조용해도 됩니다. 눈에 띄어야 하는 것은 「아직 덜 된 것」입니다. */
.note.g b{color:var(--green)}
.note.r{border-left-color:var(--red)}                            /* 🔴 위험·경고 */
.note.r b{color:var(--red)}
.muted{color:var(--dim);font-size:13px}

/* ===== 주차 그리드 ===== */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.wbtn{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 8px;
  text-align:center;cursor:pointer;min-height:96px;display:flex;flex-direction:column;
  justify-content:center;gap:2px;font-family:inherit;color:inherit
}
.wbtn:active{transform:scale(.98)}
.wbtn .w1{font-weight:800;font-size:15px}
.wbtn .w2{font-size:14px;color:var(--ink);word-break:keep-all}
.wbtn .w3{font-size:13px;color:var(--dim)}
.wbtn .w4{font-size:13px;font-weight:700;margin-top:4px}
.wbtn.past{opacity:.72}
.wbtn.now{border-color:var(--blue);border-width:2px}

/* ===== 뱃지 ===== */
/* 🏷 상태 표시 — 🔴 큰 상자가 아니라 「작은 알약」으로만.
   🔴 색만으로 구분하지 않습니다 — 알약마다 글자(✅제출·⬛미제출)와 테두리가 함께 있어
      흑백 프린터로 뽑아도, 빨강·초록을 못 가리는 학생이 봐도 갈립니다. */
.bg{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:700;
  white-space:nowrap;border:1px solid transparent}
.bg.red{background:var(--red-w);color:var(--red);border-color:#e2b3b3}
.bg.green{background:var(--green-w);color:var(--green);border-color:#aed0bc}
/* ⛔ 파랑·주황·보라 알약 폐지 → 회색 하나로 (파랑은 「누르는 것」 전용) */
.bg.gray,.bg.blue,.bg.amber,.bg.purple{background:var(--soft);color:var(--dim);border-color:var(--line)}

/* ===== 버튼 ===== */
button,.btn{font-family:inherit}
/* 🔘 버튼 위계 — 🔴 15차 확정
   ① 주된 동작 : 파랑으로 채운 버튼. 🔴 한 화면에 하나뿐입니다. 폰에서는 가로 전체 폭
   ② 보조 동작 : 회색 테두리 + 진한 글자
   ③ 위험 동작 : 평소엔 조용한 회색 글씨(.quiet) → 누르면 그때 빨간 확인창
   ④ 선택된 상태(칩) : 파랑 「테두리」만 — 채우지 않습니다(주된 동작과 헷갈리지 않게) */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;
  min-height:44px;text-align:center;text-decoration:none;line-height:1.35
}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--dim)}
/* 🔵 주된 동작 — 앱 전체에서 「채워진 파랑」은 이것 하나뿐입니다 */
.btn.pri,.btn.fix,.btn.ok{background:var(--blue);border-color:var(--blue);color:#fff;
  font-weight:800;min-height:48px}
.btn.pri:hover,.btn.fix:hover,.btn.ok:hover{background:#0c3d80;border-color:#0c3d80}
/* 🔴 빨강으로 채운 버튼은 「확인창 안」에서만 (목록에 늘어놓지 않습니다) */
.btn.dan{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13.5px;font-weight:600}
/* 칩(고르는 것) — 골라진 것은 파랑 테두리 + 연한 파랑 바탕 */
.btn.sm.pri{background:var(--blue-w);border-color:var(--blue);color:var(--blue);min-height:36px;font-weight:800}
.btn.sm.pri:hover{background:#d8e5f7}
/* ⭐ 조용한 버튼 — 줄마다 반복되는 위험 동작(내보내기)은 평소 눈에 띄지 않게 둡니다.
   빨간 버튼이 16줄 반복되면 화면이 불안해 보이고, 정작 눌러야 할 [✏️ 수정]이 묻힙니다. */
/* ⚠️ 위험한 동작 — 평소엔 조용한 회색 글씨. 누르면 그때 빨간 확인창이 뜹니다.
   빨간 버튼이 목록에 반복되면 화면이 불안해 보이고 정작 눌러야 할 것이 묻힙니다. */
.quiet{background:none;border:0;color:var(--dim);font-size:13px;text-decoration:underline;
  cursor:pointer;padding:4px 6px;font-family:inherit;display:block;margin:0 auto}
.quiet:hover{color:var(--red)}
/* ✏️ 수정 버튼 — 「이미 낸 것을 다시 고치는」 자리는 앱 전체가 이 한 모양입니다.
   🔴 2026-08-20 (9차) 교수님이 3주차에서 수정 버튼을 못 찾으셨습니다. 테두리만 있는
   버튼은 초록 「✅ 제출 완료」 옆에서 안내문처럼 보여 아무도 누르지 않습니다.
   그래서 「채워진 짙은 파랑」으로 못박습니다 — 파랑 계열이라 [제출하기]와 한 식구로 보이되
   색이 진해 「이미 낸 것을 고치는 자리」라는 것이 구분됩니다. */
/* ✏️ 「이미 낸 것을 다시 고치는」 자리 — 9차에서 만든 규칙 그대로 유지하되
   15차에서 색을 주된 동작과 하나로 합쳤습니다(파랑은 하나면 충분합니다). */
.btn.fix.sm{padding:9px 13px;min-height:42px;font-size:14px}
/* 🔴 목록(표) 안에서 반복되는 버튼은 채우지 않습니다 — 15차.
   파란 버튼이 25줄 반복되면 화면이 시끄러워지고 정작 주된 동작([학생 한 명 추가])이 묻힙니다.
   테두리 + 진한 파랑 글자면 「누르는 것」임이 충분히 보입니다. */
table .btn.pri,table .btn.fix,table .btn.ok{
  background:var(--card);color:var(--blue);border-color:var(--blue);font-weight:700;min-height:38px}
table .btn.pri:hover,table .btn.fix:hover,table .btn.ok:hover{background:var(--blue-w)}
/* 📌 튜터링 팀 카드 — 8팀이 죽 늘어섭니다. 수업 중에 폰으로 씁니다(2026-08-20 10차) */
.tucard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;margin:0 0 8px}
.tucard.now{border-color:var(--blue);border-width:2px}
.tucard{padding:14px}
.tucard textarea{min-height:120px}
@media(min-width:760px){ .tucard textarea{min-height:150px} }
.btn.full{display:flex;width:100%}
/* 📱 폰에서는 주된 동작이 가로 전체 폭 — 손가락으로 바로 누를 수 있게 */
@media(max-width:560px){
  .btnrow>.btn.pri:not(.sm),.btnrow>.btn.fix:not(.sm),.btnrow>.btn.ok:not(.sm){flex:1 1 100%}
  /* ⚠️ 다만 팀 카드(8개가 줄줄이 늘어섬) 안의 [저장]까지 가로 전체로 늘리면
     파란 막대가 8개 쌓여 화면이 도로 시끄러워집니다 — 그 안에서는 작게 둡니다. */
  .tucard .btnrow>.btn.pri{flex:0 1 auto}
}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.menu .btn{text-align:left}

/* ===== 폼 ===== */
label.f{display:block;font-size:14px;font-weight:700;margin:14px 0 5px;color:var(--ink)}
label.f .req{color:var(--red)}
label.f .lim{font-weight:400;color:var(--dim);font-size:13px}
/* ⌨️ 입력칸 — 🔴 15차: 테두리를 또렷하게, 높이를 충분히,
   커서가 들어간 칸은 테두리 색이 바뀌어 「지금 어디에 쓰고 있는지」 보이게 */
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-size:16px;line-height:1.5;min-height:46px;font-family:inherit;background:var(--card);color:var(--ink)
}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-w)
}
::placeholder{color:#8b949e}
/* 오래 읽고 쓰는 글(조사 자료·튜터링 기록)은 더 크게 */
textarea{min-height:110px;resize:vertical;line-height:1.65;font-size:17px}
input:disabled,textarea:disabled,select:disabled{background:#f0f2f5;color:#8a939d}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:15px;margin:9px 0}
.chk input{margin-top:3px;width:22px;height:22px;flex:0 0 auto}
.rolepick{display:flex;gap:8px;margin:6px 0 4px}
.rolepick button{
  flex:1;padding:16px 6px;border:2px solid var(--line);background:var(--card);border-radius:10px;
  font-size:17px;font-weight:700;cursor:pointer;color:var(--dim);min-height:56px
}
.rolepick button.on{border-color:var(--blue);background:var(--blue-w);color:var(--blue)}
.profpick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.profpick button{
  padding:12px 4px;border:2px solid var(--line);background:#fff;border-radius:10px;
  cursor:pointer;font-size:14px;font-weight:700;color:var(--dim);line-height:1.3
}
.profpick button.on{border-color:var(--blue);background:var(--blue-w);color:var(--blue)}
.profpick button span{display:block;font-size:11.5px;font-weight:400}

/* ===== 척도 ===== */
/* 팀원 고르기 목록 — 폰에서 25명을 훑어야 하므로 상자 안에서만 스크롤합니다 */
.picklist{max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:8px;padding:2px 9px;margin:6px 0;background:#fff}
.pickrow{display:flex;gap:10px;align-items:center;font-size:15px;padding:11px 1px;
  border-bottom:1px solid var(--soft);cursor:pointer}
.pickrow:last-child{border-bottom:0}
.pickrow input{width:22px;height:22px;flex:0 0 auto}
.pickrow.off{opacity:.5;cursor:not-allowed}
.pickrow .bg{margin-left:auto}
.scale{display:flex;gap:4px;margin:3px 0 6px}
.scale button{
  flex:1;min-width:40px;padding:12px 0;border:1.5px solid var(--line);background:var(--card);
  border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;color:var(--dim);min-height:46px
}
.scale button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}

/* ===== 🔘 루브릭 4단계 고르개 (2026-08-22 · 18차) =====
   「점수」가 아니라 「수준 설명」을 누릅니다 — 설명 문장 자체가 버튼입니다.
   ⚠️ 폰 375px에서 네 줄이 쌓이므로 글자를 줄이지 말고 줄을 세로로 놓습니다. */
.lvq{font-weight:700;font-size:16px;margin:12px 0 5px}
.lvpick{display:flex;flex-direction:column;gap:5px;margin:0 0 4px}
/* 🔲 항목 카드 (2026-08-23) — 평가 항목마다 경계로 확실히 구분합니다.
   옅은 회색 바탕 카드로 감싸고, 제목 왼쪽에 파란 강조 바를 두어
   "여기부터 여기까지가 한 항목"이 한눈에 보이게 합니다. */
.lvgroup{background:var(--soft);border:1px solid var(--line);border-radius:10px;
  padding:13px 13px 12px;margin:0 0 14px}
.lvgroup:last-child{margin-bottom:2px}
.lvgroup .lvq{margin:0 0 9px;padding-left:10px;border-left:4px solid var(--blue)}
.lvgroup .lvpick{margin:0}
.lvpick button{
  display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--line);background:var(--card);border-radius:8px;
  padding:10px 11px;cursor:pointer;font-family:inherit;font-size:15px;line-height:1.5;
  color:var(--ink);min-height:46px
}
.lvpick button .n{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:var(--soft);
  color:var(--dim);font-weight:800;font-size:14px;text-align:center;line-height:24px;
  font-variant-numeric:tabular-nums
}
.lvpick button .t{flex:1}
.lvpick button.on{border-color:var(--blue);border-width:2px;background:var(--blue-w);font-weight:600}
.lvpick button.on .n{background:var(--blue);color:#fff}

/* ===== 표 ===== */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px;max-width:100%}
.card,.note,.acc{overflow-wrap:anywhere}
img{max-width:100%}
.scroll>table{width:auto;min-width:100%;max-width:none}
table{overflow-wrap:normal}
td.nw,th.nw{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;white-space:nowrap}
td.c,th.c{text-align:center}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.alt td{background:#f7f9fb}

/* ===== 접이식 ===== */
.acc{border:1px solid var(--line);border-radius:8px;margin:0 0 7px;background:#fff;overflow:hidden}
.acc>.hd{padding:13px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.acc>.hd .sp{flex:1}
.acc>.bd{padding:0 10px 10px;border-top:1px solid var(--line)}

/* ===== 그래프 ===== */
.barrow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.barrow .lb{width:78px;flex:0 0 auto;color:var(--dim)}
.barrow .bar{height:15px;background:#3a434e;border-radius:3px;min-width:2px}
.barrow .vl{font-variant-numeric:tabular-nums;color:var(--dim)}

/* ===== 토스트 · 확인창 ===== */
#toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:120;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:15px;
  max-width:90%;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)
}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:110;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:12px;padding:16px;max-width:400px;width:100%}
#modal .box p{font-size:14px;white-space:pre-wrap}

.footnote{font-size:13px;color:var(--dim);text-align:center;margin:22px 0 0;line-height:1.6}
.pager{display:flex;gap:6px;margin:12px 0 0}
.pager .btn{flex:1}
.kv{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;font-size:15px}
.kv .k{color:var(--dim)}
.hr{height:1px;background:var(--line);margin:12px 0}
/* ==========================================================================
   📊 설문 결과 — 그래프·해석 (2026-08-21 · 14차)
   --------------------------------------------------------------------------
   🔴 그래프는 외부 라이브러리 없이 CSS 막대로 그립니다. 폰 375px에서
      읽혀야 하므로 세로 막대가 아니라 「가로 막대」입니다.
   🔴 인쇄하면 배경색이 빠지는 브라우저가 있어 print-color-adjust:exact 를
      막대에 걸어 둡니다 — 이게 없으면 종이에서 막대가 사라집니다.
   ========================================================================== */
.sb{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px;line-height:1.35}
.sbl{flex:0 0 88px;color:var(--dim);word-break:keep-all}
.sbt{flex:1 1 auto;min-width:40px;height:14px;background:var(--soft);border:1px solid var(--line);border-radius:2px;overflow:hidden;
  print-color-adjust:exact;-webkit-print-color-adjust:exact}
.sbf{display:block;height:100%;background:var(--blue);
  print-color-adjust:exact;-webkit-print-color-adjust:exact}
/* 🔴 15차 — 막대에서 파랑·초록을 걷어냈습니다.
   파랑은 「누르는 것」 전용이고, 색만으로 갈리는 그림은
   흑백 프린터와 색각 이상에서 무너집니다. 그래서 「밝기 + 빗금」으로 구분합니다. */
.sbf.blue{background:#8b949e}                     /* 사전 실측 — 중간 회색 */
.sbf.green{background:#1a2129}                    /* 최종-현재 — 거의 검정 */
.sbf.gray{background:repeating-linear-gradient(45deg,#3f4854,#3f4854 4px,#eef1f5 4px,#eef1f5 9px)}
.sbv{flex:0 0 66px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink)}
/* 이름표가 긴 보기(문장)는 막대 위로 올립니다 */
.sb2{margin:5px 0 3px}
.sb2l{font-size:13px;line-height:1.4;word-break:keep-all;margin-bottom:3px}
.sb2r{display:flex;align-items:center;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--dim);margin:0 0 10px}
.legend i.k{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px;
  print-color-adjust:exact;-webkit-print-color-adjust:exact}
.legend i.k.blue{background:#8b949e}
.legend i.k.green{background:#1a2129}
.legend i.k.gray{background:repeating-linear-gradient(45deg,#3f4854,#3f4854 2px,#eef1f5 2px,#eef1f5 4px)}
.qt{font-weight:700;font-size:15px;margin:16px 0 5px;word-break:keep-all;color:var(--ink)}
.q{color:var(--dim);font-size:13px}
.q.b{font-weight:700}
.hint{border-left:3px solid var(--line);padding:5px 0 5px 11px;color:var(--dim);font-size:13.5px;line-height:1.6;margin:10px 0}
.hint.r{border-color:var(--red);color:var(--red)}
.sumbox{border-top:2px solid var(--ink);margin-top:12px;padding-top:8px;font-size:15px}
.two{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){ .two{grid-template-columns:1fr 1fr} }
.freelist{margin-top:4px}
.freelist .fr{border-left:3px solid var(--line);padding:6px 0 6px 11px;margin:0 0 8px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--soft);color:var(--dim);border:1px solid var(--line)}
.pill.amber{background:var(--soft);color:var(--dim)}
/* 🔴 결과의 의미 — 자동으로 쓴 글이라 「계산 결과」임이 보이게 조용히 둡니다 */
.interp{border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:0 6px 6px 0;
  padding:9px 11px;margin:12px 0 0;background:#fbfcfd}
.interp .ih{font-weight:800;font-size:15px;margin-bottom:6px}
.interp .ib div{font-size:15px;line-height:1.65;margin:5px 0;word-break:keep-all}
.interp .idisc{font-size:13px;color:var(--dim);line-height:1.55;margin-top:9px;border-top:1px solid var(--line);padding-top:7px}

/* ==========================================================================
   🖨 교수 튜터링 일지 — A4 세로 출력물 (2026-08-21 · 12차)
   --------------------------------------------------------------------------
   🔴 화면 미리보기와 인쇄 결과가 「같아야」 합니다. 그래서
      · 종이 크기를 mm 로 못박고 (210×297)
      · @page margin:0 으로 두어 여백까지 이 상자가 직접 그립니다
      · 화면에서는 크기를 건드리지 않고 transform 으로 보기만 축소합니다
      (px 로 짜면 화면과 종이가 어긋나 「미리보기와 다른 종이」가 나옵니다.)
   ▸ 본문 글자 크기는 --tlfs 하나로만 굴립니다. 넘칠 때 9 → 8.5 → 8pt 로
     이 변수만 바꾸면 표 전체가 같이 줄어듭니다 (tlFit).
   ========================================================================== */
.a4wrap{overflow:hidden;margin:0 0 10px}
.a4scale{transform-origin:top left}
.a4sheet{
  --tlfs:9pt;
  width:210mm; min-height:297mm; padding:13mm 12mm; box-sizing:border-box;
  background:#fff; color:#000; border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.18); margin:0 auto 8mm;
  font-family:"Malgun Gothic","맑은 고딕",sans-serif;
}
.a4sheet .a4in{display:block}
.a4sheet .tltitle{font-size:15.5pt;font-weight:800;text-align:center;letter-spacing:.5px;margin:0 0 3mm}
.a4sheet .tlrule{border-top:1.6pt solid #000;margin:0 0 2.5mm}
.a4sheet .tlmeta{width:100%;border-collapse:collapse;font-size:9pt;margin:0 0 4mm}
.a4sheet .tlmeta td{border:0;padding:.7mm 0;vertical-align:baseline}
.a4sheet .tlmeta td.k{width:17mm;font-weight:700;color:#000;white-space:nowrap}
.a4sheet .tlmeta td.v{padding-right:6mm}
/* 본문 표 — 튜터링 칸이 가장 넓습니다 (지면 186mm) */
.a4sheet .tlt{width:100%;border-collapse:collapse;font-size:var(--tlfs);line-height:1.33;table-layout:fixed}
.a4sheet .tlt col.c1{width:22mm}
.a4sheet .tlt col.c2{width:54mm}
.a4sheet .tlt col.c3{width:110mm}
.a4sheet .tlt th{border:.8pt solid #000;background:#e9ecef;color:#000;padding:1.2mm 1.6mm;
  font-size:8.5pt;font-weight:700;text-align:center;white-space:nowrap}
.a4sheet .tlt td{border:.8pt solid #555;padding:1.4mm 1.6mm;vertical-align:top;
  word-break:break-word;overflow-wrap:anywhere}
/* 두 장이 될 때 한 팀의 줄이 반으로 갈리지 않게 — 통째로 다음 장으로 넘어갑니다 */
.a4sheet .tlt tr{page-break-inside:avoid;break-inside:avoid}
.a4sheet .tlt td.tno{text-align:center;line-height:1.25}
.a4sheet .tlt .mem{margin:0 0 .8mm}
.a4sheet .tlt .tpc{color:#222}
.a4sheet .tlt .sub{margin-top:.8mm}
.a4sheet .tlt .ab{color:#666}
.a4sheet .dim{color:#777}
.a4sheet .c{text-align:center}
.a4sheet .blk{display:block;padding:1.5mm 0}
/* 🧮 A4 점수표 (2026-08-23 · 19차) — 튜터링 일지와 같은 종이 규칙을 그대로 씁니다.
   글자 크기는 --tlfs 하나로만 굴러가므로 넘치면 9 → 8.5 → 8pt 로 함께 줄어듭니다. */
.a4sheet .sct{width:100%;border-collapse:collapse;font-size:var(--tlfs);line-height:1.35;table-layout:fixed}
.a4sheet .sct th{border:.8pt solid #000;background:#e9ecef;color:#000;padding:1.1mm 1.2mm;
  text-align:left;font-weight:700}
.a4sheet .sct td{border:.8pt solid #555;padding:1.1mm 1.2mm;vertical-align:top;word-break:break-all}
.a4sheet .sct tr{page-break-inside:avoid;break-inside:avoid}
/* 표가 여러 장에 걸치면 머리행(thead)을 장마다 반복합니다 */
.a4sheet .sct thead{display:table-header-group}
.a4sheet .tlt thead{display:table-header-group}
.a4sheet .sct thead tr.mx th{background:#f4f6f8;font-weight:700;padding:.6mm 1.2mm;font-size:.9em}
.a4sheet .sct td.num,.a4sheet .sct th.num{text-align:right;font-variant-numeric:tabular-nums}
.a4sheet .sct td.c,.a4sheet .sct th.c{text-align:center}
.a4sheet .sct td.nm{white-space:nowrap}
.a4sheet .sct td.nm .no{color:#444;font-size:.9em}
.a4sheet .sct td.tot{background:#f4f6f8}
.a4sheet .sct td.tm{color:#222}
.a4sheet .sct col.s1{width:9mm}  .a4sheet .sct col.s2{width:40mm}
.a4sheet .sct col.s4{width:14mm} .a4sheet .sct col.s5{width:45mm}
.a4sheet .sct th{white-space:nowrap}
.a4sheet .sct.one col.o1{width:34mm} .a4sheet .sct.one col.o2{width:14mm}
.a4sheet .sct.one col.o3{width:20mm} .a4sheet .sct.one col.o4{width:114mm}
.a4sheet .sct.one td{padding:1.6mm 1.6mm}
.a4sheet .sct.one .how{line-height:1.4}
.a4sheet .sct.one .cal{color:#333;font-size:.92em;margin-top:.6mm}
.a4sheet .sct.one .cal.pen{color:#8a1010}
.a4sheet .sct .sumrow td{background:#e9ecef;font-weight:700}
/* 🗂 주차별 활동기록 (2026-08-23 · 20차) — 표가 여러 장에 걸쳐 흐릅니다 */
.a4sheet .alh{font-size:11pt;font-weight:800;margin:4mm 0 1.5mm;padding-bottom:.8mm;
  border-bottom:1pt solid #000;page-break-after:avoid;break-after:avoid}
.a4sheet .alp{font-size:9pt;line-height:1.5;margin:0 0 2mm;white-space:normal}
.a4sheet .sct.al{table-layout:fixed}
.a4sheet .sct.al td{word-break:break-word;line-height:1.35}
.a4sheet .sct.al thead{display:table-header-group}
.a4sheet .scwarn{border:1pt solid #8a1010;color:#8a1010;padding:1.4mm 2mm;margin:0 0 2.5mm;font-size:8.5pt}
.a4sheet .scnote{border-top:.8pt solid #555;margin-top:3mm;padding-top:2mm;font-size:8pt;line-height:1.5;color:#222}
.a4sheet .scfoot1{border-top:.8pt solid #555;margin-top:3mm;padding-top:1.5mm;font-size:8pt;font-weight:700;color:#222}
.a4sheet .tlfoot{display:flex;align-items:baseline;font-size:7.5pt;color:#555;margin-top:2.5mm}
.a4sheet .tlfoot .sp{flex:1}
.a4sheet .tlfoot .warn{color:#8a1010;font-weight:700}

@media print{
  /* 🔴 14차 — 여백을 @page 가 만듭니다.
     설문 결과 인쇄본은 여러 장이 되는데, 여백을 상자 padding 으로 주면
     둘째 장부터 위쪽 여백이 사라집니다. @page 여백은 모든 장에 걸립니다.
     그래서 인쇄할 때 .a4sheet 는 padding 을 0 으로 두고 폭·높이만 줄입니다
     (210−24=186mm · 297−26=271mm — 화면 미리보기와 같은 값). */
  @page{ size:A4 portrait; margin:13mm 12mm; }
  html,body{background:#fff !important}
  #protoBar,#previewBar,#toast,#modal,.noprint{display:none !important}
  /* ⚠️ 아래 「인쇄본만 남기기」는 인쇄 화면(body.printsheet)에서만 겁니다.
     화면 전체에 걸면 교수님이 다른 화면에서 Ctrl+P를 누르셨을 때 백지가 나옵니다. */
  body.printsheet>*{display:none !important}
  body.printsheet>.wrap{display:block !important;max-width:none;margin:0;padding:0}
  body.printsheet #app>*{display:none !important}
  body.printsheet #app>.a4wrap{display:block !important;overflow:visible !important;height:auto !important;margin:0}
  .a4scale{transform:none !important}
  .a4sheet{width:186mm !important;min-height:271mm;padding:0 !important;
    border:0 !important;box-shadow:none !important;margin:0 !important;
    page-break-after:always;break-after:page}
  .a4sheet:last-child{page-break-after:auto;break-after:auto}
  /* 흐르는 인쇄본(설문 결과)은 여러 장이 정상 — 한 장 높이를 강요하지 않습니다 */
  .a4sheet.flow{min-height:0}
  .noprint{display:none !important}
}

/* 📄 설문 결과 인쇄본 — 종이 위에서는 상자 테두리를 걷어내고 글자를 줄입니다 */
.a4sheet.flow{min-height:auto}
.a4sheet .svp{font-size:12px}
.a4sheet .svp .card{border:0;border-radius:0;padding:0;margin:0 0 6mm;box-shadow:none;
  page-break-inside:auto;break-inside:auto}
.a4sheet .svp h3{font-size:12.5pt;border-bottom:1.2pt solid #000;padding-bottom:1.5mm;margin-bottom:2.5mm}
.a4sheet .svp .qt{font-size:9.5pt;margin:3.5mm 0 1mm;page-break-after:avoid;break-after:avoid}
.a4sheet .svp .sb,.a4sheet .svp .sb2l,.a4sheet .svp .q{font-size:8.5pt}
.a4sheet .svp .sbv{font-size:8.5pt}
.a4sheet .svp .interp{page-break-inside:avoid;break-inside:avoid;background:#f4f6f8}
.a4sheet .svp .interp .ib div{font-size:9pt}
.a4sheet .svp .interp .idisc{font-size:7.5pt}
.a4sheet .svp table{font-size:8.5pt}
.a4sheet .svp .freelist .fr{font-size:8.5pt;page-break-inside:avoid;break-inside:avoid}
.a4sheet .svp .scroll{overflow:visible}
/* 종이에서 두 칸(사전·최종)이 붙어 「6명」과 다음 칸 이름표가 맞닿습니다 — 사이를 벌립니다 */
.a4sheet .svp .two{grid-template-columns:1fr 1fr;gap:9mm}
.a4sheet .svp .sbv{flex:0 0 13mm}

@media (max-width:400px){
  body{font-size:16px}
  .wrap{padding:0 8px 60px}
  .profpick{grid-template-columns:1fr;}
  .profpick button{display:flex;gap:8px;justify-content:center;align-items:baseline;padding:11px 4px}
  .profpick button span{display:inline}
}
</style>
</head>
<body>

<div class="wrap"><div id="app"></div></div>
<div id="toast"></div>
<div id="modal"><div class="box"><p id="modalMsg"></p><div class="btnrow" style="margin-top:12px;justify-content:flex-end">
  <button class="btn" onclick="APP.modalNo()">취소</button>
  <button class="btn pri" id="modalYes">진행</button></div></div></div>
<script>
/* 🏁 배포본 빌드 플래그 — 개발도구(예시데이터·자체점검·되돌리기·시제품 띠)를 배포본에서 끕니다.
   교내용 index.html 은 false(개발도구 살아있음), make.py --deploy 가 true 로 바꿉니다. */
var IS_DEPLOY=true;

/* ==========================================================================
   🧪 미리보기(예시) 모드 — 주소 끝에 ?demo=1 (또는 ?preview=1) 이 있을 때만 켜집니다.
   --------------------------------------------------------------------------

function isoAdd(iso, days){
  var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days);
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

   -------------------------------------------------------------------------- */
var DB = {
  d:null,
  boot:function(){
    var raw=null;
    try{ raw = localStorage.getItem(STORE); }catch(e){ raw=null; }
    if(raw){ try{ this.d = JSON.parse(raw); }catch(e){ this.d=null; } }
    if(!this.d || this.d.__v!==DATA_V){ this.d = SEED.build(); this.flush(); }
    return this.d;
  },
  /* 🔴 18차 — 「묶어서 한 번만 저장」
     예시 데이터를 채울 때 DB.add 가 수천 번 불리는데, 그때마다 데이터 전체를 글자로 바꿔
     저장하면 **줄 수가 늘수록 제곱으로 느려집니다**(루브릭이 2항목→4항목이 되면서 실제로
     자체 점검이 몇 분씩 걸렸습니다). hold() ~ release() 사이에는 저장을 미룹니다.
     ⚠️ release() 를 빠뜨리면 저장이 영영 안 됩니다 — 반드시 try/finally 로 짝을 맞추십시오. */
  _hold:0,
  hold:function(){ this._hold++; },
  release:function(){ this._hold--; if(this._hold<=0){ this._hold=0; this.flush(); } },
  flush:function(){ if(this._hold>0) return;
    if(window.scCacheClear) scCacheClear();      /* 🧮 19차 — 점수 계산 캐시를 버립니다 */
    try{ localStorage.setItem(STORE, JSON.stringify(this.d)); }catch(e){} },
  wipe:function(){ try{ localStorage.removeItem(STORE); localStorage.removeItem(SESSKEY); }catch(e){} this.d=null; },

  /* 조회 — get('students', fn) */
  get:function(t, fn){
    var a = this.d[t]||[];
    return fn ? a.filter(fn) : a.slice();
  },
  one:function(t, fn){
    var a=this.d[t]||[];
    if(typeof fn==='string'){ for(var i=0;i<a.length;i++) if(a[i].id===fn) return a[i]; return null; }
    for(var j=0;j<a.length;j++) if(fn(a[j])) return a[j];
    return null;
  },
  add:function(t, row){
    if(!this.d[t]) this.d[t]=[];
    if(!row.id) row.id = t.slice(0,2)+'_'+(++this.d.__seq);
    this.d[t].push(row); this.flush(); return row;
  },
  set:function(t, id, patch){
    var r = this.one(t, id); if(!r) return null;
    for(var k in patch) r[k]=patch[k];
    this.flush(); return r;
  },
  del:function(t, id){
    this.d[t] = (this.d[t]||[]).filter(function(r){return r.id!==id;});
    this.flush();
  },
  /* 변경 기록 — 설계서 「변경이력」 표 */
  log:function(what, detail){
    this.add('audit', {who:(SESS.acc?SESS.acc.name:'-'), when:nowStr(), what:what, detail:detail});
  }
};

    d.audit.push({id:nid('au'),who:'출석부 등록',when:'2026-08-25 09:00',
      what:'출석부 올리기',detail:'F1 '+ROSTER.F1.length+'명 · F2 '+ROSTER.F2.length+'명 · F3 '+ROSTER.F3.length+'명 등록'});
    d.__seq = seq;
    return d;
  }
};

/* --------------------------------------------------------------------------
   3. 잡동사니 도우미
   -------------------------------------------------------------------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function val(id){ var e=$(id); return e? e.value.trim() : ''; }
function nowStr(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
/* 🔴 날짜가 비어 있어도 깨지지 않게 합니다.
      데이터베이스 방식에서는 주차 날짜가 표(weeks)에 없을 수 있어(schema.sql 은 상태만 시드),
      undefined.split(...) 로 화면 전체가 무너지던 자리입니다. 없으면 빈칸으로 둡니다. */
function dow(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); return ['일','월','화','수','목','금','토'][d.getDay()]; }
function md(iso){ if(!iso) return ''; var p=String(iso).split('-'); return (+p[1])+'/'+(+p[2]); }
function mdw(iso){ if(!iso) return ''; return md(iso)+'('+dow(iso)+')'; }
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},2600); }

/* 강좌 표기 — 화면에는 언제나 「F2 (곽호석 교수)」. 학생이 강좌번호를 모를 수 있습니다 */
function clsFull(cid){ return cid+' ('+classProf(cid)+' 교수)'; }
/* 이름 맞추기 — 공백 차이는 무시합니다 (출석부 「홍 길동」 = 학생 입력 「홍길동」) */
function normName(s){ return String(s==null?'':s).replace(/[\s\u00a0]/g,''); }

/* 학생 표기 — 언제나 「이름 (학번)」 (설계서 1-1-8) */
function sn(st){ if(!st) return '(없음)'; return st.name+' ('+st.no+')'; }
/* 교수 표기 — 언제나 이름만. 🔒 교번은 절대 함께 쓰지 않습니다 (설계서 1-1-6) */
function pn(pid){ for(var i=0;i<PROFS.length;i++) if(PROFS[i].id===pid) return PROFS[i].name; return '-'; }
function classProf(cid){ for(var i=0;i<CLASSES.length;i++) if(CLASSES[i].id===cid) return pn(CLASSES[i].profId); return '-'; }
function profOfClass(cid){ for(var i=0;i<CLASSES.length;i++) if(CLASSES[i].id===cid) return CLASSES[i].profId; return null; }
function classOfProf(pid){ for(var i=0;i<PROFS.length;i++) if(PROFS[i].id===pid) return PROFS[i].classId; return null; }

function team(tid){ return DB.one('teams', tid); }
function teamOf(st){ return st && st.teamId ? DB.one('teams', st.teamId) : null; }
function teamMembers(tid){
  return DB.get('members', function(m){return m.teamId===tid;})
    .map(function(m){ var s=DB.one('students',m.studentId); return s?{st:s,role:m.role}:null; })
    .filter(function(x){return x;});
}
function studentOfAcc(aid){ return DB.one('students', function(s){return s.accountId===aid;}); }

/* 살아 있는 학생만 — 「내보내기(비활성)」한 학생은 기본으로 빼고 봅니다 */
function liveStudents(cids, withInactive){
  return DB.get('students', function(s){
    if(cids && cids.indexOf(s.classId)<0) return false;
    return withInactive ? true : s.active!==false;
  });
}

/* 그 강좌에 팀이 하나라도 만들어졌는가 — 「팀 없음」을 경고로 볼지 가르는 기준.
   🔴 2026-08-20 교수님 확인: "아직 팀은 없어, 팀은 2주차에 정해질 예정이야"
      팀 편성 전에 팀이 없는 것은 이상이 아니라 예정된 상태입니다.
      그래서 날짜가 아니라 「그 강좌에 팀이 생겼는가」로 판정합니다
      (교수마다 팀 짜는 날이 다르고, 시제품은 날짜를 임의로 바꿔 보게 되어 있으므로). */
function teamsMade(cid){ return DB.get('teams', function(t){return t.classId===cid;}).length>0; }
function teamPending(cid){ return !teamsMade(cid); }

/* 그 강좌에서 한 명이라도 로그인했는가 — 「아직 로그인 안 함」을 경고로 볼지 가르는 기준.
   같은 이치입니다: 첫 수업 전에는 아무도 안 들어온 것이 정상이라 75명 전원이
   경고로 뜨면 화면이 온통 빨개져 정작 진짜 문제가 묻힙니다.
   한 명이라도 들어온 뒤부터는 못 들어온 학생이 「진짜 못 들어온 것」이 됩니다. */
function loginStarted(cid){ return !!DB.one('students', function(s){return s.classId===cid && s.active!==false && s.lastLoginAt;}); }
function loginPending(cid){ return !loginStarted(cid); }

/* ⚠️ 확인 필요 — 교수님이 명단에서 눈으로 잡으셔야 하는 네 가지
   (2026-08-20: 출석부 사전등록으로 바뀌면서 「명단에 없는 학번」류는 사라지고,
    대신 「출석부엔 있는데 앱에 못 들어온 학생」이 새로 들어왔습니다) */
function stuWarn(st){
  var w=[];
  if(st.active===false) return ['내보냄'];
  if(!st.teamId && teamsMade(st.classId)) w.push('팀 없음');   /* 팀 편성이 시작된 뒤에만 경고 */
  if(DB.get('students', function(x){return x.no===st.no && x.active!==false;}).length>1) w.push('중복 학번');
  if(DB.get('students', function(x){return normName(x.name)===normName(st.name) && x.no!==st.no && x.active!==false;}).length>0) w.push('동명이인');
  if(!st.lastLoginAt && loginStarted(st.classId)) w.push('아직 로그인 안 함');   /* 수업이 시작된 뒤에만 경고 */
  return w;
}
function warnColor(w){
  if(w==='동명이인' || w==='아직 로그인 안 함') return 'amber';
  if(w==='내보냄') return 'gray';
  return 'red';
}

/* 그 학생이 남긴 것 — 지우기 전에 실제로 세어 보여 줍니다 */
function footprint(st){
  return {
    준팀간: DB.get('peerTeam',   function(x){return x.evaluator===st.id;}).length,
    준팀내: DB.get('peerMember', function(x){return x.evaluator===st.id;}).length,
    받은팀내: DB.get('peerMember', function(x){return x.studentId===st.id;}).length,
    설문:   DB.get('answers',    function(x){return x.studentId===st.id;}).length,
    참석:   DB.get('attend',     function(x){return x.studentId===st.id;}).length,
    팀제출물: st.teamId? DB.get('activity', function(x){return x.teamId===st.teamId;}).length
                       + DB.get('submits',  function(x){return x.teamId===st.teamId;}).length : 0
  };
}

/* --------------------------------------------------------------------------
   4-2. 🔴 팀 — 「대표 한 명이 팀원을 골라 저장」 (2026-08-20 · 7차)
   --------------------------------------------------------------------------
   교수님 지시: "3명 또는 4명 중 한사람이 기존 학생 명단 중에 선택할 수 있도록 하고,
   팀 이름과 의미를 기입하여 저장하면, 나머지 같은 팀원들은 입력하지 않아도
   그 같은 팀에 자동으로 소속되어 보일 수 있도록 ... 현재 구성된 초대코드 이런건 하지 말고"

   ⛔ 초대코드는 데이터에도 화면에도 없습니다. 팀에 들어가는 길은 이 파일의
      teamJoin() 하나뿐이고, 그것을 부르는 곳은 ① 대표가 팀을 만들 때
      ② 대표가 팀을 고칠 때 ③ 교수가 남는 학생을 넣을 때 — 셋뿐입니다.
   -------------------------------------------------------------------------- */
function teamCap(){ var s=DB.d.settings; return (s && s.maxTeams) ? s.maxTeams : 8; }
function teamCount(cid){ return DB.get('teams', function(t){return t.classId===cid;}).length; }
function teamFull(cid){ return teamCount(cid) >= teamCap(); }
function teamCreator(t){ return (t && t.createdBy) ? DB.one('students', t.createdBy) : null; }
function isTeamCreator(t, st){ return !!(t && st && t.createdBy===st.id); }
function teamNoNext(cid){
  var mx=0; DB.get('teams', function(t){return t.classId===cid;}).forEach(function(t){ if(t.no>mx) mx=t.no; });
  return mx+1;
}
/* 학생이 팀을 고칠 수 있는 때 — 만든 사람이고, 교수 승인 전이고, 2주차가 마감되지 않았을 때 */
function teamEditable(t, st){
  if(!isTeamCreator(t, st)) return false;
  if(t.ok) return false;
  return wState(2)!=='마감';
}
/* 고를 수 있는 사람 목록 — 같은 강좌 · 나 제외.
   🔴 이미 팀이 있는 학생도 목록에 「남겨 둡니다」(흐리게). 숨기면 학생이
      "왜 내 친구가 안 보이지" 하고 헤매다 교수님께 전화합니다. */
function teamPickPool(st){
  return DB.get('students', function(s){
      return s.classId===st.classId && s.active!==false && s.id!==st.id; })
    .sort(function(a,b){ return a.no<b.no? -1:1; });
}
/* 팀 이름·뜻 검사 — 학생 화면과 교수 화면이 같은 자를 씁니다 */
function teamNameBad(cid, name, meaning, exceptId){
  name=String(name==null?'':name).trim(); meaning=String(meaning==null?'':meaning).trim();
  if(name.length<2 || name.length>15) return '팀 이름은 2~15자입니다.';
  if(meaning.length<5) return '팀 이름의 뜻을 한 문장 이상 적어 주세요. (왜 이렇게 지었는지)';
  if(DB.one('teams', function(t){return t.classId===cid && t.name===name && t.id!==exceptId;}))
    return '같은 강좌에 「'+name+'」 팀이 이미 있습니다. 다른 이름으로 지어 주세요.';
  return '';
}
/* ★ 팀 만들기 — 화면과 자체 점검기가 「같은 함수」를 씁니다.
   (눈으로 본 것과 검사한 것이 어긋나는 사고를 막습니다) */
function teamCreate(creator, ids, name, meaning){
  if(!creator) return {msg:'학생 정보가 없습니다. 다시 로그인해 주세요.'};
  var me = DB.one('students', creator.id) || creator;
  var cid = me.classId;
  if(me.teamId){ var mt=DB.one('teams', me.teamId);
    return {msg:'이미 팀에 속해 있습니다'+(mt? ' — '+mt.no+'팀 「'+mt.name+'」':'')+'.'}; }
  if(teamFull(cid)) return {msg:'이 강좌는 '+teamCap()+'팀이 모두 만들어졌습니다. 담당교수님께 말씀해 주세요.'};
  var bad = teamNameBad(cid, name, meaning);
  if(bad) return {msg:bad};

  ids = (ids||[]).filter(function(x,i,a){ return x && x!==me.id && a.indexOf(x)===i; });
  var total = ids.length+1;
  if(total<3) return {msg:'나를 포함해 3명 또는 4명이어야 합니다. 지금 '+total+'명입니다.'};
  if(total>4) return {msg:'나를 포함해 4명까지입니다. 지금 '+total+'명입니다.'};

  var picked=[];
  for(var i=0;i<ids.length;i++){
    var s = DB.one('students', ids[i]);
    if(!s || s.active===false) return {msg:'명단에 없는 학생이 골라졌습니다. 다시 골라 주세요.'};
    if(s.classId!==cid) return {msg:'같은 강좌 학생만 고를 수 있습니다.'};
    /* 🔴 동시 저장 충돌 — 먼저 저장한 쪽이 이깁니다 */
    if(s.teamId){ var ot=DB.one('teams', s.teamId);
      return {msg:s.name+' 학생이 방금 다른 팀에 들어갔습니다. 다시 골라 주세요.'+
        (ot? ' ('+ot.no+'팀 「'+ot.name+'」)':'')}; }
    picked.push(s);
  }
  var t = DB.add('teams', {classId:cid, no:teamNoNext(cid), name:String(name).trim(),
    meaning:String(meaning).trim(), createdBy:me.id, ok:false, at:nowStr()});
  teamJoin(t.id, me.id, '만든 사람');
  picked.forEach(function(s){ teamJoin(t.id, s.id, '팀원'); });
  return {ok:true, team:t};
}
/* 한 사람을 팀에 넣기 / 빼기 — 「학생 표」와 「팀원 표」를 언제나 함께 고칩니다.
   한쪽만 고치면 홈에는 팀이 보이는데 팀원 목록엔 없는 유령이 생깁니다. */
function teamJoin(tid, sid, role){
  var ex=DB.one('members', function(m){return m.studentId===sid;});
  if(ex) DB.del('members', ex.id);
  DB.add('members', {teamId:tid, studentId:sid, role:role||'팀원'});
  DB.set('students', sid, {teamId:tid});
  return true;
}
function teamLeave(sid){
  var ex=DB.one('members', function(m){return m.studentId===sid;});
  if(ex) DB.del('members', ex.id);
  DB.set('students', sid, {teamId:null});
}
function teamDisband(tid){
  DB.get('submits', function(x){return x.teamId===tid;}).forEach(function(x){ DB.del('submits', x.id); });
  DB.get('topics', function(x){return x.teamId===tid;}).forEach(function(x){ DB.del('topics', x.id); });
  teamMembers(tid).forEach(function(m){ teamLeave(m.st.id); });
  DB.del('teams', tid);
}

/* ==========================================================================
   4-3. 🔴 3주차 조사자료 제출함 — 가주제 하나에 제출함 하나 (2026-08-20 · 8차)
   --------------------------------------------------------------------------
   교수님 지시: "3주차에는 팀 활동으로 팀마다 3개의 가주제에 대한 조사 자료를
   제출해야하는데, 2주차에 정한 주제 3개마다 과제 제출함을 만들어서 제출할 수 있게"

   ▸ 제출함은 2주차 가주제를 그대로 물려받습니다 — 3주차에서 주제를 새로 만들지 않습니다.
   ▸ 세 개를 「따로」 냅니다. 하나라도 빠지면 3/3이 아닙니다.
   ▸ 팀 공동 제출물입니다 — 팀원 누구나 쓰고 고칩니다(만든 사람만이 아닙니다).
   ▸ 🔴 두 팀원이 동시에 쓰면 나중 저장이 앞사람 글을 지웁니다. 그래서 고친 횟수(rev)를
     들고 다니다가, 내가 연 뒤에 남이 고쳤으면 저장을 「멈춥니다」. 조용히 덮어쓰지 않습니다.
   ========================================================================== */
/* 글자 수 하한 — 한 줄짜리 성의 없는 제출은 막되, 빡빡하지 않게.
   50자면 두 문장이면 넘습니다. 800자를 채우라고 하면 폰으로 쓰는 학생이 그 자리에서 포기합니다. */
var SUB_MIN = 50;
function teamTopics(teamId){
  return DB.get('topics', function(x){return x.teamId===teamId && x.kind==='가주제';})
    .sort(function(a,b){return a.no-b.no;});
}
function subRow(teamId, topicId){
  return DB.one('submits', function(x){return x.teamId===teamId && x.topicId===topicId && x.week===3;});
}
function subHasText(r){ return !!(r && String((r.back||'')+(r.need||'')+(r.how||'')+(r.refs||'')).trim()); }
/* 그 팀이 몇 개나 냈는가 — 뱃지·격자표·CSV가 모두 이 하나를 씁니다 */
function subCount(teamId){
  var out={need:0, done:0, temp:0};
  if(!teamId) return out;
  var tps=teamTopics(teamId); out.need=tps.length;
  tps.forEach(function(tp){
    var r=subRow(teamId, tp.id);
    if(r && r.done) out.done++;
    else if(subHasText(r)) out.temp++;
  });
  return out;
}
function subAllDone(teamId){ var c=subCount(teamId); return c.need>0 && c.done>=c.need; }
/* 한 제출함 저장 — 화면과 자체 점검기가 「같은 함수」를 씁니다
   (눈으로 본 것과 검사한 것이 어긋나는 사고를 막습니다) */
function subSave(teamId, topicId, data, wantDone, byName, seenRev){
  if(!teamId) return {msg:'팀이 없습니다. 2주차에서 팀을 먼저 만들어 주세요.'};
  var hit = teamTopics(teamId).filter(function(x){return x.id===topicId;});
  if(!hit.length) return {msg:'그 가주제를 찾지 못했습니다. 2주차를 먼저 확인해 주세요.'};
  /* 마감 뒤에는 학생 저장을 함수 단에서도 막습니다 (화면만 감추면 뚫립니다) */
  if(!canFix(3) && !isProf()) return {msg:FIX_LOCKED};
  var r = subRow(teamId, topicId);
  /* 🔴 동시 수정 — 내가 연 뒤에 남이 고쳤으면 덮어쓰지 않고 멈춥니다 */
  if(r && seenRev!==undefined && seenRev!==null && (r.rev||0)!==seenRev)
    return {stale:true, msg:subActor(r)+'이 방금 고쳤습니다. 새로 고침 후 다시 써 주세요.'};
  if(wantDone){ var bad=subBad(data); if(bad) return {msg:bad}; }
  var patch = {back:String(data.back||'').trim(), need:String(data.need||'').trim(),
               how:String(data.how||'').trim(), refs:String(data.refs||'').trim(),
               by:byName||'-', byProf:isProf(), at:nowStr(), rev:(r? (r.rev||0)+1 : 1)};
  if(wantDone){ patch.done=true; patch.doneBy=byName||'-'; patch.doneProf=isProf(); patch.doneAt=nowStr(); }
  if(r) DB.set('submits', r.id, patch);
  else {
    patch.teamId=teamId; patch.topicId=topicId; patch.week=3;
    if(!patch.done){ patch.done=false; patch.doneBy=''; patch.doneAt=''; }
    DB.add('submits', patch);
  }
  return {ok:true, row:subRow(teamId, topicId)};
}
/* 「학생29 학생」·「곽호석 교수님」 — 누가 고쳤는지 사람 말로. 이름만 붙이면 조사가 틀립니다 */
function subActor(r){ if(!r||!r.by) return '다른 팀원'; return r.by + (r.byProf? ' 교수님':' 학생'); }

function wrow(n){ return DB.one('weeks', function(w){return w.n===n;}); }

function curWeek(){
  var best=1;
  WEEKDEF.forEach(function(w){ if(dayDiff(w.date, protoToday())>=0) best=w.n; });

/* ==========================================================================
   5-2. ✏️ 「낸 것을 다시 고칠 수 있는가」 — 앱 전체가 같은 말·같은 모양을 씁니다
   --------------------------------------------------------------------------
   🔴 2026-08-20 (9차) 교수님 지적: "수정사항이 발생하면 다시 저장하면 되는거야??
      수정 버튼이 있어야 할 것 같은데"
      기능은 이미 있었습니다 — 「보기·고치기」가 그것이었습니다. 그런데 교수님이
      못 알아보셨습니다. ⚠️ 교수님이 못 찾으신 것을 학생 75명이 찾을 리 없습니다.

   그래서 앱 전체를 한 기준으로 못박습니다.
     ▸ 말   : 「수정하기」 — 고치기·편집·변경 같은 말을 섞어 쓰지 않습니다
     ▸ 모양 : 채워진 파랑 버튼(.btn.fix) — 테두리만 있는 버튼은 안내문처럼 보입니다
     ▸ 옆에 : 「언제까지 고칠 수 있는지」 한 줄
     ▸ 고칠 수 없는 곳은 버튼을 「없애고」 왜 못 고치는지 한 줄 —
       눌리지 않는 버튼을 남겨 두면 학생이 계속 누르고, 결국 교수님께 전화합니다.
   ========================================================================== */
var FIX_LOCKED = '마감되어 학생은 고칠 수 없습니다. 담당교수님께 말씀하세요.';
function dueLabel(n){ var w=wrow(n); if(!w||!w.due) return ''; var p=String(w.due).split(' '); return mdw(p[0])+' '+(p[1]||''); }
function canFix(n){ return wState(n)!=='마감'; }
/* 화면 위쪽에 놓는 안내 */
function fixNote(n){
  return canFix(n)
    ? '<div class="note g">✏️ <b>낸 뒤에도 마감('+esc(dueLabel(n))+') 전까지 몇 번이든 고쳐 낼 수 있습니다.</b> [수정하기]를 누르세요.</div>'
    : '<div class="note">⬛ <b>'+FIX_LOCKED+'</b></div>';
}
/* 낸 칸 바로 밑에 붙이는 작은 줄 */
function fixLine(n){
  return '<div class="muted">'+(canFix(n)
    ? '마감('+esc(dueLabel(n))+') 전까지 몇 번이든 고쳐 낼 수 있습니다'
    : FIX_LOCKED)+'</div>';
}
/* 수정 버튼 — 앱 전체가 이 함수 하나로 그립니다 */
function fixBtn(onclick, label, small){
  return '<button class="btn fix'+(small?' sm':'')+'" onclick="'+onclick+'">✏️ '+(label||'수정하기')+'</button>';
}
/* 주차 화면 아래쪽 「제출/수정」 한 줄 — 6·7·9·10·12주차가 전부 이것을 씁니다 */
function submitBar(n, has, onclick){
  if(!canFix(n)) return '<div class="note" style="margin-top:10px">⬛ <b>'+FIX_LOCKED+'</b></div>';
  return '<div class="btnrow" style="margin-top:10px">'+
    (has? fixBtn(onclick, '수정하기') : '<button class="btn pri" onclick="'+onclick+'">제출하기</button>')+
    '</div>'+fixLine(n);
}

/* 학생 뱃지 — 「내가 낼 것이 있는가」 */
function studentBadge(n){
  var def=wdef(n), w=wrow(n);
  if(def.kind==='notice') return {t:'▫️ 안내만', c:'gray'};
  /* 🔴 16주차 「최종결과」 — 낼 것이 없는 결과 확인 주차. 공개 여부로 뱃지를 나눕니다 */
  if(def.kind==='result'){
    if(w.state==='닫힘') return {t:'🔒 잠김', c:'gray'};
    return discloseGet(SESS.me?SESS.me.classId:myClass(),'result')
      ? {t:'📄 결과 공개', c:'green'} : {t:'▫️ 결과 대기', c:'gray'};
  }
  if(w.state==='닫힘') return {t:'🔒 잠김', c:'gray'};
  var done = hasSubmitted(SESS.me, n);
  /* 🔴 3주차는 제출함이 3개라 「냈다/안 냈다」 둘로 나뉘지 않습니다 — 1/3·2/3을 그대로 보여 줍니다.
     하나만 내고 다 낸 줄 아는 것이 이 주차에서 가장 흔한 사고입니다. */
  var part = (def.kind==='research' && SESS.me) ? subCount(SESS.me.teamId) : null;
  if(w.state==='마감') return done? {t:'✅ 제출 완료',c:'green'}
    : (part && part.done>0 ? {t:'⬛ 마감 '+part.done+'/'+part.need,c:'gray'} : {t:'⬛ 마감됨',c:'gray'});
  /* 🔴 17차 — 「튜터링을 확인했는가」로 학생 뱃지를 흔들지 않습니다. 학생은 튜터링을 보지 않습니다. */
  if(done) return {t:'✅ 제출 완료',c:'green'};
  if(part && part.done>0) return {t:'○ '+part.done+'/'+part.need, c:'amber'};
  if(n===curWeek()) return {t:'○ 오늘까지',c:'amber'};
  return {t:'🔴 해야 함', c:'red'};
}
/* 교수 뱃지 — 「내 강좌가 얼마나 냈는가」 */
function profBadge(n){
  var def=wdef(n), w=wrow(n);
  if(def.kind==='notice') return {t:'▫️ 안내만',c:'gray'};
  if(def.kind==='result') return {t:'▫️ 결과 공개',c:'gray'};
  if(w.state==='닫힘') return {t:'🔒 닫힘',c:'gray'};
  var cids = visibleClasses();
  /* 🔴 3주차는 「학생 몇 명」이 아니라 「몇 팀이 3개를 다 냈나」로 셉니다 — 제출물이 팀 것이므로 */
  if(def.kind==='research'){
    var ts = DB.get('teams', function(t){return cids.indexOf(t.classId)>=0;});
    var full = ts.filter(function(t){return subAllDone(t.id);}).length;
    if(w.state==='마감') return {t:'⬛ 마감 '+full+'/'+ts.length+'팀', c:'gray'};
    if(ts.length && full===ts.length) return {t:'✅ 전원 완료', c:'green'};
    return {t:'🟢 열림 '+full+'/'+ts.length+'팀', c:'green'};
  }
  var ss = DB.get('students', function(s){return s.active!==false && cids.indexOf(s.classId)>=0;});
  var done=0; ss.forEach(function(s){ if(hasSubmitted(s,n)) done++; });
  if(w.state==='마감') return {t:'⬛ 마감 '+done+'/'+ss.length, c:'gray'};
  if(done===ss.length && ss.length) return {t:'✅ 전원 완료',c:'green'};
  /* 🔴 아직 아무도 앱에 들어오지 않았으면 「미제출」은 당연한 상태입니다.
     첫 수업 아침에 「⚠️ 미제출 25명」이 뜨면 잘못된 줄 아십니다. */
  if(!cids.some(loginStarted)) return {t:'🟢 열림 '+done+'/'+ss.length, c:'green'};
  if(n===curWeek() && ss.length-done>0) return {t:'⚠️ 미제출 '+(ss.length-done)+'명',c:'amber'};
  return {t:'🟢 열림 '+done+'/'+ss.length, c:'green'};
}

/* 그 학생이 그 주차에 낼 것을 냈는가 */
function hasSubmitted(st, n){
  if(!st) return false;
  var def=wdef(n);
  if(def.kind==='notice') return true;
  if(def.kind==='result') return true;   /* 낼 것이 없는 결과 확인 주차 — 「미제출」로 세지 않습니다 */
  if(def.kind==='survey'){
    var sv=DB.one('surveys',function(s){return s.kind==='사전';});
    return !!DB.one('answers', function(a){return a.surveyId===sv.id && a.studentId===st.id;});
  }
  if(def.kind==='final'){
    var sv2=DB.one('surveys',function(s){return s.kind==='최종';});
    return !!DB.one('answers', function(a){return a.surveyId===sv2.id && a.studentId===st.id;});
  }
  if(def.kind==='eval'){
    return !!DB.one('peerTeam', function(p){return p.round===def.round && p.evaluator===st.id;});
  }
  if(def.kind==='team'){
    return !!(st.teamId && DB.one('topics', function(t){return t.teamId===st.teamId && t.kind==='가주제';}));
  }
  /* 🔴 3주차 — 가주제 3개를 「전부」 내야 완료입니다 (8차) */
  if(def.kind==='research'){ return subAllDone(st.teamId); }
  if(def.kind==='finaltopic'){
    return !!DB.one('topics', function(t){return t.teamId===st.teamId && t.kind==='최종';});
  }
  return !!DB.one('activity', function(a){return a.teamId===st.teamId && a.week===n;});
}

var VIEW = { name:'login', p:{} };

/* --------------------------------------------------------------------------
   ⬅️ 뒤로가기 (2026-08-22 · 16차)
   🔴 교수님 지적(원문): "화면에서 다시 전으로 뒤로가기 버튼이 있으면 좋겠어"
   ▸ 「무조건 홈」이 아니라 **직전에 있던 화면**으로 돌아갑니다.
   ▸ 브라우저의 뒤로가기 버튼도 같이 듣습니다 — 폰에서는 그쪽을 습관적으로 누르십니다.
     그래서 화면을 옮길 때마다 브라우저 이력에도 한 칸 쌓아 두고(pushState),
     브라우저가 뒤로 가면(popstate) 우리 발자국도 한 칸 물러납니다.
   ▸ 첫 화면(로그인·홈)에서는 버튼을 숨깁니다 — 눌러도 갈 곳이 없으면 안 되므로.
   -------------------------------------------------------------------------- */
var NAVSTACK = [];          /* 지나온 화면 발자국 */
var NAV_MAX  = 60;          /* 무한정 쌓지 않습니다 */
function navSame(a, b){ return a && b && a.name===b.name && JSON.stringify(a.p||{})===JSON.stringify(b.p||{}); }
function navPush(){ try{ history.pushState({bio:NAVSTACK.length}, ''); }catch(e){} }

function go(name, p){
  var next={name:name, p:p||{}};
  if(VIEW.name && VIEW.name!=='login' && !navSame(VIEW, next)){
    NAVSTACK.push({name:VIEW.name, p:VIEW.p});
    if(NAVSTACK.length>NAV_MAX) NAVSTACK.shift();
    navPush();
  }
  VIEW=next; window.scrollTo(0,0); render();
}

/* 뒤로 갈 곳이 있는가 — 홈·로그인에서는 버튼을 그리지 않습니다 */
function canBack(){ return NAVSTACK.length>0 && VIEW.name!=='login' && VIEW.name!=='home'; }

/* 우리 [← 뒤로] 버튼도 브라우저 이력을 통해 물러납니다 (둘이 어긋나지 않게) */
function goBack(){
  if(!NAVSTACK.length){ go('home'); return; }
  var moved=false;
  try{ if(history.state && history.state.bio!==undefined){ history.back(); moved=true; } }catch(e){}
  if(!moved) navPop();
}
/* 실제로 한 칸 물러나는 곳 — 브라우저 뒤로가기(popstate)도 여기로 들어옵니다 */
function navPop(){
  if(!NAVSTACK.length){ if(VIEW.name!=='home'){ VIEW={name:'home',p:{}}; window.scrollTo(0,0); render(); } return; }
  var v=NAVSTACK.pop();
  VIEW={name:v.name, p:v.p||{}}; window.scrollTo(0,0); render();
}
try{ window.addEventListener('popstate', function(){ navPop(); }); }catch(e){}

/* 화면 맨 아래 이동 줄 — 스크롤이 긴 관리 화면에서 위로 다시 올라가지 않으시도록 */

  return '<div class="pager noprint">'+
    (canBack()? '<button class="btn" onclick="goBack()">← 뒤로</button>' : '')+

}

function pickRole(r){ loginRole=r; loginErr=''; try{localStorage.setItem('bio_role',r);}catch(e){} render(); }

/* 로그인 실패 안내 — ⛔ 어느 쪽이 틀렸는지는 알려주지 않습니다 (기존 규칙) */
var FAIL_STU = '<b>등록된 수강생이 아닙니다. 담당교수님께 문의하세요.</b><br>'+
  '<span class="muted">수강 정정으로 명단에 없으실 수 있습니다. 담당교수님께 말씀하시면 바로 추가됩니다.</span>';
var FAIL_PROF = '<b>이름 또는 교번이 올바르지 않습니다.</b>';

function doLogin(){
  var nm=val('inName'), no=val('inNum');
  if(!nm || !no){ toast('이름과 '+(loginRole==='student'?'학번':'교번')+'을 넣어 주세요.'); return; }
  if(loginRole==='prof'){
    var p = DB.one('accounts', function(a){return a.role!=='student' && normName(a.name)===normName(nm) && a.num===no;});
    if(!p){ loginErr=FAIL_PROF; render(); return; }
    loginErr='';
    SESS.acc=p; SESS.role=p.role; SESS.me=null; SESS.scope='mine'; saveSess();
    DB.add('access',{who:p.name,when:nowStr(),kind:'로그인',dev:navigator.userAgent.slice(0,40)});
    go('home'); return;
  }
  /* 학생 — 출석부로 미리 등록된 사람만. 없으면 만들지 않고 거부합니다.
     ⚠️ 이름은 공백 차이를 무시하고 맞춥니다 (「홍 길동」 = 「홍길동」) */
  var st = DB.one('students', function(x){
    return x.active!==false && normName(x.name)===normName(nm) && x.no===no; });
  if(!st){ loginErr=FAIL_STU; render(); return; }
  var acc = DB.one('accounts', st.accountId);
  if(!acc || acc.active===false){ loginErr=FAIL_STU; render(); return; }
  loginErr='';
  DB.set('students', st.id, {lastLoginAt: nowStr()});   /* 「아직 로그인 안 함」이 여기서 풀립니다 */
  SESS.acc=acc; SESS.role='student'; SESS.me=DB.one('students', st.id); SESS.scope='mine'; saveSess();
  DB.add('access',{who:acc.name,when:nowStr(),kind:'로그인',dev:navigator.userAgent.slice(0,40)});
  go('home');
}

   -------------------------------------------------------------------------- */
function topbar(sub){
  var a=SESS.acc; if(!a) return '';
  var line = '';
  if(SESS.role==='student'){
    var t=teamOf(SESS.me);
    line = clsFull(SESS.me.classId)+' · '+(t? (t.no+'팀 「'+t.name+'」')
        : (teamPending(SESS.me.classId)? '팀은 2주차에 정해집니다' : '아직 팀 없음'));
  }else{
    line = (SESS.role==='super'?'슈퍼 관리자 · ':'🟢 교수 · ')+myClass()+' 강좌 담당';
  }
  var seg = isProf() ?
    '<span class="seg"><button class="'+(SESS.scope==='mine'?'on':'')+'" onclick="APP.scope(\'mine\')">내 강좌</button>'+
    '<button class="'+(SESS.scope==='all'?'on':'')+'" onclick="APP.scope(\'all\')">전체</button></span>' : '';
  /* ⬅️ 뒤로가기 — 상단바 맨 왼쪽. 첫 화면(홈·로그인)에서는 그리지 않습니다 (16차) */
  var back = canBack()? '<button class="btn sm" onclick="goBack()">← 뒤로</button>' : '';
  return '<div class="topbar '+(SESS.scope==='all'?'scopebar':'')+'">'+
    back + '<span class="ttl">바이오기초설계</span><span class="sp"></span>'+ seg +
    '<button class="btn sm" onclick="go(\'home\')">홈</button>'+
    '<button class="btn sm" onclick="APP.logout()">'+esc(a.name)+' ▾</button>'+
    '<span class="sub">'+esc(line)+(sub?' · '+esc(sub):'')+
    (SESS.scope==='all'?' &nbsp;<b>[전체 보기 — 다른 강좌는 조회만]</b>':'')+'</span></div>';
}

function weekGrid(){
  var cur=curWeek();
  return '<div class="wgrid">'+ WEEKDEF.map(function(d){
    var b = SESS.role==='student' ? studentBadge(d.n) : profBadge(d.n);
    var cls = 'wbtn' + (d.n<cur?' past':'') + (d.n===cur?' now':'');
    /* 날짜는 WEEKDEF 의 계산값(d.date)을 씁니다 — 표(weeks)에는 없을 수 있습니다(원격) */
    return '<button class="'+cls+'" onclick="go(\'week\',{n:'+d.n+'})">'+
      '<span class="w1">'+d.n+'주차</span>'+
      '<span class="w2">'+esc(d.title)+'</span>'+
      '<span class="w3">'+mdw(d.date)+'</span>'+
      '<span class="w4"><span class="bg '+b.c+'">'+b.t+'</span></span></button>';
  }).join('')+'</div>';

/* ===== 학생 · 주차별 ===== */
function weekStudent(n, def){
  switch(def.kind){
    /* 🚌 11주차(현장견학)만 견학 의견 기록을 안내문 아래에 붙입니다 (8주차 중간고사는 안내만)
       📢 8주차에는 「2회차(7주차) 발표평가 결과」를 공개 시 아래에 붙입니다 (R9) */
    case 'notice':    return stNotice(n) + (n===11? stExcursion(n) : '') +
                             (n===8? stRoundResultCard(2,'r2') : '');
    case 'survey':    return stSurvey(n, '사전');
    /* 15주차 — 최종설문 아래에 「3회차 발표평가 결과」 + 「본인 기말고사」를 공개 시 붙입니다 (R9) */
    case 'final':     return stNotice(n) + stRoundResultCard(3,'r3') +
                             stExamCard('fin','기말고사',15) + stSurvey(n, '최종');
    case 'team':      return stTeam(n);
    /* 🔴 17차 — 교수 튜터링 기록은 학생 화면에 「어디에도」 나오지 않습니다.
       교수님 지시: "학생들은 튜터링 내용이 현재 보이나? 굳이 보일필요는 없을 것 같아."
       ⛔ 빈 상자를 남기지 않습니다 — 구역 자체를 없앴습니다.
          학생의 3주차는 「조사 자료 제출함 3개」만 있으면 됩니다. */
    case 'research':  return stResearch(n);
    /* 5주차 — 최종주제 화면 아래에 「1회차(4주차) 발표평가 결과」를 공개 시 붙입니다 (R9) */
    case 'finaltopic':return stFinalTopic(n) + stRoundResultCard(1,'r1');
    case 'video':     return stVideo(n);
    /* 9주차 — 본인 중간고사 점수를 공개 시 붙입니다 (R9) */
    case 'activity':  return stActivity(n, def) + (n===9? stExamCard('mid','중간고사',9) : '');
    case 'prep':      return stPrep(n);
    case 'eval':      return stEval(n, def);
    /* 16주차 — 최종결과(본인 6분야+총합) (R9) */
    case 'result':    return stFinalResult();
  }
  return '';
}

/* 1·15주 설문 화면은 pS_surveyui.js 로 옮겼습니다 (2026-08-21 11차) */

/* ==========================================================================
   📝 설문 화면 (1주차 사전 · 15주차 최종) — 2026-08-21 · 11차
   --------------------------------------------------------------------------
   🔴 교수님이 실제 설문지를 주셨습니다. 문항 글자는 `pR_survey.js`(원본 docx에서
      자동 생성)에 그대로 들어 있고, 이 파일은 「그리는 일」만 합니다.
   ⛔ 문항을 다듬거나 더하거나 빼지 않습니다.
   ▸ 절(Ⅰ~Ⅵ) 단위로 한 쪽씩 넘깁니다 — 23문항을 한 화면에 쏟으면 폰에서 못 씁니다.
   ▸ 임시 저장은 브라우저에 남습니다(제출 전까지). 제출 후에는 고칠 수 없습니다.
   ========================================================================== */
var svPage = 0;        /* 지금 보고 있는 절 */
var svDraft = {};      /* 답 — 열쇠: qId / qId+'#b'(② 수강 전의 나) / qId+'@'+보기번호(직접 입력) */
var svOn = null;       /* 지금 열어 둔 설문 id (설문이 바뀌면 임시저장을 다시 읽습니다) */
var svMiss = [];       /* 제출을 막은 미응답 목록 */

/* ---- 임시 저장 ---- */
function svDraftRow(svId){
  return DB.one('sdraft', function(x){return x.surveyId===svId && x.studentId===SESS.me.id;});
}
function svLoad(svId){
  if(svOn===svId) return;
  svOn=svId; svPage=0; svMiss=[];
  var r=svDraftRow(svId);
  svDraft = r? JSON.parse(JSON.stringify(r.vals||{})) : {};
}
function svSaveDraft(svId, quiet){
  svReadText();
  var r=svDraftRow(svId);
  if(r) DB.set('sdraft', r.id, {vals:svDraft, at:nowStr()});
  else DB.add('sdraft', {surveyId:svId, studentId:SESS.me.id, vals:svDraft, at:nowStr()});
  if(!quiet) toast('임시 저장했습니다. 나중에 이어서 하셔도 됩니다.');
}
/* 글자 칸은 눌러서 저장되는 것이 아니라 「지금 화면에 있는 값」을 걷어 옵니다 */
function svReadText(){
  var es=document.querySelectorAll('[id^=svt_]');
  for(var i=0;i<es.length;i++) svDraft[es[i].id.slice(4)] = es[i].value.trim();
}
function svSet(key, v){ svReadText(); svDraft[key]=v; render(); }
function svToggle(key, v){
  svReadText();
  var cur = svDraft[key]? String(svDraft[key]).split(' / ') : [];
  var i = cur.indexOf(v);
  if(i>=0) cur.splice(i,1); else cur.push(v);
  svDraft[key] = cur.join(' / ');
  render();
}
function svHas(key, v){
  var cur = svDraft[key]? String(svDraft[key]).split(' / ') : [];
  return cur.indexOf(v)>=0;
}

/* ---- 문항 목록 ---- */
function svQs(svId){ return DB.get('questions', function(q){return q.surveyId===svId;}).sort(function(a,b){return a.order-b.order;}); }
function svSects(sv){ return sv.sections||[]; }
/* 그 문항의 이름표 — 미응답 안내에 씁니다 (「3번」 / 「1번 ② 수강 전의 나」) */
function svLabel(q, second){
  var base = q.no? q.no+'번' : '자유 의견';
  if(second && q.dual) base += ' '+q.dual[1];
  else if(q.dual) base += ' '+q.dual[0];
  return base;
}
/* 아직 답하지 않은 것 — 주관식·기타·자유의견은 선택이라 세지 않습니다 */
function svMissing(svId){
  var out=[];
  svQs(svId).forEach(function(q){
    if(!q.req) return;
    if(!svDraft[q.id]) out.push(svLabel(q,false));
    if(q.dual && !svDraft[q.id+'#b']) out.push(svLabel(q,true));
  });
  return out;
}
function svAnswered(svId){
  var n=0, tot=0;
  svQs(svId).forEach(function(q){
    if(!q.req) return;
    tot++; if(svDraft[q.id]) n++;
    if(q.dual){ tot++; if(svDraft[q.id+'#b']) n++; }
  });
  return {n:n, tot:tot};
}

/* ==========================================================================
   학생 화면
   ========================================================================== */
function stSurvey(n, kind){
  var sv = DB.one('surveys', function(s){return s.kind===kind;});
  if(!sv) return '<div class="card"><div class="note a">설문이 준비되지 않았습니다.</div></div>';
  var mine = DB.get('answers', function(a){return a.surveyId===sv.id && a.studentId===SESS.me.id;});
  var cs = DB.one('consents', function(c){return c.no===SESS.me.no;});

  var h = '<div class="card"><h3>① 수강 동의 <span class="muted">(필수)</span></h3>'+
    '<div class="chk"><input type="checkbox" '+(cs&&cs.ok?'checked':'')+' onchange="setConsent(this.checked)">'+
    '<span>개인정보 수집·이용에 동의합니다 <span class="muted">— 동의하지 않으면 설문을 시작할 수 없습니다</span></span></div>'+
    '<p class="muted">⚠️ 동의 문구는 교내 심의 결과가 나온 뒤 확정됩니다.</p></div>';

  /* ── 이미 낸 경우 — 제출 후에는 고칠 수 없습니다 (1-6절) ── */
  if(mine.length){
    h += '<div class="card"><h3>② '+esc(sv.title)+' <span class="bg green">✅ 제출 완료</span></h3>'+
      '<div class="note">🔒 <b>설문은 한 번 제출하면 고칠 수 없습니다.</b> 내가 답한 내용만 아래에 보여 드립니다.</div>';
    svSects(sv).forEach(function(sec){
      var qs = svQs(sv.id).filter(function(q){return q.sect===sec.t;});
      if(sec.basic){ h += '<div class="hr"></div><b>'+esc(sec.t)+'</b><div>'+esc(sn(SESS.me))+'</div>'; return; }
      h += '<div class="hr"></div><b>'+esc(sec.t)+'</b>';
      qs.forEach(function(q){
        var a  = mine.filter(function(x){return x.qId===q.id && x.part!=='수강전';})[0];
        var b2 = mine.filter(function(x){return x.qId===q.id && x.part==='수강전';})[0];
        h += '<div style="margin-top:6px">'+svHead(q)+
          '<div>→ '+esc(svShow(q, a? a.val:''))+ (q.dual? ' <span class="muted">('+esc(q.dual[0])+')</span>':'')+'</div>'+
          (q.dual? '<div>→ '+esc(svShow(q, b2? b2.val:''))+' <span class="muted">('+esc(q.dual[1])+')</span></div>':'')+'</div>';
      });
    });
    return h + '<p class="muted" style="margin-top:10px">'+esc(sv.outro||'')+'</p></div>';
  }

  if(!(cs&&cs.ok)) return h + '<div class="card"><h3>② '+esc(sv.title)+'</h3>'+
    '<div class="note a">동의를 하셔야 설문이 시작됩니다.</div></div>';

  svLoad(sv.id);
  var secs = svSects(sv), pg = Math.min(svPage, secs.length-1), sec = secs[pg];
  var qs = svQs(sv.id).filter(function(q){return q.sect===sec.t;});
  var pr = svAnswered(sv.id);

  h += '<div class="card"><h3>② '+esc(sv.title)+'</h3>'+
    '<div class="note b">'+(sv.intro||[]).map(function(x){return esc(x);}).join('<br>')+'</div>'+
    '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'+
      '<b>'+esc(sec.t)+'</b><span style="flex:1"></span>'+
      '<span class="bg '+(pr.n>=pr.tot?'green':'gray')+'">응답 '+pr.n+'/'+pr.tot+'</span>'+
      '<span class="muted">'+(pg+1)+' / '+secs.length+' 쪽</span></div>';

  if(svMiss.length) h += '<div class="note r" style="margin-top:8px">⛔ <b>아직 답하지 않은 것이 '+svMiss.length+'개 있습니다.</b><br>'+
    esc(svMiss.slice(0,12).join(' · '))+(svMiss.length>12? ' …':'')+'<br>'+
    '<span class="muted">위 쪽수를 눌러 옮겨 다니며 채워 주세요. 주관식·기타·자유 의견은 비워 두셔도 됩니다.</span></div>';

  (sec.notes||[]).forEach(function(x){ h += '<div class="note a" style="margin-top:8px">'+esc(x)+'</div>'; });

  if(sec.basic){
    /* 🔴 입력칸을 만들지 않습니다 — 로그인한 학생의 이름·학번을 그대로 보여 줍니다 */
    h += '<div class="kv" style="margin-top:8px"><span class="k">학번</span><span><b>'+esc(SESS.me.no)+'</b></span>'+
      '<span class="k">이름</span><span><b>'+esc(SESS.me.name)+'</b></span></div>'+
      '<p class="muted">로그인한 정보로 자동으로 채워집니다 — 따로 적으실 것이 없습니다.</p>';
  }else{
    qs.forEach(function(q){ h += svQ(q); });
  }

  h += '<div class="pager" style="margin-top:12px">'+
      (pg>0? '<button class="btn" onclick="svGo('+(pg-1)+')">← 이전</button>':'<span style="flex:1"></span>')+
      '<button class="btn" onclick="svSaveDraft(\''+sv.id+'\')">💾 임시 저장</button>'+
      (pg<secs.length-1? '<button class="btn pri" onclick="svGo('+(pg+1)+')">다음 →</button>'
                       : '<button class="btn pri" onclick="svSubmit(\''+sv.id+'\')">제출하기</button>')+
    '</div>'+
    '<div class="btnrow" style="margin-top:6px">'+secs.map(function(s2,i){
      return '<button class="btn sm '+(i===pg?'pri':'')+'" onclick="svGo('+i+')">'+(i+1)+'</button>'; }).join('')+'</div>'+
    '<p class="muted">💾 <b>임시 저장</b>을 누르면 이 브라우저에 남습니다 — 23문항이라 한 번에 못 하셔도 됩니다.<br>'+
    '🔒 <b>제출은 한 번만</b> 할 수 있고, 제출 후에는 고칠 수 없습니다.</p></div>';
  return h;
}
function svGo(i){ svReadText(); svSaveDraft(svOn, true); svPage=i; svMiss=[]; window.scrollTo(0,0); render(); }

/* ---- 문항 하나 ---- */
/* 문항 번호를 앞에 붙일지 — 원문에 이미 번호가 있으면 붙이지 않습니다.
   원본 Ⅱ·Ⅳ절 문항은 글 안에 「1. 」이 들어 있고(표의 문항 칸), Ⅲ·Ⅴ절은
   번호가 딴 칸(No)에 있어 글에는 없습니다. 그대로 붙이면 「1. 1. 과제를…」이 됩니다. */
function qNum(q){
  if(!q.no) return '';
  return String(q.text).indexOf(q.no + '.') === 0 ? '' : q.no + '. ';
}
function svHead(q){
  return '<div style="font-weight:700;font-size:17px;line-height:1.6;margin:16px 0 6px">'+
    qNum(q)+esc(q.text).replace(/\n/g,'<br>')+
    (q.req? ' <span class="req">*</span>':' <span class="muted">(선택)</span>')+'</div>';
}
function svQ(q){
  var h = svHead(q);
  if(q.type==='5점'){
    if(q.dual){
      /* 🔴 원본은 11칸짜리 표입니다. 폰에서 표로 만들면 못 씁니다 — 세로로 쌓습니다 */
      h += svScale(q, q.id, q.dual[0]) + svScale(q, q.id+'#b', q.dual[1]);
    }else{
      h += svScale(q, q.id, '');
    }
  }else if(q.type==='단일'){
    h += q.opts.map(function(o,i){
      var on = svDraft[q.id]===o;
      return '<div class="chk" onclick="svSet(\''+q.id+'\',\''+jsq(o)+'\')">'+
        '<input type="radio" '+(on?'checked':'')+' readonly><span>'+esc(o)+'</span></div>'+
        (q.fills[i]&&on? '<input type="text" id="svt_'+q.id+'@'+i+'" placeholder="'+esc(q.fills[i])+'" value="'+esc(svDraft[q.id+'@'+i]||'')+'" style="margin:2px 0 6px">':'');
    }).join('');
  }else if(q.type==='복수'){
    h += q.opts.map(function(o,i){
      var on = svHas(q.id, o);
      return '<div class="chk" onclick="svToggle(\''+q.id+'\',\''+jsq(o)+'\')">'+
        '<input type="checkbox" '+(on?'checked':'')+' readonly><span>'+esc(o)+'</span></div>'+
        (q.fills[i]&&on? '<input type="text" id="svt_'+q.id+'@'+i+'" placeholder="'+esc(q.fills[i])+'" value="'+esc(svDraft[q.id+'@'+i]||'')+'" style="margin:2px 0 6px">':'');
    }).join('')+'<p class="muted">여러 개 고르실 수 있습니다.</p>';
  }else if(q.type==='서술짧'){
    h += '<input type="text" id="svt_'+q.id+'" value="'+esc(svDraft[q.id]||'')+'">';
  }else{
    h += '<textarea id="svt_'+q.id+'" style="min-height:96px">'+esc(svDraft[q.id]||'')+'</textarea>';
  }
  return h;
}
function svScale(q, key, title){
  var v = svDraft[key]||'';
  var lab = q.labels && q.labels.length===5 ? q.labels : ['1','2','3','4','5'];
  var numeric = lab[0]==='1';
  return (title? '<div style="font-weight:700;font-size:14px;margin-top:6px">'+esc(title)+'</div>':'')+
    '<div class="scale">'+[1,2,3,4,5].map(function(i){
      return '<button class="'+(v===String(i)?'on':'')+'" onclick="svSet(\''+key+'\',\''+i+'\')">'+i+'</button>'; }).join('')+'</div>'+
    (numeric? '' :
      '<div class="muted" style="display:flex;justify-content:space-between"><span>'+esc(lab[0])+'</span><span>'+esc(lab[4])+'</span></div>')+
    (v? '<div class="muted">고름: <b>'+esc(numeric? v+'점' : lab[Number(v)-1])+'</b></div>':'');
}
/* 저장된 값을 사람 말로 (5점은 숫자로 남기고 라벨을 덧붙입니다) */
function svShow(q, v){
  if(!v) return '(무응답)';
  if(q.type==='5점' && q.labels && q.labels.length===5 && q.labels[0]!=='1')
    return v+' ('+q.labels[Number(v)-1]+')';
  return v;
}
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ---- 제출 ---- */
function setConsent(v){
  var cs=DB.one('consents', function(c){return c.no===SESS.me.no;});
  if(cs) DB.set('consents', cs.id, {ok:v, at:nowStr()});
  else DB.add('consents',{no:SESS.me.no, ok:v, at:nowStr(), ver:'v1(초안)'});
  render();
}
function svSubmit(svId){
  svReadText();
  var miss = svMissing(svId);
  if(miss.length){
    svMiss = miss; svSaveDraft(svId, true);
    toast('⛔ 아직 답하지 않은 것이 '+miss.length+'개 있습니다: '+miss.slice(0,3).join(' · ')+(miss.length>3?' …':''));
    render(); return;
  }
  var sv=DB.one('surveys', svId);
  APP.confirm('설문을 제출합니다.\n\n· 제출 후에는 고칠 수 없습니다\n· 응답은 성적에 반영되지 않습니다\n\n진행할까요?', function(){
    svQs(svId).forEach(function(q){
      var extra='';
      (q.fills||[]).forEach(function(f,i){ if(f && svDraft[q.id+'@'+i]) extra += (extra?' / ':'')+f+': '+svDraft[q.id+'@'+i]; });
      var v = svDraft[q.id]||'';
      DB.add('answers',{surveyId:svId, qId:q.id, studentId:SESS.me.id,
        val: v + (extra? ' ('+extra+')':''), part:(q.dual? '현재':''), at:nowStr()});
      if(q.dual) DB.add('answers',{surveyId:svId, qId:q.id, studentId:SESS.me.id,
        val: svDraft[q.id+'#b']||'', part:'수강전', at:nowStr()});
    });
    var dr=svDraftRow(svId); if(dr) DB.del('sdraft', dr.id);
    svDraft={}; svPage=0; svOn=null; svMiss=[];
    toast('설문을 제출했습니다. 수정은 할 수 없습니다.'); render();
  });
}

/* ==========================================================================
   2주차 — 팀 만들기 · 가주제 3개
   --------------------------------------------------------------------------
   🔴 2026-08-20 (7차) 교수님 지시로 「초대코드」 방식을 폐지했습니다.
      "3명 또는 4명 중 한사람이 기존 학생 명단 중에 선택할 수 있도록 하고,
       팀 이름과 의미를 기입하여 저장하면, 나머지 같은 팀원들은 입력하지 않아도
       그 같은 팀에 자동으로 소속되어 보일 수 있도록 ... 초대코드 이런건 하지 말고"

   ▸ 대표 한 명이 팀원을 골라 저장하면 끝입니다. 고른 사람들은 아무것도
     하지 않아도 그 팀에 들어가 있고, 로그인하면 「우리 팀」이 보입니다.
   ▸ 절차를 늘리지 않습니다 — 신고·요청·승인 같은 단계를 새로 만들지 않습니다.
   ========================================================================== */
var teamEditOpen = false;   /* 만든 사람이 [팀 고치기]를 눌렀는가 */
/* 🔴 고르던 것을 잃지 않게 — 저장이 거부돼 화면을 다시 그려도 체크가 그대로 남습니다.
   (거부될 때마다 25명을 처음부터 다시 고르게 하면 학생이 그 자리에서 포기합니다) */
var teamPreset = null;
var teamErr = '';           /* 거부 사유 — 사라지는 토스트 말고 화면에 남겨 둡니다 */

function stTeam(){
  var st = DB.one('students', SESS.me.id) || SESS.me;   /* 방금 바뀐 값을 다시 읽습니다 */
  SESS.me = st;
  var t = teamOf(st);
  if(!t) return stTeamMake(st, null) + stKosac();
  if(teamEditOpen && teamEditable(t, st)) return stTeamMake(st, t) + stKosac();
  return stMyTeam(t, st) + stTopics(t) + stKosac();
}

/* ---- 팀이 이미 있을 때 — 「우리 팀」 화면 ----
   ★ 교수님 요구의 핵심이 여기입니다: 고른 팀원은 아무것도 입력하지 않았는데
      로그인하면 이 화면이 보입니다. 팀 만들기 버튼은 그리지 않습니다. */
function stMyTeam(t, st){
  teamPreset=null; teamErr='';
  var ms = teamMembers(t.id);

  var h = '<div class="card"><h3>[1단계] 우리 팀</h3>';
  if(!mine) h += '<div class="note g">✅ <b>'+esc(mk? mk.name+' 학생':'담당교수님')+'이 우리 팀을 만들었습니다.</b><br>'+
    '따로 넣으실 것은 없습니다 — 이미 이 팀에 들어와 있습니다.</div>';
  h += '<div class="kv">'+
    '<span class="k">팀 이름</span><span><b>'+esc(t.name)+'</b> ('+t.no+'팀)</span>'+
    '<span class="k">이름의 뜻</span><span>'+esc(t.meaning||'-')+'</span>'+
    '<span class="k">팀원 ('+ms.length+'명)</span><span>'+ (ms.length? ms.map(function(m){
        return memLabel(t, m.st) + (m.st.id===st.id? ' <span class="muted">← 나</span>':'');
      }).join('<br>') : '<span class="muted">없음</span>') +'</span>'+
    '<span class="k">만든 때</span><span class="muted">'+esc(t.at||'-')+'</span></div>'+
    (ms.length<3? '<div class="note a">⚠️ 팀원이 3명 이상이어야 가주제를 낼 수 있습니다</div>':'')+
    (t.ok? '<div class="note g">✅ 교수 승인 완료 — 승인 후에는 팀을 바꿀 수 없습니다</div>':'');
  if(teamEditable(t, st))
    h += '<div class="btnrow" style="margin-top:8px">'+
      fixBtn('teamOpenEdit()','팀 수정하기')+
      '<button class="btn dan" onclick="stTeamDisband(\''+t.id+'\')">팀 해체</button></div>'+
      '<div class="muted">팀 이름·이름의 뜻·팀원을 <b>교수 승인 전까지</b> 몇 번이든 수정할 수 있습니다.</div>'+
      '<p class="muted">※ 수정·해체는 <b>팀을 만든 사람</b>만 할 수 있습니다.</p>';
  else
    /* 🔴 9차 — 못 고치는 곳에는 버튼을 두지 않고 「왜 못 고치는지」를 적습니다 */
    h += '<div class="muted">'+(
        t.ok ? '✅ <b>교수 승인이 끝나 수정할 수 없습니다.</b> 바꿀 것이 있으면 담당교수님께 말씀하세요.'
      : (wState(2)==='마감' ? '⬛ <b>2주차가 마감되어 수정할 수 없습니다.</b> 담당교수님께 말씀하세요.'
      : '이 팀을 <b>만든 사람</b>만 수정할 수 있습니다. 바꿀 것이 있으면 만든 사람이나 담당교수님께 말씀하세요.'))+'</div>';
