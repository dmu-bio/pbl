  for(var i=0;i<rows.length;i++) for(var j=0;j<rows[i].length;j++){
    var v=String(rows[i][j]);
    if(v.indexOf('교번')>=0) return true;
    for(var k=0;k<nums.length;k++) if(v===nums[k]) return true;
  }
  return false;
}

/* ==========================================================================
   🧮 점수 산출 — 배점 · 출석/시험 일괄 입력 · 최종 점수 계산 · A4 점수표
   ⛔ 20차 — 등급(A+·A·B)은 매기지 않습니다. 학점 판정은 교수님들 몫입니다.
   (2026-08-23 · 19차)
   --------------------------------------------------------------------------
   🔴 교수님 지시(원문):
      "바이오기초설계는 출석20점, 중간고사 10점, 기말고사 15점, 중간발표평가1 10점,
       중간발표평가2 20점, 최종발표평가 25점으로 설계됐어. 그리고 4, 7, 13-14주차에
       진행되는 발표평가의 경우, 전체 점수의 40%를 교수평가로 전체의 60%를
       학생동료평가 점수로 반영하고자 해. 학생평가의 경우에는 악의적으로 점수를
       주는 것을 제외하기 위해서 학생이 평가한 점수들 중 최고점수와 최저점수
       1개씩을 제외하고 계산에 반영되었으면 좋겠어. 그리고 최종 학생의 점수표를
       출력할 수 있게 해주면 좋겠어. 마찬가지로 A4 1장에 출력되면 좋겠어.
       출석점수는 한번에 입력할 수 있도록 최종점수계산쪽에 출석 입력을 만들어서
       넣을 수 있게 해줘"

   ▸ 배점 6개는 **설정값**입니다(코드에 박지 않았습니다). 합이 100이 아니면 화면이 알립니다.
   ▸ 발표평가 3회는 **교수 40 : 동료 60**. gradeRule 에 강좌마다 있고 세 강좌가 같습니다.
   ▸ 🔴 절사는 **평가자 한 사람의 총점**을 단위로 합니다. 항목 점수 하나하나를 놓고
     자르면 「한 사람의 평가를 통째로 뺀다」는 지시와 달라집니다.
   ▸ 🔴 동료평가 60%는 **팀간 평가만** 셉니다. 팀내 평가는 모으기만 하고 넣지 않습니다.
   ========================================================================== */

/* ---- 배점 (설정값) ---- */
/* short = A4 점수표의 좁은 칸에 쓰는 짧은 이름 · w = 그 칸의 폭(mm)
   🔴 종이에서는 「중간발표평가1」이 13mm 칸에 들어가지 않아 글자가 겹칩니다.
      교수님이 보여 주신 본보기도 「출석 중간 기말 발표1 발표2 최종발표」였습니다. */
var MK_ITEMS = [
  {k:'att', label:'출석',         short:'출석',     w:11, where:'학기 전체',  kind:'input'},
  {k:'mid', label:'중간고사',     short:'중간',     w:11, where:'8주차',     kind:'input', added:true},
  {k:'fin', label:'기말고사',     short:'기말',     w:11, where:'15주차',    kind:'input', added:true},
  {k:'r1',  label:'중간발표평가1', short:'발표1',    w:12, where:'4주차',     kind:'auto', round:1},
  {k:'r2',  label:'중간발표평가2', short:'발표2',    w:12, where:'7주차',     kind:'auto', round:2},
  {k:'r3',  label:'최종발표평가',  short:'최종발표', w:17, where:'13·14주차', kind:'auto', round:3}
];
var MK_DEFAULT = {att:20, mid:10, fin:15, r1:10, r2:20, r3:25};
function MK(){
  var s=DB.d.settings;
  if(!s.marks){ s.marks={}; for(var k in MK_DEFAULT) s.marks[k]=MK_DEFAULT[k]; DB.flush(); }
  return s.marks;
}
function mkSum(){ var m=MK(), s=0; MK_ITEMS.forEach(function(it){ s+=Number(m[it.k])||0; }); return s; }
function mkFullOf(k){ return Number(MK()[k])||0; }
function mkLabel(k){ for(var i=0;i<MK_ITEMS.length;i++) if(MK_ITEMS[i].k===k) return MK_ITEMS[i].label; return k; }
function r1d(x){ return Math.round(x*10)/10; }

/* ==========================================================================
   🔴 절사평균 — 최고 1개·최저 1개를 뺍니다
   --------------------------------------------------------------------------
   ▸ 평가가 **5건 이상일 때만** 자릅니다. 4건에서 둘을 빼면 2건만 남아
     한두 사람이 팀 점수를 통째로 정하게 됩니다 — 악의를 막으려다 더 위험해집니다.
   ▸ 최고·최저가 동점으로 여럿이어도 **각각 1개씩만** 뺍니다(정렬 후 양 끝 하나씩).
   ▸ 계산 과정을 글로 남깁니다 — 이의제기 때 설명할 수 있어야 합니다.
   ========================================================================== */
var TRIM_MIN = 5;
function trimMean(list){
  var n = list.length;
  if(!n) return {n:0, used:0, mean:0, trimmed:false, hi:null, lo:null,
                 why:'받은 평가가 없습니다'};
  var s = list.slice().sort(function(a,b){ return a-b; });
  if(n < TRIM_MIN){
    var m0 = s.reduce(function(a,b){return a+b;},0)/n;
    return {n:n, used:n, mean:m0, trimmed:false, hi:null, lo:null,
            why:'평가 '+n+'건 — 절사 없이 계산 (5건 미만이라 자르지 않습니다) → '+n+'건 평균 '+r1d(m0)+'점'};
  }
  var lo=s[0], hi=s[n-1], body=s.slice(1, n-1);
  var m = body.reduce(function(a,b){return a+b;},0)/body.length;
  return {n:n, used:body.length, mean:m, trimmed:true, hi:hi, lo:lo,
          why:'받은 평가 '+n+'건 → 최고 '+r1d(hi)+'점·최저 '+r1d(lo)+'점 제외 → '+body.length+'건 평균 '+r1d(m)+'점'};
}

/* ---- 동료평가(팀간) 한 회차 — 🔴 평가자 한 사람의 총점을 한 건으로 봅니다 ---- */
function peerScore100(teamId, round){
  var rows = DB.get('peerTeam', function(x){ return x.teamId===teamId && x.round===round; });
  var full = rbFull(round,'inter') || 1;
  var by={}; rows.forEach(function(x){ (by[x.evaluator]=by[x.evaluator]||[]).push(x.score); });
  var list = Object.keys(by).map(function(k){
    return by[k].reduce(function(a,b){return a+b;},0)/full*100; });
  return trimMean(list);
}
/* ---- 교수평가 한 회차 — 채점한 교수들의 평균 (13·14주차는 3명) ---- */
function profRound100(teamId, round){
  var rows = DB.get('profEval', function(x){ return x.round===round && x.teamId===teamId; });
  if(!rows.length) return null;
  var full = rbFull(round,'prof') || 1;
  var by={}; rows.forEach(function(x){ (by[x.profId]=by[x.profId]||[]).push(x.score); });
  var per = Object.keys(by).map(function(k){
    return by[k].reduce(function(a,b){return a+b;},0)/full*100; });
  return {n:per.length, mean: per.reduce(function(a,b){return a+b;},0)/per.length};
}
function evalRule(cid){ return DB.one('gradeRule', function(g){ return g.classId===cid; }); }

/* ---- 회차 발표평가 점수 (100점 만점) = 교수 40% + 동료 60% ---- */
/* ⚡ 같은 팀·회차를 한 화면에서 몇 십 번씩 다시 세지 않도록 잠깐 담아 둡니다.
   저장이 일어나면(DB.flush) 곧바로 버립니다 — 옛 값을 보여 주면 안 됩니다. */
var SC_CACHE = {};
function scCacheClear(){ SC_CACHE = {}; }
function roundScore100(teamId, round){
  var key = teamId+'#'+round;
  if(SC_CACHE[key]) return SC_CACHE[key];
  var t = DB.one('teams', teamId);
  var rule = (t && evalRule(t.classId)) || {profW:40, peerW:60, id:''};
  var p = profRound100(teamId, round);
  var q = peerScore100(teamId, round);
  /* 🔴 has = 한쪽이라도 있다 · done = 교수평가와 동료평가가 둘 다 있다
     한쪽만 있는 회차를 총점에 넣으면 없는 쪽이 0점으로 들어가 실제보다 낮게 나옵니다.
     그래서 **총점에는 done 인 회차만** 넣고, 한쪽만 있는 회차는 화면에 보여 주되
     「아직 덜 찼다」고 적습니다. ⛔ 조용히 0점으로 세지 않습니다. */
  var has = !!p || q.n>0;
  var done = !!p && q.n>0;
  var score = (p? p.mean:0)*rule.profW/100 + (q.n? q.mean:0)*rule.peerW/100;
  return (SC_CACHE[key] = {round:round, prof:p, peer:q, rule:rule, score:score,
          has:has, done:done,
          lack: (!p && !q.n)? '교수평가·동료평가 모두 없음'
              : (!p? '교수평가가 아직 없습니다' : (!q.n? '동료평가가 아직 없습니다' : ''))});
}
/* ---- 팀의 발표평가 3회 (배점으로 가중) — 팀 순위에 씁니다 ---- */
function teamPresent100(teamId){
  var mk=MK(), w=0, got=0, rounds=[], pw=0, pgot=0, qw=0, qgot=0;
  MK_ITEMS.filter(function(it){return it.kind==='auto';}).forEach(function(it){
    var r = roundScore100(teamId, it.round), full = Number(mk[it.k])||0;
    r.full = full; r.label = it.label; r.key = it.k;
    rounds.push(r);
    if(r.done && full>0){
      w += full; got += r.score*full;
      if(r.prof){ pw+=full; pgot+=r.prof.mean*full; }
      if(r.peer.n){ qw+=full; qgot+=r.peer.mean*full; }
    }
  });
  return { score: w? got/w : 0, rounds:rounds, w:w,
           prof: pw? pgot/pw : 0, peer: qw? qgot/qw : 0 };
}

/* ==========================================================================
   출석 · 중간고사 · 기말고사 — 학생 한 명당 한 줄 (marks 표)
   ========================================================================== */
function markRow(sid){ return DB.one('marks', function(m){ return m.studentId===sid; }); }
function markGet(sid, k){
  var r = markRow(sid);
  if(!r) return null;
  var v = r[k];
  return (v===null || v===undefined || v==='') ? null : Number(v);
}
function markSet(sid, k, v){
  var r = markRow(sid), patch={};
  patch[k] = (v===null||v===undefined||v==='') ? null : Number(v);
  if(r) DB.set('marks', r.id, patch);
  else { patch.studentId=sid; patch.att=null; patch.mid=null; patch.fin=null;
         patch[k]=(v===null||v===undefined||v==='')?null:Number(v); DB.add('marks', patch); }
}

/* ---- 학생 한 명의 최종 점수 ---- */
function studentScore(st){
  var mk=MK(), t=teamOf(st), items=[];
  /* ⚖️ 20차 — 팀내 평가 감점. 교수가 [적용]을 누른 학생만 0보다 큽니다.
     🔴 깎는 것은 **동료평가 몫(60%)뿐**이고 교수평가 몫(40%)은 건드리지 않습니다. */
  var pen = intraPenRate(st.id), penRow = intraPenRow(st.id);
  MK_ITEMS.forEach(function(it){
    var full = Number(mk[it.k])||0;
    if(it.kind==='input'){
      var v = markGet(st.id, it.k);
      items.push({k:it.k, label:it.label, where:it.where, full:full,
                  got: v==null? 0 : v, typed: v!=null, kind:'input', added:!!it.added});
    }else{
      var r = t ? roundScore100(t.id, it.round) : null;
      var raw = (r&&r.done)? r.score/100*full : 0;
      var adj = raw;
      if(r && r.done && pen>0){
        var s100 = (r.prof? r.prof.mean:0)*r.rule.profW/100
                 + (r.peer.n? r.peer.mean:0)*r.rule.peerW/100*(1-pen/100);
        adj = s100/100*full;
      }
      items.push({k:it.k, label:it.label, where:it.where, full:full,
                  got: adj, raw: raw, cut: raw-adj, typed: !!(r&&r.done),
                  kind:'auto', round:it.round, detail:r, pen:pen});
    }
  });
  var total = items.reduce(function(a,b){ return a+b.got; }, 0);
  var missing = items.filter(function(i){ return !i.typed; });
  var cut = items.reduce(function(a,b){ return a+(b.cut||0); }, 0);
  return {st:st, team:t, items:items, total:total, missing:missing, full:mkSum(),
          pen:pen, penRow:penRow, cut:cut};
}

/* ==========================================================================
   화면 — 최종 점수 계산  (admin p='final')
   ========================================================================== */
var mkTab   = 'att';      /* 지금 입력 중인 항목 */
var mkDraft = {};         /* {att:{sid:'20'}} — 🔴 타이핑 중에는 화면을 다시 그리지 않습니다 */
var mkMsg   = '';
var mkCid   = null;

function mkClass(){

  return canEdit(myClass())? myClass() : vis[0];
}
function mkGoTab(k){ mkTab=k; mkMsg=''; render(); }
function mkGoCls(c){ mkCid=c; mkMsg=''; render(); }
function mkDraftOf(k, sid){
  var d = mkDraft[k]||{};
  if(sid in d) return d[sid];
  var v = markGet(sid, k);
  return v==null? '' : String(v);
}
function mkType(k, sid, v){ (mkDraft[k]=mkDraft[k]||{})[sid]=v; }
/* 칸을 떠날 때 한 번 다듬습니다 — 만점 초과·음수·숫자 아닌 글자를 여기서 막습니다.
   ⛔ 화면을 다시 그리지 않습니다(타이핑 중에 글자가 튀면 못 씁니다). */
function mkFix(k, sid, el){
  var full = mkFullOf(k), raw = String(el.value).trim();
  if(raw===''){ mkType(k,sid,''); return; }
  var v = Number(raw);
  if(!isFinite(v)){ el.value=''; mkType(k,sid,''); toast('숫자만 넣을 수 있습니다.'); return; }
  if(v<0){ v=0; toast('음수는 넣을 수 없습니다 — 0으로 바꿨습니다.'); }
  if(v>full){ v=full; toast(mkLabel(k)+'는 만점이 '+full+'점입니다 — '+full+'로 바꿨습니다.'); }
  v = Math.round(v*10)/10;
  el.value = String(v); mkType(k,sid,String(v));
}
/* ⌨️ Enter 로 아래 칸으로 — 25명을 손을 떼지 않고 넣으시라고 (Tab 은 브라우저 기본) */
function mkKey(ev, idx){
  if(ev.key!=='Enter' && ev.keyCode!==13) return;
  ev.preventDefault();
  var nx = document.getElementById('mkin_'+(idx+1));
  if(nx){ nx.focus(); if(nx.select) nx.select(); }
  else { var b=document.getElementById('mkSaveBtn'); if(b) b.focus(); }
}
function mkFillAll(k, cid){
  var full = mkFullOf(k);
  APP.confirm(clsFull(cid)+' 학생 전원의 '+mkLabel(k)+'에 만점 '+full+'점을 넣습니다.\n(넣은 뒤 감점할 학생만 고치시면 됩니다.)\n진행할까요?', function(){
    var d = (mkDraft[k]=mkDraft[k]||{});
    liveStudents([cid]).forEach(function(s){ d[s.id]=String(full); });
    mkMsg=''; render(); toast('전원 '+full+'점을 넣었습니다. 아직 저장 전입니다.');
  });
}
function mkClearDraft(k){ delete mkDraft[k]; mkMsg=''; render(); }
function mkSave(k, cid){
  if(!canEdit(cid)){ toast('다른 강좌라 저장할 수 없습니다.'); return; }
  var d = mkDraft[k]||{}, n=0, bad=0, full=mkFullOf(k);
  DB.hold();
  try{
    liveStudents([cid]).forEach(function(s){
      if(!(s.id in d)) return;
      var raw = String(d[s.id]).trim();
      if(raw===''){ if(markGet(s.id,k)!=null){ markSet(s.id,k,null); n++; } return; }
      var v = Number(raw);
      if(!isFinite(v) || v<0 || v>full){ bad++; return; }
      v = Math.round(v*10)/10;
      if(markGet(s.id,k)!==v){ markSet(s.id,k,v); n++; }
    });
  }finally{ DB.release(); }
  delete mkDraft[k];
  DB.log(mkLabel(k)+' 점수 입력', cid+' '+n+'명 저장'+(bad?(' · 범위를 벗어난 '+bad+'명은 저장하지 않음'):''));
  mkMsg = '✅ '+mkLabel(k)+' '+n+'명 저장했습니다 · '+nowStr()+(bad? ' ⚠️ 범위를 벗어난 '+bad+'명은 저장하지 않았습니다':'');
  render();
}
function mkTweak(k, d){
  var m=MK(); m[k]=Math.max(0, Math.min(100, (Number(m[k])||0)+d)); DB.flush();
  DB.log('배점 변경', mkLabel(k)+' → '+m[k]+'점 (합 '+mkSum()+')');
  render();
}
function mkReset(){
  APP.confirm('배점을 교수님이 정해 주신 값으로 되돌립니다.\n출석20 · 중간10 · 기말15 · 발표1 10 · 발표2 20 · 최종발표25\n진행할까요?', function(){
    var m=MK(); for(var k in MK_DEFAULT) m[k]=MK_DEFAULT[k]; DB.flush();
    DB.log('배점 되돌리기','교수님 지시값으로'); render();
  });
}

/* ---- 덜 찬 것 ---- */
function mkGaps(cid){
  var ss = liveStudents([cid]), gaps=[];
  ['att','mid','fin'].forEach(function(k){
    var n = ss.filter(function(s){ return markGet(s.id,k)==null; }).length;
    if(n) gaps.push(mkLabel(k)+' 미입력 '+n+'명');
  });
  var teams = DB.get('teams', function(t){ return t.classId===cid; });
  MK_ITEMS.filter(function(it){return it.kind==='auto';}).forEach(function(it){
    var no = teams.filter(function(t){ return !roundScore100(t.id, it.round).done; }).length;
    if(no) gaps.push(it.label+'('+it.where+') 아직 덜 찬 팀 '+no+'/'+teams.length+'팀');
  });
  [[1,'4주차'],[2,'7주차'],[3,'13·14주차']].forEach(function(r){
    var sub = ss.filter(function(s){ return DB.one('peerTeam', function(p){return p.round===r[0]&&p.evaluator===s.id;}); }).length;
    if(ss.length && sub<ss.length) gaps.push(r[1]+' 동료평가 제출률 '+Math.round(sub/ss.length*100)+'% ('+sub+'/'+ss.length+'명)');
  });
  if(!gaps.length) return '<div class="note g">✅ <b>덜 찬 것이 없습니다.</b> 아래 총점은 모든 항목이 채워진 상태입니다.</div>';
  return '<div class="note r">⚠️ <b>아직 덜 찼습니다 — 아래 총점은 「계산 중」입니다.</b><br>'+
    gaps.map(esc).join('<br>')+'</div>';
}
function mkComplete(cid){
  var ss = liveStudents([cid]);
  if(!ss.length) return false;
  for(var i=0;i<ss.length;i++){ if(studentScore(ss[i]).missing.length) return false; }
  return true;
}

/* ---- 점수 분포 — 교수님들이 학점을 판단하실 때 쓰시라고 (20차) ----
   ⛔ 앱은 여기서 등급을 매기지 않습니다. 「몇 점대에 몇 명인가」만 보여 드립니다. */
function mkSpread(list){
  var full=mkSum();
  var done=list.filter(function(r){ return !r.missing.length; });
  var bins=[[90,101,'90점 이상'],[80,90,'80~89점'],[70,80,'70~79점'],[60,70,'60~69점'],[0,60,'60점 미만']];
  var vals=done.map(function(r){ return r.total; });
  var mx=Math.max(1, Math.max.apply(null, bins.map(function(b){
    return vals.filter(function(v){ return v>=b[0] && v<b[1]; }).length; })));
  return '<div class="card" style="box-shadow:none;border-style:dashed"><h3>점수 분포 <span class="muted">— 판단에 참고하시라고</span></h3>'+
    (done.length
      ? '<div class="scroll"><table><tr><th>구간</th><th class="c">인원</th><th>분포</th></tr>'+
        bins.map(function(b){

/* ==========================================================================
   📢 R9 — 학생 성적 공개 (2026-08-23)
   설계서: _db/SPEC_results_disclosure_R9.md
   --------------------------------------------------------------------------
   ▸ 공개 방식은 「교수 공개 버튼」입니다. 기본은 미공개. 교수가 강좌별·결과별로
     [학생에게 공개하기]를 눌러야 학생 화면에 나타납니다.
   ▸ 공개 여부는 settings.disclose 에 저장합니다 — settings 는 서버로 통째로 동기화되므로
     (p2b_dbremote.js loadAll·flush) 학생 기기에도 그대로 반영됩니다. 새 표를 만들지 않았습니다.
       settings.disclose = { F1:{r1,r2,r3,mid,fin,result}, F2:{...}, F3:{...} }
   ▸ 프라이버시: 팀간 발표평가는 「총합(roundScore100)만 + 순위」, 시험·최종결과는 「본인 것만」.
     교수·동료 세부 점수, 평가자 신원은 어느 학생 화면에도 나오지 않습니다.
   ========================================================================== */
var DISC_KEYS = ['r1','r2','r3','mid','fin','result'];
function discLabel(key){
  return { r1:'1회차 발표평가 결과', r2:'2회차 발표평가 결과', r3:'3회차 발표평가 결과',
           mid:'중간고사 점수', fin:'기말고사 점수', result:'최종 결과' }[key] || key;
}
function discloseAll(){
  var s = DB.d.settings;
  if(!s.disclose || typeof s.disclose!=='object') s.disclose = {};
  return s.disclose;
}
function discloseGet(cid, key){
  var d = discloseAll()[cid];
  return !!(d && d[key]);
}
function discloseSet(cid, key, on){
  var all = discloseAll();
  if(!all[cid] || typeof all[cid]!=='object') all[cid] = {};
  all[cid][key] = !!on;
  DB.flush();                                  /* 🔴 settings 저장 → 서버로도 올라갑니다 */
  DB.log('성적 공개 '+(on?'열기':'닫기'), cid+' · '+discLabel(key));
}
function discToggle(cid, key, on){
  if(!canEdit(cid)){ toast('다른 강좌라 바꿀 수 없습니다.'); return; }
  var want = (on===true || on==='true');
  discloseSet(cid, key, want);
  toast(clsFull(cid)+' '+discLabel(key)+'을(를) '+(want?'학생에게 공개했습니다.':'미공개로 되돌렸습니다.'));
  render();
}

/* ---- 교수 공개 컨트롤 카드 — 강좌마다 한 줄 ---- */
function discloseControlCard(key, label, desc){
  var cids = visibleClasses();
  var h = '<div class="card"><h3>📢 '+esc(label)+' <span class="muted">— 학생 공개</span></h3>'+
    '<p class="muted">'+esc(desc)+'</p>';
  cids.forEach(function(cid){
    var on = discloseGet(cid, key);
    h += '<div class="hr"></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<b>'+esc(clsFull(cid))+'</b>'+
      '<span class="bg '+(on?'green':'gray')+'">'+(on?'✅ 공개됨':'⬜ 미공개')+'</span>'+

/* ==========================================================================
   팀간 발표평가 순위 — 총합(roundScore100)만
   ▸ r1·r2 : 같은 반 안 순위 · r3 : 3개 강좌 합동(joint) 12팀 순위
   ▸ 채점이 다 찬(done) 팀만 순위에 넣습니다. 동점은 같은 등수.
   ========================================================================== */
function roundRanking(round, cids){
  var teams = DB.get('teams', function(t){ return cids.indexOf(t.classId)>=0; });
  var arr = teams.map(function(t){
    var r = roundScore100(t.id, round);
    return { team:t, score:r.score, done:r.done };
  }).filter(function(x){ return x.done; });
  arr.sort(function(a,b){ return b.score - a.score; });
  arr.forEach(function(x,i){
    x.rank = (i>0 && Math.abs(arr[i-1].score - x.score) < 1e-9) ? arr[i-1].rank : (i+1);
  });
  return arr;
}
function discPendingCard(what){

/* ==========================================================================
   ⚖️ 팀내 평가 반영 — 무임승차 감점 (2026-08-23 · 20차)
   --------------------------------------------------------------------------
   🔴 교수님 지시(원문):
      "팀내 평가도 어느 정도의 기준 이하가 되면 그 팀원은 동료평가 점수에서
       감점하는 방안이 필요할 듯해. 어느정도가 나을지 제안해줘.
       기본적으로 팀 등급이 영향을 주는데, 개인 출석이나 팀내평가 점수가 낮으면
       감점되어 학점이 낮아질 수 있음"

   ▸ 🔴 판정은 **절대 점수가 아니라 「우리 팀 평균 대비 상대비」**로 합니다.
        절대 점수로 하면 박한 팀은 전원 감점, 후한 팀은 무임승차자도 통과합니다.
        상대비는 **전원이 서로 만점을 줘도 모두 1.0**이 되어 담합이 무의미해집니다.
   ▸ 🔴 **자동 감점하지 않습니다.** 앱은 「감점 대상」을 알려 주기만 하고
        교수가 학생마다 확인해 [적용]을 눌러야 반영됩니다. 사유도 함께 적습니다.
   ▸ 🔒 누가 낮게 줬는지는 끝까지 보이지 않습니다 (팀이 3~4명이라 역산 위험).
   ========================================================================== */

/* ---- 설정값 (전부 화면에서 고칠 수 있습니다) ---- */
var INTRA_DEFAULT = {
  t1:0.90,   /* 이 위는 감점 없음 */
  t2:0.80,   /* t2~t1 : 감점 없음 · 교수 화면에만 표시 */
  t3:0.70,   /* t3~t2 : r3 % 감점 */
  t4:0.60,   /* t4~t3 : r4 % 감점 · t4 미만은 r5 % + 교수 확인 필수 */
  r3:10, r4:20, r5:30,
  minEv:2,       /* 나를 평가한 사람이 이보다 적으면 그 회차는 판정하지 않습니다 */
  minRounds:2    /* 판정된 회차 가운데 이 횟수 이상 문턱 아래일 때만 발동 */
};
function IN(){
  var s=DB.d.settings;
  if(!s.intra){ s.intra={}; for(var k in INTRA_DEFAULT) s.intra[k]=INTRA_DEFAULT[k]; DB.flush(); }
  return s.intra;
}
function intraTweak(k, d){
  var c=IN();
  if(k==='t1'||k==='t2'||k==='t3'||k==='t4') c[k]=Math.round(Math.max(0,Math.min(1.5,(Number(c[k])||0)+d))*100)/100;
  else c[k]=Math.max(0, Math.min(100, (Number(c[k])||0)+d));
  DB.flush(); DB.log('팀내평가 감점 설정 변경', k+' → '+c[k]); render();
}
function intraReset(){
  APP.confirm('팀내 평가 감점 설정을 처음 제안값으로 되돌립니다.\n(0.90 이상 없음 · 0.80~0.90 표시만 · 0.70~0.80 10% · 0.60~0.70 20% · 0.60 미만 30%)\n진행할까요?', function(){
    var c=IN(); for(var k in INTRA_DEFAULT) c[k]=INTRA_DEFAULT[k]; DB.flush();
    DB.log('팀내평가 감점 설정 되돌리기','처음 제안값으로'); render();
  });
}

/* ---- 상대비 → 구간 ----
   🔴 화면에 보이는 숫자가 그대로 판정 근거가 되게, **소수 둘째 자리로 반올림한 값**으로
      구간을 정합니다. (0.599 와 0.601 이 둘 다 「0.60」으로 보이는데 감점률이 다르면
      학생에게 설명할 수가 없습니다.) */
function ratRound(x){ return (x==null)? null : Math.round(x*100)/100; }
function intraBand(ratio0){
  var c=IN(), ratio=ratRound(ratio0);
  if(ratio==null)        return {rate:0, label:'판정 못 함', watch:false, confirm:false};
  if(ratio >= c.t1)      return {rate:0,     label:'정상',           watch:false, confirm:false};
  if(ratio >= c.t2)      return {rate:0,     label:'주의 (표시만)',   watch:true,  confirm:false};
  if(ratio >= c.t3)      return {rate:c.r3,  label:c.r3+'% 감점',    watch:true,  confirm:false};
  if(ratio >= c.t4)      return {rate:c.r4,  label:c.r4+'% 감점',    watch:true,  confirm:false};
  return                        {rate:c.r5,  label:c.r5+'% 감점',    watch:true,  confirm:true};
}
function r2d(x){ return x==null? '—' : (Math.round(x*100)/100).toFixed(2); }

/* ==========================================================================
   한 회차 · 한 팀의 팀내 평가
   --------------------------------------------------------------------------
   상대비 = (내가 받은 팀내평가 평균) ÷ (우리 팀 전원의 팀내평가 평균)
   ▸ 「내가 받은 평균」은 **평가자 한 사람의 총점**을 한 건으로 놓고 평균합니다
     (항목 점수 하나하나가 아닙니다 — 19차 절사와 같은 원칙).
   ========================================================================== */
function intraRound(teamId, round){
  var full = rbFull(round,'intra') || 1;
  var ms = teamMembers(teamId);
  var per = ms.map(function(m){
    var rows = DB.get('peerMember', function(x){ return x.round===round && x.studentId===m.st.id; });
    var by={}; rows.forEach(function(x){ (by[x.evaluator]=by[x.evaluator]||[]).push(x.score); });
    var list = Object.keys(by).map(function(k){
      return by[k].reduce(function(a,b){return a+b;},0)/full*100; });
    return {st:m.st, n:list.length,
            mean: list.length? list.reduce(function(a,b){return a+b;},0)/list.length : null};
  });
  var got = per.filter(function(p){ return p.mean!=null; });
  var teamMean = got.length? got.reduce(function(a,b){return a+b.mean;},0)/got.length : null;
  per.forEach(function(p){
    p.ratio = (teamMean && teamMean>0 && p.mean!=null) ? p.mean/teamMean : null;
  });
  return {round:round, per:per, teamMean:teamMean, full:full};
}

/* ---- 학생 한 명의 종합 판정 ---- */
function intraJudge(st){
  var c=IN(), t=teamOf(st);
  if(!t) return {st:st, team:null, rounds:[], judged:0, hit:0, avgRatio:null,
                 suggest:0, why:'팀이 없어 판정하지 않습니다', confirm:false};
  var rounds = [1,2,3].map(function(r){
    var ir = intraRound(t.id, r), mine=null;
    ir.per.forEach(function(p){ if(p.st.id===st.id) mine=p; });
    var n = mine? mine.n : 0;
    var ratio = mine? mine.ratio : null;
    /* 🔴 평가자가 minEv 명보다 적으면 판정하지 않습니다 —
       팀이 3~4명이라 평가자가 2~3명뿐입니다. 한 사람이 낮게 준 것으로 감점되면 안 됩니다. */
    var judged = !!(mine && n >= c.minEv && ratio!=null);
    return {round:r, n:n, ratio:ratio, judged:judged,
            band: judged? intraBand(ratio) : null,
            note: (!mine || n===0)? '평가 없음' : (n<c.minEv? '평가자 '+n+'명 — 판정하지 않음' : '')};
  });
  var jd = rounds.filter(function(r){ return r.judged; });
  var hit = jd.filter(function(r){ return r.band.rate>0; });
  var avgRatio = jd.length? jd.reduce(function(a,b){return a+b.ratio;},0)/jd.length : null;
  var suggest=0, why='', confirm=false;
  if(!jd.length){
    why = '판정할 수 있는 회차가 없습니다 (평가자 '+c.minEv+'명 미만)';
  }else if(hit.length < c.minRounds){
    why = '문턱 아래 '+hit.length+'회 — '+c.minRounds+'회 미만이라 감점하지 않습니다'+
          (jd.length<c.minRounds? ' (판정된 회차가 '+jd.length+'회뿐입니다)':'');
  }else{
    var b = intraBand(avgRatio);
    suggest = b.rate; confirm = b.confirm;
    why = '판정 '+jd.length+'회 중 '+hit.length+'회가 문턱 아래 · 평균 상대비 '+r2d(avgRatio)+' → '+b.label;
  }
  return {st:st, team:t, rounds:rounds, judged:jd.length, hit:hit.length,
          avgRatio:avgRatio, suggest:suggest, why:why, confirm:confirm};
}

/* ---- 적용된 감점 (교수가 [적용]을 눌러야 생깁니다) ---- */
function intraPenRow(sid){ return DB.one('intraPenalty', function(x){ return x.studentId===sid; }); }
function intraPenRate(sid){ var r=intraPenRow(sid); return r? (Number(r.rate)||0) : 0; }
function intraApply(sid){
  var st=DB.one('students', sid); if(!st) return;
  if(!canEdit(st.classId)){ toast('다른 강좌라 적용할 수 없습니다.'); return; }
  var j=intraJudge(st);
  var why=(document.getElementById('inWhy_'+sid)||{}).value||'';
  if(!j.suggest){ toast('감점 대상이 아닙니다.'); return; }
  if(why.replace(/\s/g,'').length<10){ toast('적용 사유를 10자 이상 적어 주세요. (이의제기 때 근거가 됩니다)'); return; }
  APP.confirm(st.name+' ('+st.no+') 학생의 동료평가 점수를 '+j.suggest+'% 감점합니다.\n\n'+
    j.why+'\n\n이 기록은 남습니다. 진행할까요?', function(){
      var ex=intraPenRow(sid);
      var row={studentId:sid, rate:j.suggest, ratio:j.avgRatio, reason:why,
               by:(SESS.acc?SESS.acc.name:'-'), at:nowStr()};
      if(ex) DB.set('intraPenalty', ex.id, row); else DB.add('intraPenalty', row);
      DB.log('팀내평가 감점 적용', st.name+'('+st.no+') '+j.suggest+'% · 사유: '+why);
      toast('감점을 적용했습니다.'); render();
  });
}
function intraCancel(sid){
  var st=DB.one('students', sid); if(!st) return;
  if(!canEdit(st.classId)){ toast('다른 강좌라 고칠 수 없습니다.'); return; }
  APP.confirm(st.name+' ('+st.no+') 학생의 감점을 되돌립니다.\n진행할까요?', function(){
    var ex=intraPenRow(sid);
    if(ex) DB.del('intraPenalty', ex.id);
    DB.log('팀내평가 감점 취소', st.name+'('+st.no+')');
    toast('감점을 되돌렸습니다.'); render();
  });
}

/* 감점이 실제로 몇 점을 깎는지 — 화면에 보여 주려고 미리 셈합니다 */
function intraPeerPreview(st){
  var t=teamOf(st), mk=MK(), before=0;
  if(t){
    MK_ITEMS.filter(function(it){return it.kind==='auto';}).forEach(function(it){
      var r=roundScore100(t.id, it.round);
      if(r.done) before += (r.peer.n? r.peer.mean:0)*r.rule.peerW/100/100*(Number(mk[it.k])||0);
    });
  }
  var j=intraJudge(st), pen=intraPenRow(st.id);
  var rate = pen? (Number(pen.rate)||0) : j.suggest;
  return {before:before, after:before*(1-rate/100), rate:rate};
}

   --------------------------------------------------------------------------
   교수님이 주신 실제 문항 기준으로 다시 그립니다. 절(Ⅱ~Ⅵ)별로 묶어 보여 주고,
   ⭐ 사전 → 최종 비교는 「문항 번호」가 아니라 「짝 이름」으로 잇습니다
      (사전 14번 = 최종 13번처럼 번호가 어긋나 있기 때문입니다).
   ========================================================================== */

/* 그 설문의 응답 (내가 볼 수 있는 강좌만) */
function svAns(kind, cids){
  var sv=DB.one('surveys', function(s){return s.kind===kind;});
  if(!sv) return {sv:null, rows:[]};
  var ok={}; DB.get('students', function(s){return cids.indexOf(s.classId)>=0 && s.active!==false;})
    .forEach(function(s){ ok[s.id]=1; });
  return {sv:sv, rows:DB.get('answers', function(a){return a.surveyId===sv.id && ok[a.studentId];})};
}
/* 5점 평균 — part: ''(보통) / '현재' / '수강전' */
function svMean(rows, qId, part){
  var v=rows.filter(function(a){ return a.qId===qId && (part===undefined || (a.part||'')===part); })
            .map(function(a){ return Number(a.val); })
            .filter(function(x){ return x>=1 && x<=5; });
  if(!v.length) return null;
  var s=0; v.forEach(function(x){s+=x;});
  return {avg:s/v.length, n:v.length};
}
function svBar(label, cnt, mx, wide){
  return '<div class="barrow"><span class="lb" style="width:'+(wide||88)+'px">'+esc(label)+'</span>'+
    '<div class="bar" style="width:'+Math.round(cnt/Math.max(1,mx)*58)+'%"></div><span class="vl">'+cnt+'</span></div>';
}

function dashSurvey(kind, cids){
  var A=svAns(kind, cids); if(!A.sv) return '';
  var sv=A.sv, rows=A.rows;
  var who={}; rows.forEach(function(a){ who[a.studentId]=1; });
  var qs=DB.get('questions', function(q){return q.surveyId===sv.id;}).sort(function(a,b){return a.order-b.order;});
  var h='<div class="card"><h3>3-1. '+esc(kind)+'설문 결과 <span class="muted">('+Object.keys(who).length+'명 응답)</span></h3>'+
    '<p class="muted">'+esc(sv.title)+'</p>';
  if(!rows.length) return h+'<div class="note">아직 응답이 없습니다.</div></div>';

  var lastSect='';
  qs.forEach(function(q){
    if(q.sect!==lastSect){ lastSect=q.sect; h += '<div class="hr"></div><h4>'+esc(q.sect)+'</h4>'; }
    var ttl='<b>'+qNum(q)+esc(String(q.text).split('\n')[0])+'</b>';
    if(q.type==='5점'){
      if(q.dual){
        var m1=svMean(rows,q.id,'현재'), m2=svMean(rows,q.id,'수강전');

      }else{

          cnt[i]=rows.filter(function(a){return a.qId===q.id && Number(a.val)===i;}).length;

            return svBar(lb, cnt[i], mx); }).join('');
      }
    }else if(q.type==='단일' || q.type==='복수'){
      var mx2=1, c2={};
      (q.opts||[]).forEach(function(o){
        c2[o]=rows.filter(function(a){ return a.qId===q.id && String(a.val).indexOf(o)>=0; }).length;
        if(c2[o]>mx2) mx2=c2[o]; });
      h += '<div style="margin-top:6px">'+ttl+'</div>'+
        (q.opts||[]).map(function(o){ return svBar(o, c2[o], mx2, 130); }).join('');
    }else{
      var free=rows.filter(function(a){return a.qId===q.id && String(a.val).trim();});
      h += '<div style="margin-top:6px">'+ttl+' <span class="muted">서술 응답 '+free.length+'건</span></div>'+

          free.slice(0,3).map(function(a){return '· '+esc(String(a.val).slice(0,70));}).join('<br>')+
          (free.length>3? '<br><span class="muted">… 나머지는 원자료를 내려받아 보십시오</span>':'')+'</div>' : '');
    }
  });
  return h+'</div>';
}

/* ⭐ 사전 → 최종 비교 — 짝 이름으로 잇습니다 */

      '<div class="muted">사전 '+(m0?m0.avg.toFixed(2):'-')+' → 최종 '+(m1?m1.avg.toFixed(2):'-')+

  /* ── 고르는 문항(짝은 있으나 평균을 못 내는 것) ── */

    '<tr><th>짝</th><th>사전</th><th>최종</th></tr>';
  [['AI_PAID','유료 여부'],['AI_USE','사용 방식'],['AI_FREQ','사용 빈도'],['AI_TOOLS','주로 쓰는 AI']].forEach(function(x){
    var a=byPair(pq,x[0]), b=byPair(qq,x[0]); if(!a||!b) return;
    function top(rows, q){
      var best='', n=0;
      if(q.type==='서술짧'){
        var t=rows.filter(function(r){return r.qId===q.id && String(r.val).trim();});
        return t.length? t.length+'명 응답':'-';
      }
      (q.opts||[]).forEach(function(o){
        var c=rows.filter(function(r){return r.qId===q.id && String(r.val).indexOf(o)>=0;}).length;
        if(c>n){ n=c; best=o; } });
      return n? esc(best)+' ('+n+'명)':'-';
    }
    h += '<tr><td class="nw">'+x[1]+'</td><td>'+top(P.rows,a)+'</td><td>'+top(Q.rows,b)+'</td></tr>';

  h += '</table></div>'+
    '<p class="muted">이 표와 위 그래프가 학과 성과보고·역량교과목 인증제·혁신지원사업 보고서에 그대로 들어갑니다.</p></div>';
  return h;
}

/* ==========================================================================
   📗 진짜 엑셀 파일(.xlsx) 만들기 — 외부 라이브러리 없이 (2026-08-21 · 14차)
   --------------------------------------------------------------------------
   🔴 교수님 지시: "사전설문과 최종설문의 응답을 엑셀로도 다운 받을 수 있게"

   ▸ 이 앱은 단일 HTML이고 외부 참조가 0건입니다. 그래서 SheetJS 같은 것을
     가져다 쓸 수 없어 .xlsx 를 직접 씁니다.
   ▸ .xlsx 는 XML 몇 개를 zip 으로 묶은 것입니다. zip 은 「압축 없음(stored)」
     으로도 엑셀이 정상적으로 엽니다 — 그래서 압축기를 만들 필요가 없고
     CRC32 와 zip 머리글만 바르게 쓰면 됩니다.
   ▸ ⛔ SpreadsheetML(.xls XML)은 쓰지 않았습니다 — 최신 엑셀이 경고창을 띄웁니다.

   ▸ 🔴 학번이 지수 표기(2.0261E+07)로 바뀌는 사고를 막으려고
     문자열은 모두 inlineStr 로 씁니다. 숫자로 나가는 것은 자바스크립트
     Number 로 넘긴 값뿐입니다 (5점 척도·응답 수·평균).
   ========================================================================== */

/* ---- CRC32 (zip 이 요구하는 검사값) ---- */
var XL_CRCT = null;
function xlCrcTable(){
  if(XL_CRCT) return XL_CRCT;
  XL_CRCT = new Int32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    XL_CRCT[n]=c;
  }
  return XL_CRCT;
}
function xlCrc32(bytes){
  var t=xlCrcTable(), c=0^(-1);
  for(var i=0;i<bytes.length;i++) c = (c>>>8) ^ t[(c ^ bytes[i]) & 0xFF];
  return (c ^ (-1)) >>> 0;
}

/* ---- 글자 → 바이트 (UTF-8). TextEncoder 가 없는 데서도 돌게 직접 씁니다 ---- */
function xlUtf8(str){
  if(typeof TextEncoder!=='undefined') return new TextEncoder().encode(str);
  var out=[], s=String(str);
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6), 0x80|(c&63)); }
    else if(c>=0xD800 && c<0xDC00 && i+1<s.length){
      var c2=s.charCodeAt(++i), u=0x10000+((c-0xD800)<<10)+(c2-0xDC00);
      out.push(0xF0|(u>>18), 0x80|((u>>12)&63), 0x80|((u>>6)&63), 0x80|(u&63));
    }else{ out.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
  }
  return new Uint8Array(out);
}
var XL_ENT = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'};
function xlEsc(s){
  /* 엑셀이 못 읽는 제어문자는 걷어냅니다 (학생 서술에 섞여 들어올 수 있습니다) */
  return String(s==null?'':s)
    .replace(/[&<>"']/g, function(c){ return XL_ENT[c]; })
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
/* 1 → A · 27 → AA (설문은 칸이 40개가 넘습니다) */
function xlCol(n){
  var s='';
  while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
  return s;
}

/* ---- 한 장(시트) 만들기 ----
   rows = [[값,값,...], ...]  · 첫 줄이 머리글이며 굵게 + 고정됩니다 */
function xlSheetXml(rows){
  var wide={};                                   /* 칸 너비 — 글자 수로 어림잡습니다 */
  rows.forEach(function(r){
    for(var i=0;i<r.length;i++){
      var L=String(r[i]==null?'':r[i]).length;
      if(!wide[i] || L>wide[i]) wide[i]=L;
    }
  });
  var cols='<cols>';
  Object.keys(wide).forEach(function(i){
    var w=Math.min(52, Math.max(8, wide[i]*1.35+3));
    cols += '<col min="'+(Number(i)+1)+'" max="'+(Number(i)+1)+'" width="'+w.toFixed(1)+'" customWidth="1"/>';
  });
  cols+='</cols>';

  var body='';
  for(var ri=0; ri<rows.length; ri++){
    var r=rows[ri], cells='';
    for(var ci=0; ci<r.length; ci++){
      var v=r[ci], ref=xlCol(ci+1)+(ri+1), st=(ri===0?' s="1"':'');
      if(v===null || v===undefined || v===''){ cells += '<c r="'+ref+'"'+st+'/>'; continue; }
      if(typeof v==='number' && isFinite(v)){
        cells += '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      }else{
        cells += '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
      }
    }
    body += '<row r="'+(ri+1)+'">'+cells+'</row>';
  }
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetViews><sheetView workbookViewId="0">'+
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'+
      '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/>'+
    '</sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+ cols +
    '<sheetData>'+body+'</sheetData>'+
    '</worksheet>';
}

var XL_STYLES =
 '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
 '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
 '<fonts count="2">'+
   '<font><sz val="11"/><name val="맑은 고딕"/></font>'+

 '</fonts>'+
 '<fills count="3"><fill><patternFill patternType="none"/></fill>'+
   '<fill><patternFill patternType="gray125"/></fill>'+

 '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+
   '<border><left/><right/><top/><bottom style="thin"><color rgb="FF999999"/></bottom><diagonal/></border></borders>'+
 '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+

     '<alignment horizontal="center" vertical="center" wrapText="1"/></xf>'+
 '</cellXfs>'+

/* ---- 압축 없는(stored) zip 으로 묶기 ---- */
function xlZip(files){          /* files = [{name:'xl/workbook.xml', data:Uint8Array}] */
  var chunks=[], central=[], offset=0;
  function u16(n){ return [n&0xFF, (n>>8)&0xFF]; }
  function u32(n){ return [n&0xFF, (n>>8)&0xFF, (n>>16)&0xFF, (n>>24)&0xFF]; }
  /* 날짜는 고정값 — 같은 내용이면 같은 파일이 나오게 (1980-01-01 00:00) */
  var TIME=0, DATE=(1<<5)|1;

  files.forEach(function(f){
    var nm=xlUtf8(f.name), crc=xlCrc32(f.data), sz=f.data.length;
    var head=[].concat([0x50,0x4B,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(TIME), u16(DATE),
                       u32(crc), u32(sz), u32(sz), u16(nm.length), u16(0));
    chunks.push(new Uint8Array(head), nm, f.data);
    central.push({nm:nm, crc:crc, sz:sz, off:offset});
    offset += head.length + nm.length + sz;
  });

  var cdStart=offset, cd=[];
  central.forEach(function(c){
    var h=[].concat([0x50,0x4B,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(TIME), u16(DATE),
                    u32(c.crc), u32(c.sz), u32(c.sz), u16(c.nm.length),
                    u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.off));
    cd.push(new Uint8Array(h), c.nm);
    offset += h.length + c.nm.length;
  });
  var eocd=new Uint8Array([].concat([0x50,0x4B,0x05,0x06], u16(0), u16(0),
    u16(central.length), u16(central.length), u32(offset-cdStart), u32(cdStart), u16(0)));

  var all=chunks.concat(cd, [eocd]), total=0;
  all.forEach(function(x){ total+=x.length; });
  var out=new Uint8Array(total), p=0;
  all.forEach(function(x){ out.set(x, p); p+=x.length; });
  return out;
}

/* ---- 통째로: 시트 여러 장 → .xlsx 바이트 ---- */
function makeXlsx(sheets){       /* sheets = [{name:'사전설문_응답', rows:[[...]]}] */
  var used={}, bad=/[\[\]\*\?\/\\:]/g;
  var names = sheets.map(function(s){
    /* 엑셀이 금지하는 글자와 31자 제한 */
    var n=String(s.name||'Sheet').replace(bad,'_').slice(0,31) || 'Sheet';
    while(used[n]) n = n.slice(0,29)+'_'+(Object.keys(used).length+1);
    used[n]=1; return n;
  });
  var files=[];
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map(function(s,i){ return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" '+
      'ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('')+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    '</Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>';
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    names.map(function(n,i){ return '<sheet name="'+xlEsc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; }).join('')+
    '</sheets></workbook>';
  var wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map(function(s,i){ return '<Relationship Id="rId'+(i+1)+'" '+
      'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" '+
      'Target="worksheets/sheet'+(i+1)+'.xml"/>'; }).join('')+
    '<Relationship Id="rId'+(sheets.length+1)+'" '+
    'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>';

  files.push({name:'[Content_Types].xml', data:xlUtf8(ct)});
  files.push({name:'_rels/.rels', data:xlUtf8(rels)});
  files.push({name:'xl/workbook.xml', data:xlUtf8(wb)});
  files.push({name:'xl/_rels/workbook.xml.rels', data:xlUtf8(wbr)});
  files.push({name:'xl/styles.xml', data:xlUtf8(XL_STYLES)});
  sheets.forEach(function(s,i){
    files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml', data:xlUtf8(xlSheetXml(s.rows||[[]]))});
  });
  return xlZip(files);
}

/* ---- 내려받기 ---- */
function downloadXlsx(name, sheets){
  try{
    var bytes=makeXlsx(sheets);
    var b=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 900);
    toast(name+' 을(를) 내려받았습니다. ('+Math.round(bytes.length/1024)+'KB · 시트 '+sheets.length+'장)');
    return bytes.length;
  }catch(e){
    toast('엑셀 내려받기가 막혔습니다 — 아래 미리보기 표를 긁어 쓰시거나 CSV를 쓰십시오.');
    return 0;
  }
}

/* ==========================================================================
   📄 진짜 워드 파일(.docx) 만들기 — 외부 라이브러리 없이 (2026-08-23 · 20차)
   --------------------------------------------------------------------------
   🔴 교수님 지시: "주차별 모든 활동기록을 a4 용지 크기로 워드, PDF로 다운받고,
                    출력도 가능하도록 해줘"

   ▸ .docx 도 .xlsx 와 똑같이 **XML 몇 개를 zip 으로 묶은 것**입니다.
     그래서 14차에 만든 zip 도구(`xlZip` · `xlCrc32` · `xlUtf8` · `xlEsc`)를
     그대로 다시 씁니다 — ⛔ 압축기를 새로 만들지 않았습니다.
   ▸ 압축 없는(stored) zip 으로도 워드·한글이 정상적으로 엽니다.
   ▸ 🔴 PDF 는 **별도 생성기를 만들지 않습니다.** 브라우저 인쇄 → 「PDF로 저장」이
     정답입니다. 글꼴이 깨지지 않고, 화면 미리보기와 결과가 같습니다.

   ▸ 단위 안내 (워드는 낯선 단위를 씁니다)
       · 길이 = twip (1/20 pt).  A4 = 11906 × 16838 twip
       · 글자 크기 = half-point.  10pt → 20
   ========================================================================== */

var DX_A4_W = 11906, DX_A4_H = 16838;
var DX_MARGIN = 1134;                              /* 2cm */
var DX_BODY_W = DX_A4_W - DX_MARGIN*2;             /* 9638 twip = 글이 들어가는 폭 */
var DX_FONT = 'Malgun Gothic';

function dxEsc(s){ return xlEsc(s); }              /* 제어문자까지 걷어냅니다 */

/* ---- 글자 덩어리 한 개 ---- */
function dxRun(text, o){
  o = o||{};
  var rpr = '<w:rPr>';
  if(o.b) rpr += '<w:b/><w:bCs/>';
  if(o.i) rpr += '<w:i/>';
  if(o.sz) rpr += '<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>';
  if(o.color) rpr += '<w:color w:val="'+o.color+'"/>';
  rpr += '</w:rPr>';
  /* 줄바꿈은 <w:br/> 로 — 그대로 넣으면 워드가 한 줄로 이어 붙입니다 */
  var parts = String(text==null?'':text).split('\n');
  var out='';
  parts.forEach(function(p, i){
    if(i) out += '<w:r>'+rpr+'<w:br/></w:r>';
    if(p!=='') out += '<w:r>'+rpr+'<w:t xml:space="preserve">'+dxEsc(p)+'</w:t></w:r>';
  });
  return out || '<w:r>'+rpr+'<w:t xml:space="preserve"></w:t></w:r>';
}

/* ---- 한 줄(문단) ---- */
function dxP(text, o){
  o = o||{};
  var ppr = '<w:pPr>';
  if(o.page) ppr += '<w:pageBreakBefore/>';
  if(o.align) ppr += '<w:jc w:val="'+o.align+'"/>';
  ppr += '<w:spacing w:before="'+(o.before==null?40:o.before)+'" w:after="'+(o.after==null?40:o.after)+'" w:line="264" w:lineRule="auto"/>';
  if(o.rule) ppr += '<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="2" w:color="000000"/></w:pBdr>';
  if(o.ind) ppr += '<w:ind w:left="'+o.ind+'"/>';
  ppr += '<w:keepNext w:val="'+(o.keep?'true':'false')+'"/></w:pPr>';
  return '<w:p>'+ppr+dxRun(text, o)+'</w:p>';
}
function dxGap(h){ return '<w:p><w:pPr><w:spacing w:before="0" w:after="'+(h||60)+'" w:line="240" w:lineRule="auto"/></w:pPr></w:p>'; }

/* ---- 표 ----
   head = ['머리','글'] (없으면 null) · rows = [[...],[...]] · w = [폭,폭,...] (twip)
   ⚠️ 표 뒤에는 반드시 빈 문단을 둡니다 — 표 두 개가 붙으면 워드가 하나로 합칩니다. */
function dxTable(head, rows, w, o){
  o = o||{};
  var n = (head? head.length : (rows[0]? rows[0].length : 1));
  if(!w || w.length!==n){
    w = []; for(var i=0;i<n;i++) w.push(Math.floor(DX_BODY_W/n));
  }
  var sum = w.reduce(function(a,b){return a+b;},0);
  if(sum !== DX_BODY_W) w[n-1] += (DX_BODY_W - sum);      /* 마지막 칸으로 폭을 맞춥니다 */

  var bd = '<w:tblBorders>'+
    ['top','left','bottom','right','insideH','insideV'].map(function(k){
      return '<w:'+k+' w:val="single" w:sz="4" w:space="0" w:color="666666"/>'; }).join('')+
    '</w:tblBorders>';
  var x = '<w:tbl><w:tblPr><w:tblW w:w="'+DX_BODY_W+'" w:type="dxa"/>'+bd+
    '<w:tblLayout w:type="fixed"/><w:tblCellMar>'+
    '<w:top w:w="40" w:type="dxa"/><w:left w:w="70" w:type="dxa"/>'+
    '<w:bottom w:w="40" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr>'+
    '<w:tblGrid>'+w.map(function(v){ return '<w:gridCol w:w="'+v+'"/>'; }).join('')+'</w:tblGrid>';

  function cell(text, i, opt){
    opt = opt||{};
    return '<w:tc><w:tcPr><w:tcW w:w="'+w[i]+'" w:type="dxa"/>'+
      (opt.fill? '<w:shd w:val="clear" w:color="auto" w:fill="'+opt.fill+'"/>':'')+
      '<w:vAlign w:val="top"/></w:tcPr>'+
      dxP(text, {b:opt.b, sz:opt.sz||(o.sz||18), before:10, after:10,
                 align:(opt.align|| (o.align&&o.align[i]) || null)})+
      '</w:tc>';
  }
  if(head){
    x += '<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>'+
      head.map(function(c,i){ return cell(c, i, {b:true, fill:'E9ECEF'}); }).join('')+'</w:tr>';
  }
  rows.forEach(function(r){
    x += '<w:tr><w:trPr><w:cantSplit/></w:trPr>'+
      r.map(function(c,i){ return cell(c, i, {}); }).join('')+'</w:tr>';
  });
  x += '</w:tbl>' + dxGap(80);
  return x;
}

/* ---- 부품 파일들 ---- */
var DX_STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
  '<w:docDefaults><w:rPrDefault><w:rPr>'+
    '<w:rFonts w:ascii="'+DX_FONT+'" w:eastAsia="'+DX_FONT+'" w:hAnsi="'+DX_FONT+'" w:cs="'+DX_FONT+'"/>'+
    '<w:sz w:val="18"/><w:szCs w:val="18"/><w:lang w:val="ko-KR" w:eastAsia="ko-KR"/>'+
  '</w:rPr></w:rPrDefault>'+
  '<w:pPrDefault><w:pPr><w:spacing w:after="40" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault>'+
  '</w:docDefaults>'+
  '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+
  '<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/>'+
    '<w:tblPr><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="70" w:type="dxa"/>'+
    '<w:bottom w:w="0" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style>'+
  '</w:styles>';

/* ---- 통째로: 본문 XML → .docx 바이트 ---- */
function makeDocx(bodyXml){
  var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<w:body>'+ bodyXml +
    '<w:sectPr>'+
      '<w:pgSz w:w="'+DX_A4_W+'" w:h="'+DX_A4_H+'" w:orient="portrait"/>'+
      '<w:pgMar w:top="'+DX_MARGIN+'" w:right="'+DX_MARGIN+'" w:bottom="'+DX_MARGIN+'" w:left="'+DX_MARGIN+'" '+
        'w:header="851" w:footer="992" w:gutter="0"/>'+
      '<w:cols w:space="425"/><w:docGrid w:linePitch="360"/>'+
    '</w:sectPr></w:body></w:document>';

  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'+
    '</Types>';
  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
    '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'+
    '</Relationships>';
  var drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>';
  var core = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" '+
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" '+
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'+
    '<dc:title>바이오기초설계 주차별 활동기록</dc:title>'+
    '<dc:creator>바이오기초설계 앱</dc:creator><cp:lastModifiedBy>바이오기초설계 앱</cp:lastModifiedBy>'+
    '</cp:coreProperties>';
  var app = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" '+
    'xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">'+
    '<Application>바이오기초설계 앱</Application></Properties>';

  return xlZip([
    {name:'[Content_Types].xml',        data:xlUtf8(ct)},
    {name:'_rels/.rels',                data:xlUtf8(rels)},
    {name:'docProps/core.xml',          data:xlUtf8(core)},
    {name:'docProps/app.xml',           data:xlUtf8(app)},
    {name:'word/document.xml',          data:xlUtf8(doc)},
    {name:'word/_rels/document.xml.rels', data:xlUtf8(drels)},
    {name:'word/styles.xml',            data:xlUtf8(DX_STYLES)}
  ]);
}

function downloadDocx(name, bodyXml){
  try{
    var bytes = makeDocx(bodyXml);
    var b = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    var u = URL.createObjectURL(b), a = document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 900);
    toast(name+' 을(를) 내려받았습니다. ('+Math.round(bytes.length/1024)+'KB)');
    return bytes.length;
  }catch(e){
    toast('워드 내려받기가 막혔습니다 — [인쇄 · PDF로 저장]을 쓰십시오.');
    return 0;
  }
}

/* 🧪 자체 점검용 — 만들어진 document.xml 을 글자 그대로 꺼내 봅니다.
   (zip 을 다시 풀지 않고 같은 방식으로 한 번 더 만들어 확인합니다) */
function makeDocxXmlForCheck(bodyXml){
  return '<w:sectPr>'+
    '<w:pgSz w:w="'+DX_A4_W+'" w:h="'+DX_A4_H+'" w:orient="portrait"/>'+
    '<w:pgMar w:top="'+DX_MARGIN+'" w:right="'+DX_MARGIN+'" w:bottom="'+DX_MARGIN+'" w:left="'+DX_MARGIN+'"/>'+
    '</w:sectPr>' + bodyXml;
}

/* ==========================================================================
   🗂 주차별 활동기록 — 인쇄 · PDF · 워드 (2026-08-23 · 20차)
   --------------------------------------------------------------------------
   🔴 교수님 지시: "교수의 경우, 주차별 모든 활동기록을 a4 용지 크기로
                    워드, PDF로 다운받고, 출력도 가능하도록 해줘"

   ▸ 🔴 **내용을 한 곳(alBlocks)에서만 만듭니다.** 화면(A4 미리보기)·인쇄·워드가
     같은 것을 읽으므로 세 곳이 어긋날 수가 없습니다.
     ⛔ 화면용과 워드용을 따로 짜면 한쪽만 고쳐집니다.
   ▸ 낱장도 됩니다 — `[3주차만]` / `[전체 15주차]`.
   ▸ 🔒 교번은 어디에도 없습니다 · 학생 이름에는 학번을 병기합니다.

   ⚠️ **튜터링 일지(A4 1장)와의 관계**
      튜터링 일지는 **6회차를 한 장씩** 뽑는 「교수 기록물」이고,
      활동기록은 **15주 전체**를 모으는 「학기 전체 기록」입니다.
      활동기록 안의 튜터링 부분은 **일지와 같은 내용**을 씁니다(따로 적지 않습니다).
      일지가 필요하시면 [교수 튜터링 일지]에서 그대로 뽑으시면 됩니다.
   ========================================================================== */

function alDash(v){ return (v==null || v==='') ? '—' : String(v); }
function alSn(st){ return st ? (st.name+' ('+st.no+')') : '—'; }
function alTeams(cid){
  return DB.get('teams', function(t){ return t.classId===cid; }).sort(function(a,b){ return a.no-b.no; });
}
function alTeamLabel(t){ return t.no+'팀 「'+t.name+'」'; }

/* ---- 그 주차에 쌓인 것을 덩어리로 ----
   반환: [{t:'제목', type:'table', head:[], rows:[[]], w:[...]}, {t, type:'p', text}] */
function alBlocks(n, cid){
  var def=wdef(n), w=wrow(n), out=[], teams=alTeams(cid);
  var ss = liveStudents([cid]);

  /* 0. 언제·무엇을 */
  out.push({t:'수업 개요', type:'table', head:['항목','내용'], w:[2200,7438], rows:[
    ['주차', n+'주차'],
    ['일시', tlLongDate(w.date)+' '+tlClassTime(cid)],
    ['활동', def.full],
    ['강좌', cid+(tlRoom(cid)? ' ('+tlRoom(cid)+')':'')+' · 담당교수 '+classProf(cid)],
    ['제출 창', def.win? def.win : '앱 제출 없음 (안내만)'],
    ['마감', w.due? w.due : '—'],
    ['주차 상태', w.state]
  ]});

  /* 1. 안내문 (8·11·15주차) */
  var nt=DB.one('weekNotice', function(x){ return x.classId===cid && x.n===n; });
  if(nt) out.push({t:'안내문 — '+nt.title, type:'p', text:nt.body});

  /* 1b. 현장견학 의견 (11주차) — 학생이 앱에 남긴 견학 소감 (앱 저장 데이터) */
  if(n===11){
    var exs=DB.get('excursion', function(x){ return x.classId===cid && x.week===11; })
              .sort(function(a,b){ return (a.at||'')<(b.at||'')? -1:1; });
    out.push({t:'현장견학 의견', type:'table', head:['작성자','의견','작성시각'], w:[2400,5638,1600],
      rows: exs.length? exs.map(function(x){ return [alDash(x.author), alDash(x.text), alDash(x.at)]; })
                      : [['—','아직 앱에 남긴 견학 의견이 없습니다','']]});
  }

  /* 2. 설문 (1·15주차) */
  if(def.kind==='survey' || def.kind==='final'){
    var kind = (def.kind==='survey')? '사전':'최종';
    var sv = DB.one('surveys', function(x){ return x.kind===kind; });
    var did = sv ? ss.filter(function(s){
      return DB.one('answers', function(a){ return a.surveyId===sv.id && a.studentId===s.id; }); }) : [];
    var not = ss.filter(function(s){ return did.indexOf(s)<0; });
    out.push({t:kind+'설문 응답 현황', type:'table', head:['항목','내용'], w:[2200,7438], rows:[
      ['응답', did.length+' / '+ss.length+'명 ('+(ss.length? Math.round(did.length/ss.length*100):0)+'%)'],
      ['미응답자', not.length? not.map(alSn).join(' · ') : '없음']
    ]});
  }

  /* 3. 팀 편성 · 가주제 (2주차) */
  if(def.kind==='team'){
    out.push({t:'팀 편성', type:'table', head:['팀','이름의 뜻','팀원 (만든 사람 ★)'], w:[2000,2600,5038],
      rows: teams.length? teams.map(function(t){
        var ms=teamMembers(t.id);
        return [alTeamLabel(t), alDash(t.meaning),
          ms.map(function(m){ return alSn(m.st)+(isTeamCreator(t,m.st)?' ★':''); }).join('\n')];
      }) : [['—','아직 팀이 없습니다','']]});
    out.push({t:'가주제 3개', type:'table', head:['팀','가주제','한 줄 설명'], w:[1800,3200,4638],
      rows: (function(){
        var r=[];
        teams.forEach(function(t){
          var tps=teamTopics(t.id);
          if(!tps.length){ r.push([alTeamLabel(t),'—','아직 내지 않았습니다']); return; }
          tps.forEach(function(tp,i){ r.push([i===0? alTeamLabel(t):'', '가주제 '+tp.no+' '+tp.title, alDash(tp.summary)]); });
        });
        return r.length? r : [['—','','']];
      })()});
  }

  /* 4. 3주차 조사 제출함 */
  if(def.kind==='research'){
    out.push({t:'제출 현황', type:'table', head:['팀','제출','마지막 저장'], w:[2600,2400,4638],
      rows: teams.map(function(t){
        var c=subCount(t.id);
        var last='';
        teamTopics(t.id).forEach(function(tp){ var r=subRow(t.id,tp.id); if(r && r.at && r.at>last) last=r.at; });
        return [alTeamLabel(t), c.done+' / '+(c.need||3)+'개'+(c.temp? ' (임시저장 '+c.temp+')':''), alDash(last)];
      })});
    var rows=[];
    teams.forEach(function(t){
      teamTopics(t.id).forEach(function(tp){
        var r=subRow(t.id, tp.id);
        if(!r || !subHasText(r)) return;
        rows.push([alTeamLabel(t), '가주제 '+tp.no+' '+tp.title,
          '【배경】 '+alDash(r.back)+'\n【필요성】 '+alDash(r.need)+'\n【조사 방법】 '+alDash(r.how)+
          (r.refs? '\n【참고자료】 '+r.refs : '')]);
      });
    });
    out.push({t:'학생이 낸 내용', type:'table', head:['팀','가주제','내용'], w:[1700,2200,5738],
      rows: rows.length? rows : [['—','','아직 제출된 내용이 없습니다']]});
  }

  /* 5. 5주차 최종 주제 선정 (앱 저장 데이터) */
  if(def.kind==='finaltopic'){
    out.push({t:'최종 주제 선정', type:'table', head:['팀','최종 주제','선정 사유','교수 승인'], w:[1800,2400,4238,1200],
      rows: teams.map(function(t){
        var f=DB.one('topics', function(x){ return x.teamId===t.id && x.kind==='최종'; });
        return [alTeamLabel(t), f? f.title:'—', f? alDash(f.summary):'아직 내지 않았습니다', (f&&f.ok)?'승인':'—'];
      })});
  }
  /* 🔴 2026-08-23 20차 — 6·9·10·12주차는 「타이틀만」 주차입니다(학생 앱 입력 삭제, p5_weekstu.js).
     영상은 KOSAc·드라이브로, 앱 개발은 수업에서 진행하므로 앱에 저장되는 학생 제출물이 없습니다.
     그래서 옛 영상 블록(kind:'video')·팀 활동 블록(kind:'activity')·12주차 준비상황 표는 뽑지 않습니다.
     ⛔ 이 블록들을 되살리면 「아직 내지 않았습니다」만 가득한 빈 표가 출력됩니다.
     ▸ 교수 튜터링(tutor:N)은 교수가 앱에 쓰는 기록이라 그대로 남습니다(아래 7번). */
  if(def.kind==='prep'){
    /* 12주차 학생 입력(준비도·발표자·남은 과제)은 제외. 「최종발표 평가기준 공개」는
       학생 입력이 아니라 교수가 앱에 공개한 정보(rubrics)라 안내로 남깁니다. */
    var op=DB.get('rubrics', function(r){ return r.round===3 && r.openAt; });
    out.push({t:'최종발표 평가기준 공개', type:'p',
      text: op.length? ('공개일 '+op[0].openAt+' · 3회차 루브릭 전문을 학생 화면에 공개했습니다.\n학기말 이의제기 때 「기준을 몰랐다」를 반박하는 근거가 됩니다.')
                     : '아직 공개하지 않았습니다.'});
  }

  /* 6. 평가 주차 (4·7·13·14) */
  if(def.kind==='eval'){
    var rd=def.round;
    var asg=DB.get('assign', function(a){ return a.n===n; }).sort(function(a,b){ return a.order-b.order; });
    out.push({t:'발표 순서', type:'table', head:['순서','팀','강좌','담당교수'], w:[1200,4238,1800,2400],
      rows: asg.length? asg.map(function(a){
        var t=DB.one('teams', a.teamId);
        return [String(a.order), t? alTeamLabel(t):'—', t? t.classId:'—', t? classProf(t.classId):'—'];
      }) : [['—','발표 순서가 아직 정해지지 않았습니다','','']]});

    var evTeams = asg.length? asg.map(function(a){ return DB.one('teams', a.teamId); }).filter(Boolean)
                            : teams;
    out.push({t:'교수평가 결과', type:'table', head:['팀','채점 교수','원점수 / 만점','100점 환산'], w:[3000,2200,2200,2238],
      rows: evTeams.map(function(t){
        var rows2=DB.get('profEval', function(x){ return x.round===rd && x.teamId===t.id; });
        var full=rbFull(rd,'prof')||1;
        if(!rows2.length) return [alTeamLabel(t), '아직 없음','—','—'];
        var by={}; rows2.forEach(function(x){ (by[x.profId]=by[x.profId]||[]).push(x.score); });
        var who=Object.keys(by).map(function(k){ return pn(k); }).join(' · ');
        var raw=Object.keys(by).map(function(k){ return by[k].reduce(function(a,b){return a+b;},0); });
        var p100=profRound100(t.id, rd);
        return [alTeamLabel(t), who+' ('+raw.length+'명)', raw.join(' / ')+' / '+full,
                p100? (Math.round(p100.mean*10)/10)+'점' : '—'];
      })});

    var sub = ss.filter(function(s){ return DB.one('peerTeam', function(p){ return p.round===rd && p.evaluator===s.id; }); });
    var subM = ss.filter(function(s){ return DB.one('peerMember', function(p){ return p.round===rd && p.evaluator===s.id; }); });
    out.push({t:'동료평가 제출 현황', type:'table', head:['구분','제출','미제출자'], w:[1800,1600,6238], rows:[
      ['팀간 평가', sub.length+' / '+ss.length+'명',
        ss.filter(function(s){ return sub.indexOf(s)<0; }).map(alSn).join(' · ') || '없음'],
      ['팀내 평가', subM.length+' / '+ss.length+'명',
        ss.filter(function(s){ return subM.indexOf(s)<0; }).map(alSn).join(' · ') || '없음']
    ]});

    out.push({t:'팀별 동료평가(팀간) 점수 — 절사 내역', type:'table', head:['팀','받은 평가','절사 내역','평균(100)'], w:[2600,1600,3838,1600],
      rows: evTeams.map(function(t){
        var q=peerScore100(t.id, rd);
        return [alTeamLabel(t), q.n+'건', q.why, q.n? (Math.round(q.mean*10)/10)+'점':'—'];
      })});
    out.push({t:'🔒 알림', type:'p',
      text:'누가 누구를 어떻게 평가했는지는 이 기록에도 남기지 않습니다. 교수님께도 익명입니다.'});
  }

  /* 7. 튜터링 (3·5·6·9·10·12주차) */
  if(def.tutor){
    out.push({t:'교수 튜터링 '+def.tutor+'회차', type:'table',
      head:['팀','팀 구성원','팀 주제','튜터링 내용'], w:[1500,2200,2200,3738],
      rows: teams.map(function(t){
        var tu=DB.one('tutoring', function(x){ return x.teamId===t.id && x.round===def.tutor; });
        var wrote = !!(tu && tu.done!==false);
        var ms=teamMembers(t.id);
        var names = ms.map(function(m){
          return m.st.name; }).join(' · ');
        var fin=DB.one('topics', function(x){ return x.teamId===t.id && x.kind==='최종'; });
        var tps=teamTopics(t.id);
        var topic = fin? ('[최종] '+fin.title)
                       : (tps.length? tps.map(function(tp,i){ return (i+1)+') '+tp.title; }).join('\n') : '가주제 미정');
        var talk = wrote
          ? (alDash(tu.talk) + (tu.fix? '\n【지적】 '+tu.fix:'') + (tu.next? '\n【다음까지】 '+tu.next:''))
          : '— 미작성 —';
        return [alTeamLabel(t), names||'팀원 없음', topic, talk];
      })});
    out.push({t:'', type:'p',
      text:'※ 튜터링 일지는 [교수 튜터링 일지] 화면에서 회차별 A4 1장으로 따로 뽑을 수 있습니다. 여기 내용과 같습니다.'});
  }

  /* 8. 아무것도 없는 주차 */
  if(out.length===1) out.push({t:'', type:'p', text:'이 주차에는 앱에 쌓인 기록이 없습니다. (안내문만 있는 주차이거나 아직 시작되지 않았습니다)'});
  return out;
}

function alSheet(n, cid){
  var w=wrow(n), def=wdef(n);
  var blocks=alBlocks(n, cid);
  var body = blocks.map(function(b){
    var head = b.t ? '<div class="alh">'+esc(b.t)+'</div>' : '';
    if(b.type==='p') return head+'<div class="alp">'+esc(b.text).replace(/\n/g,'<br>')+'</div>';
    var total = (b.w||[]).reduce(function(a,c){return a+c;},0) || 1;
    return head+'<table class="sct al">'+
      '<colgroup>'+(b.w||[]).map(function(v){ return '<col style="width:'+(v/total*100).toFixed(2)+'%">'; }).join('')+'</colgroup>'+
      '<thead><tr>'+b.head.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('')+'</tr></thead>'+
      '<tbody>'+b.rows.map(function(r){
        return '<tr>'+r.map(function(c){ return '<td>'+esc(c).replace(/\n/g,'<br>')+'</td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table>';
  }).join('');
  return '<div class="a4sheet" data-what="'+esc(n+'주차 활동기록')+'"><div class="a4in">'+
    '<div class="tlhead">'+
      '<div class="tltitle">주차별 활동기록 — '+n+'주차</div>'+
      '<div class="tlrule"></div>'+
      '<table class="tlmeta"><tr>'+
        '<td class="k">교과목</td><td class="v">바이오기초설계 (2026학년도 2학기)</td>'+
        '<td class="k">강좌</td><td class="v">'+esc(cid)+(tlRoom(cid)?' ('+esc(tlRoom(cid))+')':'')+'</td></tr>'+
      '<tr>'+
        '<td class="k">담당교수</td><td class="v">'+esc(classProf(cid))+'</td>'+
        '<td class="k">일시</td><td class="v">'+esc(tlLongDate(w.date))+' '+esc(tlClassTime(cid))+'</td></tr>'+
      '<tr>'+
        '<td class="k">활동</td><td class="v">'+esc(def.full)+'</td>'+
        '<td class="k">출력일</td><td class="v">'+esc(nowStr().slice(0,10))+'</td></tr>'+
      '</table></div>'+
    body +
    '<div class="scfoot1">이 앱은 점수 합산까지 돕습니다. 학점 판정은 교수님들이 하십니다.</div>'+
    '<div class="tlfoot"><span>'+n+'주차 활동기록 · '+esc(clsFull(cid))+'</span><span class="sp"></span>'+
      (DB.d && DB.d.__demo ? '<span class="warn">※ 예시(가짜) 데이터입니다</span>&nbsp;&nbsp;':'')+
      '<span>출력일 '+esc(nowStr().slice(0,10))+'</span></div>'+
    '</div></div>';
}

   ② 워드 (.docx) — 화면과 같은 alBlocks 를 씁니다
   ========================================================================== */
function alDocxBody(list, cid){
  var out='';
  list.forEach(function(n, idx){
    var w=wrow(n), def=wdef(n);
    out += dxP('주차별 활동기록 — '+n+'주차', {b:true, sz:30, align:'center', page: idx>0, after:60, keep:true});
    out += dxP('바이오기초설계 (2026학년도 2학기) · '+cid+(tlRoom(cid)? ' ('+tlRoom(cid)+')':'')+
               ' · 담당교수 '+classProf(cid), {sz:18, align:'center', color:'444444', after:40});
    out += dxP(tlLongDate(w.date)+' '+tlClassTime(cid)+' · '+def.full,
               {sz:18, align:'center', color:'444444', rule:true, after:120});
    if(DB.d && DB.d.__demo)
      out += dxP('※ 예시(가짜) 데이터입니다 — 실제 기록이 아닙니다.', {sz:16, color:'8A1010', after:100});

    alBlocks(n, cid).forEach(function(b){
      if(b.t) out += dxP(b.t, {b:true, sz:22, before:120, after:50, keep:true});
      if(b.type==='p'){ out += dxP(b.text, {sz:18, after:80}); return; }
      out += dxTable(b.head, b.rows, b.w, {sz:16});
    });
    out += dxP('이 앱은 점수 합산까지 돕습니다. 학점 판정은 교수님들이 하십니다.', {sz:14, color:'666666', before:120, after:0});
    out += dxP('출력일 '+nowStr().slice(0,10)+' · '+n+'주차 활동기록 · '+clsFull(cid),
               {sz:14, color:'666666', before:0});
  });
  return out;
}
function alDownloadDocx(){
  var cid = alCid(), list = alList();
  var name = 'activity_log_'+cid+'_'+nowStr().slice(0,10).replace(/-/g,'')+
             (list.length===1? '_w'+list[0] : '_all')+'.docx';
  downloadDocx(name, alDocxBody(list, cid));
}

  out += dxP('· 「—」는 아직 입력되지 않은 항목입니다. 이 표는 등급이 아니며, 학점 판정은 담당교수님이 하십니다.', {sz:15, color:'444444', after:40});

/* ---- 학생 개인 한 장 — 🔒 그 학생 본인 점수만 ---- */
function scCalcTextPlain(it){
  if(it.kind==='input') return it.typed? '담당교수가 직접 입력한 점수입니다.' : '아직 입력되지 않았습니다.';
  var d = it.detail;
  if(!d || !d.done) return '아직 점수가 없습니다'+(d&&d.lack? ' — '+d.lack : '')+'.';
  var s = '팀 점수 '+r1d(d.score)+'점(100점 기준) × '+it.full+' ÷ 100\n'+
    '= 교수평가 '+r1d(d.prof? d.prof.mean:0)+' × '+d.rule.profW+'%'+(d.prof? ' (교수 '+d.prof.n+'명 평균)':'')+
    ' + 동료평가 '+r1d(d.peer.n? d.peer.mean:0)+' × '+d.rule.peerW+'%\n'+
    '동료평가 '+d.peer.why;
  if(it.pen) s += '\n⚖️ 팀내 평가 감점 '+it.pen+'% — 동료평가 몫에서 '+r1d(it.cut)+'점 감점(교수평가 몫은 그대로) → '+r1d(it.got)+'점';
  return s;
}

  var head = ['항목','배점','받은 점수','어떻게 계산했나'];

/* ==========================================================================
   ② 팀 점수표 — A4/PDF + Word (신설)
   ▸ 값은 calcGrades(cid) 하나에서만 옵니다(팀 순위 화면과 같은 계산).
   ========================================================================== */
/* 🔴 R13 — 점수는 「실제 배점으로 환산한 값」을 주로 보입니다.
   · 각 발표평가 환산 = roundScore100/100 × 그 회차 배점(MK 에서 옵니다 · 하드코딩 금지)
     발표1 → 10점 만점 · 발표2 → 20점 만점 · 최종발표 → 25점 만점
   · 「발표 합계(환산)」 = 채점이 끝난 회차의 환산 점수를 더한 값 (만점 = 그 회차들 배점 합)
   · 100점 기준값은 괄호로 병기합니다. */
function rpFull(k){ return Number(MK()[k])||0; }
function rpConv(v100, k){ return (v100==null)? null : v100/100*rpFull(k); }
function teamScoreRows(cid){
  var g = calcGrades(cid);
  return g.rows.map(function(r, i){
    var by = { r1:null, r2:null, r3:null };
    (r.rounds||[]).forEach(function(rd){ if(rd.key && (rd.key in by)) by[rd.key] = (rd.done? rd.score : null); });
    var c1=rpConv(by.r1,'r1'), c2=rpConv(by.r2,'r2'), c3=rpConv(by.r3,'r3');
    var presSum = (c1||0)+(c2||0)+(c3||0);                     /* 환산 합계 (채점된 회차만) */
    var presFull = (by.r1!=null? rpFull('r1'):0)+(by.r2!=null? rpFull('r2'):0)+(by.r3!=null? rpFull('r3'):0);
    return { rank:i+1, t:r.t, r1:by.r1, r2:by.r2, r3:by.r3,
             c1:c1, c2:c2, c3:c3, presSum:presSum, presFull:presFull,
             prof:r.prof, peer:r.peer, total100:r.total };
  });
}
/* 발표 3회 배점 합 (기본 55) — 표 머리글에 씁니다 */
function rpPresMax(){ return rpFull('r1')+rpFull('r2')+rpFull('r3'); }
/* 환산값 표시 — 값(만점) 병기. 100기준을 괄호로 */
function rpConvCell(cv, v100){
  if(cv==null) return '-';
  return r1d(cv)+'<br><span class="dim">'+rpNum(v100)+'/100</span>';
}

/* ==========================================================================
   ③ 발표평가 정리표 — A4/PDF + Word (신설)
   회차(중간발표평가1·2·최종발표평가)마다 · 팀 단위로
     교수평가 / 동료평가(팀간) / 동료평가(팀내, 참고) 를 정리합니다.
   🔒 개별 학생 점수·평가자 신원은 넣지 않습니다 — 팀 집계값만.
   ========================================================================== */
/* 회차 → 배점 열쇠(r1/r2/r3) · 배점 */
function rpRoundKey(round){ var it=rpRoundItem(round); return it? it.k : ('r'+round); }
function rpRoundFull(round){ return rpFull(rpRoundKey(round)); }
function evalSummaryData(round, cid){
  var teams = DB.get('teams', function(t){ return t.classId===cid; }).sort(function(a,b){ return a.no-b.no; });
  var full = rpRoundFull(round);
  return teams.map(function(t){
    var p  = profRound100(t.id, round);          /* {n, mean} or null */
    var q  = peerScore100(t.id, round);          /* trimMean: {n, mean, why, trimmed} */
    var ir = intraRound(t.id, round);            /* {per, teamMean, full} — 팀내 */
    var rs = roundScore100(t.id, round);         /* {score, done, ...} */
    var intraN = ir.per.filter(function(pp){ return pp.mean!=null; }).length;
    var s100 = rs.done? rs.score : null;
    return { t:t, ir:ir,
      profMean: p? p.mean : null, profN: p? p.n : 0,
      peerMean: q.n? q.mean : null, peerN: q.n, peerTrimmed: !!q.trimmed,
      intraMean: ir.teamMean, intraN: intraN,
      score: s100, conv: (s100==null? null : s100/100*full) };
  });
}
/* ---- 루브릭 양식(무엇을 어떤 기준으로 평가했나) — 3종 (교수·팀간·팀내) ----
   화면·인쇄용 HTML. 값은 DB.get('rubrics') 그대로, 문구는 rbLevels(r) 그대로. */
function evalRubricHTML(round){
  var h = '';
  [['prof','교수평가'],['inter','동료평가 — 팀간'],['intra','동료평가 — 팀내']].forEach(function(k){
    var rs = DB.get('rubrics', function(r){ return r.round===round && r.kind===k[0]; })
               .sort(function(a,b){ return a.order-b.order; });
    if(!rs.length){ h += '<div class="scnote"><b>['+k[1]+']</b> 등록된 루브릭이 없습니다.</div>'; return; }
    var sum=0; rs.forEach(function(r){ sum += (r.max||4); });
    h += '<div class="scnote"><b>['+k[1]+'] 평가 기준</b> — '+rs.length+'개 항목 · 항목마다 4단계 · 합계 '+sum+'점</div>';
    rs.forEach(function(r){
      var lv = rbLevels(r), max = r.max||4;
      h += '<table class="sct"><colgroup><col style="width:14mm"><col style="width:160mm"></colgroup>'+
        '<thead><tr><th class="c" colspan="2">'+esc(r.name)+'</th></tr></thead><tbody>'+
        lv.map(function(txt,idx){
          return '<tr><td class="c"><b>'+(max-idx)+'점</b></td><td>'+esc(txt)+'</td></tr>';
        }).join('')+'</tbody></table>';
    });
  });
  return h;
}

function evalRubricDocx(round){
  var out = dxP('■ 이 회차에 사용한 평가 루브릭 — 무엇을 어떤 기준으로 평가했는지',
                {b:true, sz:20, before:160, after:60, keep:true});
  [['prof','교수평가'],['inter','동료평가 — 팀간'],['intra','동료평가 — 팀내']].forEach(function(k){
    var rs = DB.get('rubrics', function(r){ return r.round===round && r.kind===k[0]; })
               .sort(function(a,b){ return a.order-b.order; });
    if(!rs.length){ out += dxP('['+k[1]+'] 등록된 루브릭이 없습니다.', {sz:16, color:'8A1010', after:60}); return; }
    var sum=0; rs.forEach(function(r){ sum += (r.max||4); });
    out += dxP('['+k[1]+'] — '+rs.length+'개 항목 · 항목마다 4단계 · 합계 '+sum+'점',
               {b:true, sz:17, before:100, after:40, keep:true});
    rs.forEach(function(r){
      var lv = rbLevels(r), max = r.max||4;
      var rows = lv.map(function(txt,idx){ return [String(max-idx)+'점', txt]; });
      out += dxTable([r.name, ''], rows, [900, 8738], {sz:15, align:{0:'center'}});
    });
  });
  return out;
}

   ▸ 화면 A4 일지(tlSheet)와 같은 자료를 씁니다. 회차마다 새 쪽에서 시작합니다.

function tlTopicPlain(t){
  var fin = DB.one('topics', function(x){ return x.teamId===t.id && x.kind==='최종'; });
  if(fin) return '[최종] '+fin.title;
  var tps = teamTopics(t.id);
  if(!tps.length) return '(가주제 미정)';
  return '[가주제] '+tps.map(function(tp, i){ return (i+1)+') '+tp.title; }).join('  ');
}
function tlDocxBody(list, cid){
  var cap = teamCap(), out='';
  list.forEach(function(round, idx){
    var week = tlWeekOf(round), w = week? wrow(week) : null, iso = w? w.date : '';
    out += dxP('교수 튜터링 일지 ('+round+'차)', {b:true, sz:30, align:'center', page: idx>0, after:60, keep:true})+
      dxP('바이오기초설계 (2026학년도 2학기) · '+cid+(tlRoom(cid)?' ('+tlRoom(cid)+')':'')+' · 담당교수 '+classProf(cid),
          {sz:18, align:'center', color:'444444', after:40})+
      dxP((week? week+'주차':'-')+' · '+tlLongDate(iso)+' '+tlClassTime(cid)+' · '+round+'차 / 총 '+tlTotal()+'회',
          {sz:18, align:'center', color:'444444', rule:true, after:120})+
      rpDemoWarnDocx();

    var teams = DB.get('teams', function(t){ return t.classId===cid; }).sort(function(a,b){ return a.no-b.no; });
    var byNo = {}; teams.forEach(function(t){ byNo[t.no]=t; });
    var head = ['팀','팀 구성원 · 팀 주제','튜터링 내용'];
    var rows = [];
    for(var i=1;i<=cap;i++){
      var t = byNo[i] || null;
      if(!t){ rows.push([i+'팀', '(팀 미구성)', '— 미작성 —']); continue; }
      var tu = DB.one('tutoring', function(x){ return x.teamId===t.id && x.round===round; });
      var wrote = !!(tu && tu.done!==false);
      var ms = teamMembers(t.id);
      var names = ms.length
        ? ms.map(function(m){
            return m.st.name + (tlDupName(m.st.name)? '('+m.st.no+')' : '');
          }).join('·')
        : '팀원 없음';
      var memTopic = names + '\n' + tlTopicPlain(t);
      var talk;
      if(!wrote){ talk = '— 미작성 —'; }
      else {
        talk = (tu.talk || '');
        if(tu.fix)  talk += '\n[지적] '+tu.fix;
        if(tu.next) talk += '\n[다음까지] '+tu.next;
      }
      rows.push([t.no+'팀 「'+t.name+'」', memTopic, talk]);
    }
    out += dxTable(head, rows, [1600, 3200, 4838], {sz:15});
    out += rpFootDocx(round+'차 교수 튜터링 일지 · '+clsFull(cid));
  });
  return out;
}

  var one = (list.length===1);

/* ==========================================================================

   ▸ 값은 pY_svreport.js 의 집계함수(svrAggRows·svrRespond·svrRate)를 그대로 씁니다.
   ▸ 문항별 응답수·평균·분포를 표로 정리합니다. 그래프 대시보드는 [설문 결과] 화면에 있습니다.
   ========================================================================== */
function svAggForKind(kind, cids){
  return svrAggRows(cids).filter(function(r, i){ return i>0 && r[0]===kind; });
}
function svRespInfo(kind, cids){
  var sv = svrSv(kind);
  var n = sv? svrRespond(sv, cids) : 0, tot=0;
  svrRate(cids).forEach(function(x){ tot += x.tot; });
  return { n:n, tot:tot, sv:sv };
}
/* 집계 한 줄 → 화면/워드 공용 셀 배열: [절, 문항, 구분/보기, 응답수, 평균, 분포] */
function svAggCells(r){
  var isScale = (r[7]!=='' && r[7]!=null);
  var dist = isScale
    ? [1,2,3,4,5].map(function(i){ return i+':'+r[7+i]; }).join(' ')
    : '';
  var kb = (r[5]? (r[4]==='선택'||r[4]==='선택(복수)'? r[5] : r[4]+' '+r[5]) : r[4]);
  return [ String(r[1]), String(r[3]), String(kb),

/* ==========================================================================

   ▸ 교수님 지시: "출력물 1번은 주차별 계획을 정리한 내용이 A4 1장. 1주차=오리엔테이션
     +사전설문, 2주차=팀구성·가주제 선정 등 활동 내용과 결과물을 구분해서, 15주차까지
     한 학기에 뭐 했는지 한눈에."
   ▸ 값은 WEEKDEF(제목·kind·tutor·round·flag)와 주차설정(wrow 날짜) 그대로 씁니다.
     회차·주제를 손으로 박지 않으므로 WEEKDEF 가 바뀌면 이 표도 저절로 따라갑니다.
   ▸ A4 세로 1장에 16주가 다 들어가도록 tlFit 이 글자를 줄입니다(8pt까지).
   ▸ 강좌와 무관한 「강좌 공통 학기 계획」입니다 — 날짜·수업시간은 3개 강좌가 같습니다.
   ========================================================================== */
/* 한 주차 → {act:[활동 내용], res:[결과물]} — def 의 성질에서 뽑습니다 */
function wpCells(def){
  var act=[], res=[], K=def.kind;
  if(K==='survey'){ act.push('오리엔테이션 · 평가방식 안내'); act.push('사전설문조사'); res.push('사전설문 응답'); }
  else if(K==='team'){ act.push('팀 구성(팀명·의미)'); act.push('가주제 3개 선정'); act.push('KOSAc 소개'); res.push('팀 편성표'); res.push('가주제 3개'); }
  else if(K==='research'){ act.push('가주제 조사 · 자료 제출'); res.push('조사 자료 제출물'); }
  else if(K==='finaltopic'){ act.push('최종 주제 1개 선정'); res.push('최종 주제'); }
  else if(K==='video'){ act.push('광고 영상 제작'); res.push('광고 영상 가편집본'); }
  else if(K==='activity'){ act.push('최종 앱 개발'); res.push('앱 개발 기록'); if(def.boost) act.push('영상 보강(필요 팀)'); }
  else if(K==='prep'){ act.push('최종 앱 개발'); act.push('최종발표 평가기준 공개'); res.push('발표 준비 상황'); res.push('평가기준 공개'); }
  else if(K==='eval'){
    var lbl = def.round===1?'중간발표1' : def.round===2?'중간발표2' : (def.n===13?'최종발표1':'최종발표2');
    act.push(lbl+' 발표 · 평가');
    if(def.film) act.push('KOSAc(광고영상) 제출');
    if(def.joint) act.push('3개 강좌 합동');
    if(def.intra) act.push('팀내 평가');
    res.push((def.round===3?'최종발표평가':('발표평가'+def.round))+' 점수(교수·동료)');
    if(def.intra) res.push('팀내 평가 결과');
  }
  else if(K==='notice'){
    if(def.n===8){ act.push('중간고사(서면 평가)'); res.push('중간고사 점수'); }
    else if(def.n===11){ act.push('현장견학'); res.push('팀별 견학 의견(견학 일지)'); }
    else act.push(def.full||def.title);
  }
  else if(K==='final'){ act.push('기말고사'); act.push('최종설문조사'); res.push('기말 점수'); res.push('최종설문 응답'); }
  else if(K==='result'){ act.push('최종 결과 확인(6개 분야 점수+총합)'); res.push('개인 최종 점수표'); }
  else act.push(def.full||def.title);
  if(def.tutor){ act.push('교수 튜터링 '+def.tutor+'회차'); res.push('튜터링 일지 '+def.tutor+'차'); }
  if(!res.length) res.push('—');
  return { act:act, res:res };
}

/* ==========================================================================

      응답을 엑셀로도 다운 받을 수 있게 해주고, 각각의 설문 결과를 보기 좋게

      좋겠어"

   ▸ 세 가지입니다 — ① 엑셀 ② 그래프 ③ 해석.
   ▸ 🔴 ③ 해석이 가장 위험합니다. 앱이 자동으로 쓴 글은 근거 없는 주장이 되기 쉽습니다.
     그래서 **계산에서 바로 나오는 사실만** 쓰고, 아래 낱말은 자체 점검이 막습니다:
       향상 · 유의하게 · 덕분에 · 성공적 · 우수 · 효과적 · 입증 · 크게 …
     인과(=이 수업 덕분에)와 통계적 유의성은 25명 단일 집단·대조군 없음이라
     이 설문만으로 말할 수 없습니다.
   ▸ 교수님이 [수정]으로 고치실 수 있고, 고친 글이 저장·인쇄됩니다.
